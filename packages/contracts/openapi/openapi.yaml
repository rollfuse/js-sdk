          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAttachmentDownloadResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Not found, or belongs to another Organization (identical
