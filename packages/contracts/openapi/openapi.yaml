        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSegmentRequest"
            example:
              name: Brazilian iOS users
              conditions:
                - attribute: country
                  value: BR
                - attribute: platform
                  value: ios
      responses:
        "201":
          description: Segment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
              example:
