  /scim/v2/Users:
    post:
      operationId: provisionScimUser
      summary: Provision a SCIM User
      description: >-
        Requires a ScimToken bearer token. Idempotent per externalId: a
        second provisioning request for the same externalId returns the
        existing User rather than creating a duplicate.
      tags: [scim]
      security:
        - scimTokenAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUserRequest"
            example:
              externalId: 018f2f3a-d200-7000-9c3a-1f2b3c4d5e6f
              userName: person@example.com
              displayName: Person
      responses:
        "201":
          description: SCIM User provisioned (or reused).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    get:
      operationId: listScimUsers
      summary: Look up a SCIM User by userName
      description: >-
        Requires a ScimToken bearer token. Only the
        `filter=userName eq "<value>"` filter form is supported.
      tags: [scim]
      security:
        - scimTokenAuth: []
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
          example: userName eq "person@example.com"
      responses:
        "200":
          description: Matching SCIM Users (at most one).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /scim/v2/Users/{user_id}:
    get:
      operationId: getScimUser
      summary: Retrieve a SCIM User by id
      description: >-
        Requires a ScimToken bearer token. A user id belonging to a
        different Organization than the presented token is treated as
        not found.
      tags: [scim]
      security:
        - scimTokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SCIM User.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User was not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    patch:
      operationId: deactivateScimUser
      summary: Deactivate a SCIM User
      description: >-
        Requires a ScimToken bearer token. Restricted to toggling
        `active` to `false` (SCIM deprovisioning); revokes every active
        Session the underlying Member holds.
      tags: [scim]
      security:
        - scimTokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchRequest"
            example:
              Operations:
                - op: replace
                  path: active
                  value: false
      responses:
        "200":
          description: SCIM User deactivated.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Only deactivation (active=false) is supported.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User was not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /v1/organizations/{organization_id}/billing/subscription:
    get:
      operationId: getOrganizationSubscription
      summary: Read an organization's current subscription
      description: >-
        Requires a session for a Member holding billing:manage. An
        `organization_id` other than the caller's own Organization is
        rejected identically to an unknown one. An Organization with no
        Subscription yet (one whose default-plan enrollment failed, or one
        predating enrollment) is not an error: the response omits
        `subscription`.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The organization's current subscription, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                subscription:
                  id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                  status: active
                  plan:
                    key: pro
                    display_name: Pro
                    description: For growing teams
                    plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                    version: 1
                  grants:
                    - resource_key: project
                      policy_kind: finite
                      policy_limit: 10
                  price:
                    id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                    amount: 4900
                    currency: BRL
                    interval: month
                  cycle_end_at: "2026-02-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_not_found
                  message: Billing information was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/subscription/plan-change:
    post:
      operationId: changeOrganizationPlan
      summary: Change an organization's plan and price
      description: >-
        Requires a session for a Member holding billing:manage. Both
        `plan_version_id` and `price_id` are required: a plan version may
        carry several prices (e.g. monthly and annual), so the target price
        is not derivable from the plan version alone. An upgrade applies
        immediately, prorated; a downgrade is agreed now and applied at the
        end of the current billing cycle. Upgrade/downgrade is classified by
        comparing entitlement grants, never by price, so switching billing
        interval on the same plan version applies immediately.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePlanRequest"
            example:
              plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
              price_id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
      responses:
        "200":
          description: The subscription after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                subscription:
                  id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                  status: active
                  plan:
                    key: pro
                    display_name: Pro
                    description: For growing teams
                    plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                    version: 1
                  grants:
                    - resource_key: project
                      policy_kind: finite
                      policy_limit: 10
                  price:
                    id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                    amount: 4900
                    currency: BRL
                    interval: month
                  cycle_end_at: "2026-02-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: price_id is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, it has no
            Subscription to change, or the target plan version/price was not
            found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The subscription is not in a state that allows this change
            (`billing_subscription_conflict`), or the selected `price_id` is
            not the one this organization's pricing-experiment assignment
            offers for the target plan (`price_not_assigned`, which applies
            only until the organization's first subscription to that plan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: price_not_assigned
                  message: This organization may only subscribe to its assigned price for this plan.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/subscription/checkout:
    post:
      operationId: checkoutOrganizationSubscription
      summary: Start a new checkout for an organization with no blocking subscription
      description: >-
        Requires a session for a Member holding billing:manage. Starts an
        independent, brand-new Subscription for the organization — never a
        reactivation of a prior canceled one. Reachable only while the
        organization has no Subscription in `trialing`, `active`,
        `past_due`, or `suspended` state: an organization with no
        Subscription at all, or whose most recent one is `canceled`, is
        eligible. Always requires a freshly collected `payment_method_id`
        (see POST .../billing/setup-intent) — a canceled Subscription's own
        payment method and gateway subscription are never reused.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
              price_id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
              payment_method_id: pm_1NxSampleCardId
      responses:
        "201":
          description: The newly created subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                subscription:
                  id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                  status: active
                  plan:
                    key: starter
                    display_name: Starter
                    description: For small teams
                    plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                    version: 1
                  grants:
                    - resource_key: project
                      policy_kind: finite
                      policy_limit: 3
                  price:
                    id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                    amount: 1900
                    currency: BRL
                    interval: month
                  cycle_end_at: "2026-02-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: payment_method_id is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, or the
            target plan version/price was not found. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The organization already has a Subscription in a blocking
            state (`billing_subscription_conflict`), or the selected
            `price_id` is not the one this organization's
            pricing-experiment assignment offers for the target plan
            (`price_not_assigned`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_subscription_conflict
                  message: This organization already has an active subscription.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/billing/plans:
    get:
      operationId: listBillingPlans
      summary: List the published plan catalog
      description: >-
        Returns every PlanDefinition's current PlanVersion, its entitlement
        grants and every associated price. The catalog is platform-wide, not
        Organization-scoped — it is identical for every prospective
        subscriber and discloses nothing about any Organization — so it
        requires only a valid session, with no billing:manage check. One
        exception narrows presentation only: when the session's own
        organization holds a pricing-experiment assignment for a plan and
        has no subscription to that plan yet, that plan lists only the
        assigned price. The organization is always taken from the session,
        never from the request.
      tags: [billing]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The published plan catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCatalog"
              example:
                plans:
                  - plan:
                      key: starter
                      display_name: Starter
                      description: Entry-level plan
                      plan_version_id: 018f2f3a-8300-7000-9c3a-1f2b3c4d5e6f
                      version: 1
                    is_default: true
                    grants:
                      - resource_key: project
                        policy_kind: finite
                        policy_limit: 3
                    prices:
                      - id: 018f2f3a-8400-7000-9c3a-1f2b3c4d5e6f
                        amount: 0
                        currency: BRL
                        interval: month
                  - plan:
                      key: pro
                      display_name: Pro
                      description: For growing teams
                      plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                      version: 1
                    is_default: false
                    grants:
                      - resource_key: project
                        policy_kind: finite
                        policy_limit: 10
                    prices:
                      - id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                        amount: 4900
                        currency: BRL
                        interval: month
                      - id: 018f2f3a-8500-7000-9c3a-1f2b3c4d5e6f
                        amount: 49000
                        currency: BRL
                        interval: year
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    AuditEvent:
      type: object
      required:
        - id
        - organization_id
        - event_type
        - subject_type
        - subject_id
        - payload
        - created_at
      properties:
        id:
          type: string
        organization_id:
          type: string
        event_type:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: >-
            The event's JSON document. Its shape varies by event_type; it is
            an opaque, schema-less record of what happened.
        created_at:
          type: string
          format: date-time

    AuditEventList:
      type: object
      required: [audit_events, limit, offset]
      properties:
        audit_events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.

    ListProjectsResponse:
      type: object
      required: [projects, limit, offset]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.

    ListFeatureFlagsResponse:
      type: object
      required: [feature_flags, limit, offset]
      properties:
        feature_flags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.

    ListEnvironmentsResponse:
      type: object
      required: [environments, limit, offset]
      properties:
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.

    VisitorConsentState:
      type: object
      required: [analytics, marketing]
      additionalProperties: false
      properties:
        analytics:
          type: boolean
        marketing:
          type: boolean

    VisitorAcquisition:
      type: object
      additionalProperties: false
      properties:
        utm_source:
          type: string
          maxLength: 255
        utm_medium:
          type: string
          maxLength: 255
        utm_campaign:
          type: string
          maxLength: 255
        utm_term:
          type: string
          maxLength: 255
        utm_content:
          type: string
          maxLength: 255
        landing_url:
          type: string
          maxLength: 2048
        referrer:
          type: string
          maxLength: 2048

    VisitorJourneyEvent:
      type: object
      required: [name, route, occurred_at]
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
            - pageview
            - signup_started
            - signup_completed
            - lead_submitted
            - login_completed
            - checkout_started
            - checkout_completed
          description: >-
            A closed set. An event named anything else is rejected, so the
            value can never become unbounded and visitor-controlled.
        route:
          type: string
          maxLength: 512
          description: >-
            A pathname only, already normalized to its route template by
            the client. A value carrying a query string or fragment is
            rejected rather than truncated.
        properties:
          type: object
          additionalProperties:
            type: string
            maxLength: 120
          description: >-
            At most 10 entries, keys drawn from a closed allowlist. Values
            containing an "@" are rejected, so this cannot become a channel
            for personal data.
        occurred_at:
          type: string
          format: date-time

    RecordVisitorEventsRequest:
      type: object
      required: [visitor_id, session_id, locale, consent, events]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64
          description: >-
            A pseudonymous, browser-generated opaque token. Never derived
            from an IP address, user agent, email or anything else that
            would identify the visitor across sites.
        session_id:
          type: string
          maxLength: 64
        locale:
          type: string
          enum: [en, pt-br]
        consent:
          $ref: "#/components/schemas/VisitorConsentState"
        acquisition:
          $ref: "#/components/schemas/VisitorAcquisition"
        events:
          type: array
          items:
            $ref: "#/components/schemas/VisitorJourneyEvent"

    RecordVisitorConsentRequest:
      type: object
      required: [visitor_id, analytics, marketing, policy_version, decided_at]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64
        analytics:
          type: boolean
        marketing:
          type: boolean
        policy_version:
          type: string
          maxLength: 40
          description: The cookie-policy version the decision was made against.
        decided_at:
          type: string
          format: date-time

    IdentifyVisitorRequest:
      type: object
      required: [visitor_id, lead_id]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64
        lead_id:
          type: string
          maxLength: 64

    IdentifyVisitorAsMemberRequest:
      type: object
      required: [visitor_id]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64

    VisitorIngestAccepted:
      type: object
      required: [accepted]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          description: >-
            Whether the submission was queued. It is false both when the
            queue is saturated and when the submission was discarded for
            lack of consent — deliberately, so the caller learns nothing
            about stored state.

    VisitorCorrelationBucket:
      type: object
      required: [utm_source, utm_medium, utm_campaign, state, visitors]
      properties:
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        state:
          type: string
          enum: [unidentified, lead, member]
        visitors:
          type: integer
          description: Distinct visitors in this bucket, counted once each.

    VisitorCorrelation:
      type: object
      required: [from, to, buckets]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/VisitorCorrelationBucket"

    CreateLeadRequest:
      type: object
      required: [email, locale]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
        tier:
          type: string
          maxLength: 80
        company_name:
          type: string
          maxLength: 200
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_term:
          type: string
        utm_content:
          type: string
        landing_url:
          type: string
        referrer:
          type: string
        locale:
          type: string
          enum: [en, pt-br]
          description: >-
            The marketing-site locale the lead was submitted from, inferred
            by the client from the page's route.
        visitor_session_id:
          type: string
          maxLength: 64
          description: >-
            The submitting browser's pseudonymous visitor id, sent only when
            the visitor granted analytics consent. Optional: a submission
            without it is equally valid, and stitching the Lead to that
            visitor's journey never affects whether the Lead is persisted.

    Lead:
      type: object
      required: [id, email, locale, captured_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        tier:
          type: string
        company_name:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_term:
          type: string
        utm_content:
          type: string
        landing_url:
          type: string
        referrer:
          type: string
        locale:
          type: string
          enum: [en, pt-br]
        captured_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, slug, region]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        region:
          type: string
          enum: [us, eu]

    Organization:
      type: object
      required: [id, name, slug, region, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        region:
          type: string
          enum: [us, eu]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationResponse:
      description: >-
        An Organization plus its single-use identity-provider bootstrap
        credential, returned in plaintext exactly once and never
        retrievable again.
      type: object
      required: [id, name, slug, region, created_at, updated_at, identity_provider_bootstrap_token]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        region:
          type: string
          enum: [us, eu]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        identity_provider_bootstrap_token:
          type: string
          description: >-
            Single-use, 30-minute credential authorizing exactly one call
            to PUT /v1/organizations/{organization_id}/identity-provider
            before the Organization has any Member.

    CreateProjectRequest:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    Project:
      type: object
      required: [id, organization_id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEnvironmentRequest:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

    Environment:
      type: object
      required: [id, project_id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VariationInput:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        value: {}

    CreateFeatureFlagRequest:
      type: object
      required: [name, key, variations]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        key:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        variations:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/VariationInput"

    Variation:
      type: object
      required: [id, key, value]
      properties:
        id:
          type: string
        key:
          type: string
        value: {}

    FeatureFlag:
      type: object
      required:
        [id, project_id, name, key, variations, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        key:
          type: string
        variations:
          type: array
          items:
            $ref: "#/components/schemas/Variation"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the feature flag was archived, or null when it is active.
            Archiving is a soft state: the flag, its variations and all of
            its history remain readable, only its entitlement slot is
            released and its targeting disabled everywhere.

    RolloutSplit:
      type: object
      required: [variation_id, percentage]
      additionalProperties: false
      properties:
        variation_id:
          type: string
        percentage:
          type: integer
          minimum: 1
          maximum: 100

    Outcome:
      type: object
      additionalProperties: false
      properties:
        variation_id:
          type: string
        rollout:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RolloutSplit"

    RuleInput:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        attribute:
          type: string
          description: >-
            Mutually exclusive with segment_id. Both attribute and value
            set is an inline equality condition; both empty (with no
            segment_id) is an unconditional catch-all.
        value:
          type: string
        segment_id:
          type: string
          description: >-
            References an existing Segment's conditions instead of an
            inline attribute/value pair. Mutually exclusive with attribute.
        outcome:
          $ref: "#/components/schemas/Outcome"

    Rule:
      type: object
      required: [outcome]
      properties:
        attribute:
          type: string
        value:
          type: string
        segment_id:
          type: string
        outcome:
          $ref: "#/components/schemas/Outcome"

    PutEnvironmentFlagConfigRequest:
      type: object
      required: [enabled, default_variation_id, rules]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        default_variation_id:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleInput"

    EnvironmentFlagConfig:
