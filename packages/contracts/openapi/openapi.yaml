      responses:
        "201":
          description: Message posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddSupportMessageResponse"
        "400":
          description: Missing message body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Not found, or belongs to another Organization (identical
            response either way).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The submitting Member exceeded the per-Member rate limit.
          content:
