        tags:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 20
          description: >-
            Optional. When present, replaces the flag's tags wholesale.
            Omit this field entirely to leave existing tags untouched.

    Variation:
      type: object
      required: [id, key, value]
      properties:
        id:
          type: string
        key:
          type: string
        value: {}

    FeatureFlag:
      type: object
      required:
        [id, project_id, name, description, key, variations, tags, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        key:
          type: string
        variations:
          type: array
