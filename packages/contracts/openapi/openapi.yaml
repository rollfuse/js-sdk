    CreateConnectorRequest:
      type: object
      required:
        [name, template_id, source_url, secret, metric_definition_id, environment_id]
      properties:
        name:
          type: string
        template_id:
          type: string
          description: >-
            The ContractTemplate this Connector's mapping comes from —
            either platform-scoped (usable by any Project) or
            project-scoped and owned by this same Project.
        template_version:
          type: integer
          description: >-
            Optional. Pins the Connector to a specific, approved version
            of template_id. Omitted resolves to template_id's highest
            currently approved version at creation time. Immutable after
            creation except via an explicit later edit — see
            UpdateConnectorRequest.
        source_url:
          type: string
          description: >-
            Must be an https URL. It is parsed and its scheme is checked,
            so a value that merely begins with "https" but is not a valid
            https URL is refused. The pull secret is presented to this URL
            as a bearer credential on every sync, so a plaintext
            destination is never accepted.
        secret:
          type: string
        metric_definition_id:
          type: string
        environment_id:
          type: string

    UpdateConnectorRequest:
      type: object
      required: [name, source_url, metric_definition_id, environment_id]
      properties:
        name:
          type: string
        template_id:
          type: string
          description: >-
            Optional. Omitted keeps the Connector's current template
            reference unchanged. Supplying a different (template_id,
            template_version) than the Connector currently has is the
            only way to recover a `broken` Connector to `active`.
        template_version:
          type: integer
          description: >-
            Optional. Only consulted when template_id is also supplied;
            omitted then resolves to template_id's highest currently
            approved version.
        source_url:
          type: string
          description: >-
            Must be an https URL, checked the same way
            CreateConnectorRequest.source_url is.
        metric_definition_id:
          type: string
        environment_id:
          type: string
        secret:
          type: string
          description: >-
            Optional. A non-empty value rotates the pull secret; omitted
            or empty leaves the existing secret untouched.

    PreviewMappingRequest:
      type: object
      required:
        [source_url, root_path, value_field, observed_at_field, observed_at_format]
      properties:
        source_url:
          type: string
          description: >-
            Must be an https URL, checked the same way
            CreateConnectorRequest.source_url is.
        secret:
          type: string
          description: >-
            Optional. Sent as a Bearer token to source_url, same as a
            Connector's own pull secret.
        root_path:
          type: string
        value_field:
          type: string
        observed_at_field:
          type: string
        observed_at_format:
          type: string
          enum: [rfc3339, unix_ms, unix_seconds]
        subject_key_field:
          type: string

    PreviewObservation:
      type: object
      required: [value, observed_at]
      properties:
        value:
          type: number
        observed_at:
          type: string
          format: date-time
        subject_key:
          type: string

    PreviewMappingResponse:
      type: object
      required: [raw_response]
      properties:
        raw_response:
          description: The raw, JSON-parsed response fetched from source_url.
        observations:
          type: array
          items:
            $ref: "#/components/schemas/PreviewObservation"
          description: >-
            The Observations the mapping produces from raw_response.
            Absent when error is present.
        error:
          type: string
          description: >-
            Present instead of observations when the mapping fails to
            resolve against raw_response (e.g. a field path not found).
            raw_response is still returned in this case.

    Connector:
      type: object
      # Mutually exclusive with ConnectorCreated below (both otherwise
      # share every property): a response carrying `secret` is always
      # ConnectorCreated — see its own description of when an update
      # response includes a rotated secret.
      not:
        required: [secret]
      required:
        [
          id,
          project_id,
          name,
          template_id,
          template_version,
          source_url,
          metric_definition_id,
          environment_id,
          status,
          consecutive_mapping_mismatches,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        template_id:
          type: string
        template_version:
          type: integer
          description: >-
            The version of template_id's mapping this Connector is
            pinned to. Changes only via an explicit edit.
        source_url:
          type: string
        metric_definition_id:
          type: string
        environment_id:
          type: string
        status:
          type: string
          enum: [active, disabled, broken]
        secret:
          type: string
          description: >-
            Never present here — the sibling `not` requirement excludes it.
            Declared only so that requirement references a defined
            property; see ConnectorCreated for when a response actually
            carries the plaintext secret.
        last_sync_status:
          type: string
          enum: [succeeded, failed]
          description: Absent when this Connector has never been synced.
        last_sync_at:
          type: string
          format: date-time
          description: Absent when this Connector has never been synced.
        last_sync_error:
          type: string
          description: Absent on success or when this Connector has never been synced.
        last_sync_failure_kind:
          type: string
          enum:
            [
              unreachable,
              timeout,
              non_2xx,
              oversized,
              mapping_mismatch,
              insecure_destination,
              internal_error,
            ]
          description: >-
            Absent on success or when this Connector has never been
            synced. Only mapping_mismatch counts toward the automatic
            circuit breaker that transitions status to broken.
            insecure_destination means this Connector's source_url is not
            an https URL: it was configured before that was required, and
            no sync will present the pull secret to it until the
            source_url is corrected.
        last_sync_observation_count:
          type: integer
          description: Absent when this Connector has never synced successfully.
        consecutive_mapping_mismatches:
          type: integer
          description: >-
            Consecutive mapping_mismatch failures. Resets to zero on a
            successful sync; a transient failure leaves it unchanged.
            Reaching 3 transitions status to broken.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConnectorCreated:
      type: object
      required:
        [
          id,
          project_id,
          name,
          template_id,
          template_version,
          source_url,
          metric_definition_id,
          environment_id,
          status,
          consecutive_mapping_mismatches,
          secret,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        template_id:
          type: string
        template_version:
          type: integer
          description: >-
            The version of template_id's mapping this Connector is
            pinned to. Changes only via an explicit edit.
        source_url:
          type: string
        metric_definition_id:
          type: string
        environment_id:
          type: string
        status:
          type: string
          enum: [active, disabled, broken]
        secret:
          type: string
          description: >-
            The plaintext pull secret. Returned only in the creation
            response, or an update response that rotated it; no other
            response ever includes it.
        last_sync_status:
          type: string
          enum: [succeeded, failed]
          description: Absent when this Connector has never been synced.
        last_sync_at:
          type: string
          format: date-time
          description: Absent when this Connector has never been synced.
        last_sync_error:
          type: string
          description: Absent on success or when this Connector has never been synced.
        last_sync_failure_kind:
          type: string
          enum:
            [
              unreachable,
              timeout,
              non_2xx,
              oversized,
              mapping_mismatch,
              insecure_destination,
              internal_error,
            ]
          description: >-
            Absent on success or when this Connector has never been
            synced. Only mapping_mismatch counts toward the automatic
            circuit breaker that transitions status to broken.
            insecure_destination means this Connector's source_url is not
            an https URL: it was configured before that was required, and
            no sync will present the pull secret to it until the
            source_url is corrected.
        last_sync_observation_count:
          type: integer
          description: Absent when this Connector has never synced successfully.
        consecutive_mapping_mismatches:
          type: integer
          description: >-
            Consecutive mapping_mismatch failures. Resets to zero on a
            successful sync; a transient failure leaves it unchanged.
            Reaching 3 transitions status to broken.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyEvaluation:
