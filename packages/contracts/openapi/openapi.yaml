  /v1/rollouts/{rollout_id}/guardrails/{guardrail_id}:
    get:
      operationId: getGuardrail
      summary: Get a Guardrail by id, scoped to its owning Rollout
      description: >-
        Requires a session for a Member holding guardrails:manage. A
        Guardrail requested through the wrong Rollout id, or whose
        Rollout belongs to another Organization, returns the same
        not-found response as a nonexistent Guardrail (non-disclosing).
      tags: [guardrail-auto-rollback]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
        - name: guardrail_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guardrail found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrail"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold guardrails:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Guardrail was not found, belongs to a different Rollout, or
            its Rollout belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_not_found
                  message: Guardrail was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    patch:
      operationId: updateGuardrail
      summary: Update a Guardrail's tunables, scoped to its owning Rollout
      description: >-
        Requires a session for a Member holding guardrails:manage.
        Replaces comparison_operator, threshold,
        evaluation_window_seconds, promote_after_healthy_seconds,
        pause_after_uncertain_seconds and resume_cool_down_seconds
        wholesale — there is no partial-patch shape. rollout_id and
        metric_definition_id are not updatable; a Guardrail requested
        through the wrong Rollout id, or whose Rollout belongs to another
        Organization, returns the same not-found response as a
        nonexistent Guardrail (non-disclosing), matching GET on this same
        path.
      tags: [guardrail-auto-rollback]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
        - name: guardrail_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuardrailRequest"
