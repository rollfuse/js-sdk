  /scim/v2/Users:
    post:
      operationId: provisionScimUser
      summary: Provision a SCIM User
      description: >-
        Requires a ScimToken bearer token. Idempotent per externalId: a
        second provisioning request for the same externalId returns the
        existing User rather than creating a duplicate.
      tags: [scim]
      security:
        - scimTokenAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUserRequest"
            example:
              externalId: 018f2f3a-d200-7000-9c3a-1f2b3c4d5e6f
              userName: person@example.com
              displayName: Person
      responses:
        "201":
          description: SCIM User provisioned (or reused).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "409":
          description: >-
            The organization has no available seat, so no Member was
            created. Retrying succeeds once a seat is freed (a Member is
            deactivated) or the plan is upgraded. Re-provisioning an
            externalId that already has a Member is unaffected: it reuses
            that Member and consumes no additional seat.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    get:
      operationId: listScimUsers
      summary: Look up a SCIM User by userName
      description: >-
        Requires a ScimToken bearer token. Only the
        `filter=userName eq "<value>"` filter form is supported.
      tags: [scim]
      security:
        - scimTokenAuth: []
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
          example: userName eq "person@example.com"
      responses:
        "200":
          description: Matching SCIM Users (at most one).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /scim/v2/Users/{user_id}:
    get:
      operationId: getScimUser
      summary: Retrieve a SCIM User by id
      description: >-
        Requires a ScimToken bearer token. A user id belonging to a
        different Organization than the presented token is treated as
        not found.
      tags: [scim]
      security:
        - scimTokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SCIM User.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User was not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    patch:
      operationId: deactivateScimUser
      summary: Deactivate a SCIM User
      description: >-
        Requires a ScimToken bearer token. Restricted to toggling
        `active` to `false` (SCIM deprovisioning); revokes every active
        Session the underlying Member holds.
      tags: [scim]
      security:
        - scimTokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchRequest"
            example:
              Operations:
                - op: replace
                  path: active
                  value: false
      responses:
        "200":
          description: SCIM User deactivated.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Only deactivation (active=false) is supported.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid ScimToken.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User was not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /v1/organizations/{organization_id}/billing/subscription:
    get:
      operationId: getOrganizationSubscription
      summary: Read an organization's current subscription
      description: >-
        Requires a session for a Member holding billing:manage. An
        `organization_id` other than the caller's own Organization is
        rejected identically to an unknown one. An Organization with no
        Subscription yet (one whose default-plan enrollment failed, or one
        predating enrollment) is not an error: the response omits
        `subscription`.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The organization's current subscription, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                subscription:
                  id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                  status: active
                  plan:
                    key: pro
                    display_name: Pro
                    description: For growing teams
                    plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                    version: 1
                  grants:
                    - resource_key: project
                      policy_kind: finite
                      policy_limit: 10
                  price:
                    id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                    amount: 4900
                    currency: BRL
                    interval: month
                  cycle_end_at: "2026-02-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_not_found
                  message: Billing information was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/subscription/plan-change:
    post:
      operationId: changeOrganizationPlan
      summary: Change an organization's plan and price
      description: >-
        Requires a session for a Member holding billing:manage. Both
        `plan_version_id` and `price_id` are required: a plan version may
        carry several prices (e.g. monthly and annual), so the target price
        is not derivable from the plan version alone. An upgrade applies
        immediately, prorated; a downgrade is agreed now and applied at the
        end of the current billing cycle. Upgrade/downgrade is classified by
        comparing entitlement grants, never by price, so switching billing
        interval on the same plan version applies immediately.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePlanRequest"
            example:
              plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
              price_id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
      responses:
        "200":
          description: The subscription after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                subscription:
                  id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                  status: active
                  plan:
                    key: pro
                    display_name: Pro
                    description: For growing teams
                    plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                    version: 1
                  grants:
                    - resource_key: project
                      policy_kind: finite
                      policy_limit: 10
                  price:
                    id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                    amount: 4900
                    currency: BRL
                    interval: month
                  cycle_end_at: "2026-02-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: price_id is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, it has no
            Subscription to change, or the target plan version/price was not
            found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The subscription is not in a state that allows this change
            (`billing_subscription_conflict`), or the selected `price_id` is
            not the one this organization's pricing-experiment assignment
            offers for the target plan (`price_not_assigned`, which applies
            only until the organization's first subscription to that plan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: price_not_assigned
                  message: This organization may only subscribe to its assigned price for this plan.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/subscription/checkout:
    post:
      operationId: checkoutOrganizationSubscription
      summary: Start a new checkout for an organization with no blocking subscription
      description: >-
        Requires a session for a Member holding billing:manage. Starts an
        independent, brand-new Subscription for the organization — never a
        reactivation of a prior canceled one. Reachable only while the
        organization has no Subscription in `trialing`, `active`,
        `past_due`, or `suspended` state: an organization with no
        Subscription at all, or whose most recent one is `canceled`, is
        eligible. Always requires a freshly collected `payment_method_id`
        (see POST .../billing/setup-intent) — a canceled Subscription's own
        payment method and gateway subscription are never reused.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
              price_id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
              payment_method_id: pm_1NxSampleCardId
      responses:
        "201":
          description: The newly created subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                subscription:
                  id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                  status: active
                  plan:
                    key: starter
                    display_name: Starter
                    description: For small teams
                    plan_version_id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                    version: 1
                  grants:
                    - resource_key: project
                      policy_kind: finite
                      policy_limit: 3
                  price:
                    id: 018f2f3a-8200-7000-9c3a-1f2b3c4d5e6f
                    amount: 1900
                    currency: BRL
                    interval: month
                  cycle_end_at: "2026-02-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: payment_method_id is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, or the
            target plan version/price was not found. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The organization already has a Subscription in a blocking
            state (`billing_subscription_conflict`), or the selected
            `price_id` is not the one this organization's
            pricing-experiment assignment offers for the target plan
            (`price_not_assigned`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_subscription_conflict
                  message: This organization already has an active subscription.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/subscription/cancel:
    post:
      operationId: cancelOrganizationSubscription
      summary: Cancel an organization's subscription
      description: >-
        Requires a session for a Member holding billing:manage. Takes no
        request body. Always classified as a voluntary cancellation — a
        non-payment cancellation only ever arrives through the payment
        gateway's own webhook path, never through this endpoint. Returns the
        subscription in its new, canceled state.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The now-canceled subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscription"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, or has no
            Subscription at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The subscription is still on the platform's default $0 plan —
            there is no paid cycle to cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_nothing_to_cancel
                  message: This subscription has no paid plan to cancel.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/setup-intent:
    post:
      operationId: createOrganizationSetupIntent
      summary: Create a setup intent to collect a new payment method
      description: >-
        Requires a session for a Member holding billing:manage. Takes no
        request body. Creates nothing billable — it only lazily resolves the
        organization's gateway customer and returns a client secret the
        frontend confirms directly against the payment gateway before the
        collected payment method is ever referenced by a checkout, plan
        change or replacement call.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A client secret for the frontend to confirm against the payment gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSetupIntentResponse"
              example:
                client_secret: seti_1NxSample_secret_abc123
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The requested Organization is not the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/billing/billing-details:
    post:
      operationId: updateOrganizationBillingDetails
      summary: Update an organization's invoicing details
      description: >-
        Requires a session for a Member holding billing:manage. Creates
        nothing billable — it only lazily resolves the organization's
        gateway customer and forwards the supplied details to it. Every
        field is required.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillingDetailsRequest"
            example:
              billing_email: billing@example.com
              organization_legal_name: Acme Inc
              country: BR
              tax_id: "12345678000199"
      responses:
        "204":
          description: The billing details were updated.
        "400":
          description: Validation error, malformed JSON body, or a missing required field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: billing_email is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The requested Organization is not the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/billing/payment-method:
    get:
      operationId: getOrganizationPaymentMethod
      summary: Read the organization's saved payment method
      description: >-
        Requires a session for a Member holding billing:manage. Returns
        enough of the saved instrument to recognize it — brand, last four
        digits and expiry — and never a full instrument number, a
        fingerprint, or the gateway's own payment method id. The instrument
        is resolved from the caller's own Organization's subscription; the
        caller never names a payment method. An Organization with nothing on
        record is not an error: `present` is false and `payment_method` is
        omitted.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The organization's payment method of record, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPaymentMethod"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                present: true
                payment_method:
                  brand: visa
                  last4: "4242"
                  exp_month: 12
                  exp_year: 2030
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: replaceOrganizationPaymentMethod
      summary: Replace the organization's saved payment method
      description: >-
        Requires a session for a Member holding billing:manage.
        `payment_method_id` names an instrument the browser has already
        collected and verified directly against the payment gateway (a
        confirmed setup intent on this Organization's gateway customer) — no
        card data ever reaches this API. The new instrument becomes the one
        the gateway bills the subscription against and the one future
        one-off charges are raised against. The response is the saved
        method's summary, so the caller confirms the replacement by what is
        now on file.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePaymentMethodRequest"
            example:
              payment_method_id: pm_1QZxYzAbCdEfGhIj
      responses:
        "200":
          description: The payment method now on record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPaymentMethod"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                present: true
                payment_method:
                  brand: mastercard
                  last4: "4444"
                  exp_month: 8
                  exp_year: 2029
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: payment_method_id is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, or it has no
            subscription to bill. Deliberately indistinguishable from an
            unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The payment provider does not hold the named payment method
            (`payment_method_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: payment_method_not_found
                  message: That payment method is not available at the payment provider. Add it again.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/charges:
    get:
      operationId: listOrganizationCharges
      summary: List the organization's charges
      description: >-
        Requires a session for a Member holding billing:manage. Returns the
        caller's own Organization's charges, newest first, with the
        gateway-hosted invoice and receipt URLs the payment provider
        published for each. A charge the provider published no such document
        for omits the field entirely rather than returning an empty string.
        The list is capped; `has_more` reports that older charges were
        withheld.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The organization's charges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationChargeList"
              example:
                charges:
                  - id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                    organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                    status: paid
                    amount: 4900
                    currency: BRL
                    refunded_amount: 0
                    hosted_invoice_url: https://invoice.stripe.com/i/acct_1/live_1
                    receipt_url: https://pay.stripe.com/receipts/payment/receipt_1
                    created_at: "2026-01-01T12:00:00Z"
                  - id: 018f2f3a-9001-7000-9c3a-1f2b3c4d5e6f
                    organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                    status: pending
                    amount: 1900
                    currency: BRL
                    refunded_amount: 0
                    created_at: "2026-01-02T12:00:00Z"
                has_more: false
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/billing/charges/{charge_id}:
    get:
      operationId: getOrganizationCharge
      summary: Read one of the organization's charges
      description: >-
        Requires a session for a Member holding billing:manage. A charge
        belonging to another Organization is rejected identically to one
        that does not exist, so a caller cannot learn which of the two it
        was.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: charge_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The charge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationChargeItem"
              example:
                charge:
                  id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                  organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                  status: paid
                  amount: 4900
                  currency: BRL
                  refunded_amount: 0
                  hosted_invoice_url: https://invoice.stripe.com/i/acct_1/live_1
                  receipt_url: https://pay.stripe.com/receipts/payment/receipt_1
                  created_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold billing:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The charge does not exist, or belongs to another Organization,
            or the requested Organization is not the caller's own — one
            deliberately non-revealing response for all three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_not_found
                  message: Billing information was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/billing/subscription-status:
    get:
      operationId: getOrganizationSubscriptionStatus
      summary: Read the organization's subscription status
      description: >-
        Requires a session, and deliberately NOT billing:manage — the only
        Organization-scoped billing read that does not. The console shell
        tells every member of a suspended Organization that its published
        configuration is no longer being served, so a member without
        billing:manage must be able to learn that much. Widening the
        audience is paid for by narrowing the disclosure: the response
        carries the subscription's status and nothing else. An
        `organization_id` other than the caller's own is rejected
        identically to an unknown one. `status` is omitted for an
        Organization with no subscription.
      tags: [billing]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The organization's subscription status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSubscriptionStatus"
              example:
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                status: suspended
                suspended: true
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/entitlements/{resource_key}:
    get:
      operationId: getEntitlementStatus
      summary: Read an organization's entitlement status for a resource
      description: >-
        Requires a session, scoped to the caller's own Organization — an
        `organization_id` other than the caller's own is rejected
        identically to an unknown one. Reports the resource's policy (finite,
        capped-metered, metered or unlimited), the active count against a
        finite policy, current-period usage against a metered one, and an
        open downgrade selection window when one exists.
      tags: [entitlements]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The resource's current entitlement status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementStatus"
        "400":
          description: resource_key does not name a resource this platform grants entitlements for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: entitlement_validation_error
                  message: resource_key is not a recognized resource.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own. Deliberately
            indistinguishable from an unknown Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/entitlements/{resource_key}/selection:
    post:
      operationId: finalizeEntitlementSelection
      summary: Finalize which resources survive a plan-downgrade selection
      description: >-
        Requires a session, scoped to the caller's own Organization, and
        entitlements:manage. Names exactly the resource ids to keep out of
        an open downgrade's over-cap allocations; the rest are released.
        Reachable only while the resource's downgrade selection window is
        still open.
      tags: [entitlements]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: resource_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeEntitlementSelectionRequest"
      responses:
        "204":
          description: The selection was recorded.
        "400":
          description: >-
            Validation error, malformed JSON body, or a kept_resource_ids
            count that does not match the resource's post-downgrade limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold entitlements:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The requested Organization is not the caller's own, or there is
            no open downgrade or grant for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The selection window for this downgrade is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: entitlement_selection_closed
                  message: The selection window for this downgrade is closed.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/billing/plans:
    get:
      operationId: listBillingPlans
      summary: List the published plan catalog
      description: >-
        Returns every PlanDefinition's current PlanVersion, its entitlement
        grants and every associated price. The catalog is platform-wide, not
        Organization-scoped — it is identical for every prospective
        subscriber and discloses nothing about any Organization — so it
        requires only a valid session, with no billing:manage check. One
        exception narrows presentation only: when the session's own
        organization holds a pricing-experiment assignment for a plan and
        has no subscription to that plan yet, that plan lists only the
        assigned price. The organization is always taken from the session,
        never from the request.
      tags: [billing]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The published plan catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCatalog"
              example:
                plans:
                  - plan:
                      key: starter
                      display_name: Starter
                      description: Entry-level plan
                      plan_version_id: 018f2f3a-8300-7000-9c3a-1f2b3c4d5e6f
                      version: 1
                    is_default: true
                    grants:
                      - resource_key: project
                        policy_kind: finite
                        policy_limit: 3
                    prices:
                      - id: 018f2f3a-8400-7000-9c3a-1f2b3c4d5e6f
                        amount: 0
