          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: approval_request_organization_mismatch
                  message: Approval request does not belong to your organization.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: The approval request was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: approval_request_not_found
                  message: Approval request was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The requester attempted to reject their own request, or the
            request has already been decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                self_decision:
                  value:
                    error:
                      code: approval_self_decision
                      message: A member cannot decide their own approval request.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                not_pending:
                  value:
                    error:
                      code: approval_not_pending
                      message: Approval request has already been decided.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/scim-tokens:
    get:
      operationId: listScimTokens
