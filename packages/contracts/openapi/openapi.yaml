                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    put:
      operationId: updateGuardrailTemplate
      summary: Replace a GuardrailTemplate's tunable fields
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Replaces every tunable field
        wholesale, preserving the GuardrailTemplate's identifier and
        Project ownership. Does not affect any Guardrail already installed
        from this template — installs are one-time copies, not live
        references.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuardrailTemplateRequest"
