  /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/config/preview:
    post:
      operationId: previewEnvironmentFlagConfig
      summary: Evaluate a not-yet-saved draft configuration against a sample subject
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. Accepts the same draft shape PUT
        .../config does, plus a sample subject to evaluate it against —
        no write happens, and no EnvironmentFlagConfig row needs to exist
        in advance (expand-targeting-model task 8.6). A Rule referencing a
        reusable Segment is not resolved for preview: it evaluates as
        non-matching rather than its real, segment-resolved outcome.
      tags: [environment-flag-targeting]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewEnvironmentFlagConfigRequest"
            example:
              enabled: true
              default_variation_id: 018f2f3a-9200-7000-9c3a-1f2b3c4d5e6f
              rules:
                - attribute: plan
                  value: enterprise
                  outcome:
                    variation_id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
              subject_key: preview-subject
              attributes:
                plan:
                  type: string
                  string: enterprise
      responses:
        "200":
          description: The variation and reason evaluation would return for this draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewEnvironmentFlagConfigResponse"
              example:
                variation_key: "on"
                reason: rule_match
        "400":
          description: >-
            Validation error, matching PUT .../config's own (a malformed
            rule, an unknown variation or segment reference, a rollout not
            summing to 100, the environment and feature flag belonging to
            different projects).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The session's Member does not hold
            environment-flag-configs:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The environment or the feature flag was not found, or the
            environment belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/disable:
    post:
      operationId: disableEnvironmentFlagConfig
      summary: Turn a feature flag off in an environment (kill switch)
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. A distinct operation, never a
        general configuration write: it turns the flag off without
        touching its targeting, so re-enabling later (a normal PUT with
        enabled=true and the same rules) restores exactly what was there.
        Records a flag.disabled audit event (distinct from flag.published)
        and a new HistoryPoint. Subject to the environment's approval
        policy, but independently exemptable from it via
        disable_exempt_from_approval — see PATCH .../approval-policy.
      tags: [environment-flag-targeting]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flag disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentFlagConfig"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The session's Member does not hold
            environment-flag-configs:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No configuration exists yet for this environment and feature
            flag (nothing to disable), the environment was not found, or
            it belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_not_found
                  message: Environment flag configuration was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The environment requires approval for configuration changes
            and disabling is not exempt from that requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_approval_required
                  message: "environment flag config: this environment requires approval for configuration changes"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

