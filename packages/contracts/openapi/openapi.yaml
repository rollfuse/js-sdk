          format: date-time

    ExperimentList:
      type: object
      required: [experiments]
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"

    SampleRatioMismatchResult:
      type: object
      required: [insufficient_data]
      properties:
        insufficient_data:
          type: boolean
          description: >-
            True when any compared Variation has zero distinct attributed
            subjects. When true, variations/statistic/p_value/
            mismatch_detected are all absent: no computed statistic exists
            in that case.
        variations:
          type: array
          description: Present only when insufficient_data is false.
          items:
            type: object
            required: [variation_key, observed_count]
            properties:
              variation_key:
                type: string
              observed_count:
                type: integer
        statistic:
          type: number
          format: double
          description: The chi-squared goodness-of-fit statistic. Present only when insufficient_data is false.
        p_value:
          type: number
          format: double
          description: >-
            The approximate p-value, via the Wilson-Hilferty
            transformation. Present only when insufficient_data is false.
        mismatch_detected:
          type: boolean
          description: >-
            True iff p_value is below the fixed significance threshold
            (p < 0.001). Present only when insufficient_data is false.

    ComparisonPair:
      type: object
      required:
        [
          baseline_variation_id,
          variation_id,
          baseline_subject_count,
          variation_subject_count,
          effect_size,
          confidence_interval_low,
          confidence_interval_high,
          p_value,
        ]
      properties:
        baseline_variation_id:
          type: string
        variation_id:
          type: string
        baseline_subject_count:
          type: integer
        variation_subject_count:
          type: integer
        effect_size:
          type: number
          format: double
          description: Difference of proportions (count metrics) or difference of means (sum/average/rate metrics), variation minus baseline.
        confidence_interval_low:
          type: number
          format: double
        confidence_interval_high:
          type: number
          format: double
        p_value:
          type: number
          format: double
          description: >-
            Two-tailed p-value. No significance verdict is included; the
            operator interprets effect_size, the confidence interval and
            p_value together.

    OutcomeAnalysisResult:
      type: object
      required:
        [
          experiment_id,
          metric_definition_id,
          aggregation_type,
          unassigned_subject_count,
          contaminated_subject_count,
          multiple_comparison_correction_applied,
          comparisons,
        ]
      properties:
        experiment_id:
          type: string
        metric_definition_id:
          type: string
        aggregation_type:
          type: string
          enum: [count, sum, average, rate]
        unassigned_subject_count:
          type: integer
          description: Subjects with no attributed exposure to one of the Experiment's own compared Variations.
        contaminated_subject_count:
          type: integer
          description: Subjects whose attributed exposures span more than one of the Experiment's own compared Variations.
        multiple_comparison_correction_applied:
          type: boolean
          description: Always false in this iteration; disclosed explicitly rather than hidden when more than two Variations are compared.
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonPair"

    AcquisitionChannelBucket:
      type: object
      required:
        [variation_key, utm_source, utm_medium, utm_campaign, resolved, subject_count]
      properties:
        variation_key:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        resolved:
          type: boolean
          description: >-
            False when no AcquisitionContext could be resolved for the
            subjects in this bucket, by direct match or either single-hop
            identity resolution — distinct from a resolved AcquisitionContext
            whose UTM fields happen to be blank.
        subject_count:
          type: integer

    AcquisitionAttributionResult:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionChannelBucket"

    IssueCredentialRequest:
      type: object
      required: [scopes]
      additionalProperties: false
      properties:
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
          description: >-
            Issue this credential as safe to embed in browser-visible code.
            MUST be restricted to exactly the config:read scope — issuing a
            Public credential with any other scope is rejected. Defaults to
            false.
        name:
          type: string
          maxLength: 160
          description: >-
            Optional human-readable label, so an operator can tell two
            credentials apart in the listing. Omitted means unnamed.
        expires_at:
          type: string
          format: date-time
          description: >-
            Optional instant at which this credential stops authenticating
            requests. Omitted means it never expires. An expired credential
            is refused exactly like an unknown one.

    Credential:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          scopes,
          public,
          status,
          token,
          created_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
          description: >-
            Whether this credential was issued as safe to embed in
            browser-visible code. Fixed at issuance.
        status:
          type: string
          enum: [active, revoked]
        token:
          type: string
          description: >-
            The plaintext credential token. Returned only in the issuance
            response; no other response ever includes it.
        created_at:
          type: string
          format: date-time
        name:
          type: string
          description: >-
            The human-readable label supplied at issue time. Absent when the
            credential is unnamed.
        expires_at:
          type: string
          format: date-time
          description: >-
            The instant this credential stops authenticating requests.
            Absent when it never expires.

    ConfigureIdentityProviderRequest:
      type: object
      required: [issuer, client_id, client_secret, redirect_uri]
      additionalProperties: false
      properties:
        issuer:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        redirect_uri:
          type: string

    IdentityProvider:
