          description: The target's resulting configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationSnapshot"
        "400":
          description: >-
            Missing query parameters, or the promoted configuration is no
            longer valid for the target (a referenced variation or
            segment absent from it).
