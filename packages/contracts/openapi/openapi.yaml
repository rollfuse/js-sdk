            rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: invalid review status transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: GuardrailTemplate was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_not_found
                  message: Guardrail template was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/guardrail-templates/{guardrail_template_id}/approve:
    post:
      operationId: approveGuardrailTemplate
      summary: Approve a submitted GuardrailTemplate
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Transitions review_status from
        submitted to approved. Only an approved GuardrailTemplate can be
        installed onto a Rollout.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveGuardrailTemplateRequest"
            example:
              note: Looks good, thresholds are reasonable.
      responses:
        "200":
          description: GuardrailTemplate approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
        "400":
          description: The GuardrailTemplate's review_status is not submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: invalid review status transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: GuardrailTemplate was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/guardrail-templates/{guardrail_template_id}/reject:
    post:
      operationId: rejectGuardrailTemplate
      summary: Reject a submitted GuardrailTemplate
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Transitions review_status from
        submitted to rejected, storing the required reason. A rejected
        template may be resubmitted for another review pass.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
