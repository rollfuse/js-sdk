  /v1/public/billing/plans:
    get:
      operationId: listPublicBillingPlans
      summary: Read the published plan catalog without a session
      description: >-
        Deliberately UNAUTHENTICATED. Returns every published
        PlanDefinition's current PlanVersion, its included allowances, and
        every price attached to that version with its billing interval and
        overage rates. The public pricing page renders from this endpoint,
        so a visitor with no account is shown the price the checkout will
        actually charge.


        The catalog is platform-wide and discloses nothing about any
        Organization: the response carries no Organization-scoped field,
        and it is byte-identical whether or not a caller presents a
        session. Because there is no session to bound it, the endpoint is
        rate limited per client IP with the same budget every other
        unauthenticated endpoint uses (5 requests/second, burst 10).


        This is NOT the same operation as GET /v1/billing/plans. That one
        requires a session and narrows the prices it presents to the
        reading Organization (its pricing-experiment assignment, or the
        plan's default price per interval). This one has no Organization
