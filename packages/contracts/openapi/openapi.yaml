  /v1/projects/{project_id}/webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint for a project
      description: >-
        Requires a session for a Member holding webhooks:manage. The
        response is the ONLY place the plaintext signing secret is ever
        returned — it cannot be retrieved again afterward, mirroring
        credential issuance's "One-Time Secret Disclosure" pattern. A
        Project may have at most 20 WebhookEndpoints (active or disabled
        both count), and a single WebhookEndpoint may subscribe to at most
        20 event types; both are rejected with a `400`. A project outside
        the caller's own Organization is rejected identically to an
        unknown one.
      tags: [webhooks]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequest"
            example:
              url: https://example.com/webhooks/growth-ops
              event_types: [flag.published, rollout.rolled_back]
      responses:
        "201":
          description: >-
            Webhook endpoint created. secret is shown here once and never
            again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
              example:
                id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                url: https://example.com/webhooks/growth-ops
                event_types: [flag.published, rollout.rolled_back]
                status: active
                secret: whsec_7f3a9c1b2e4d6a8f0c1b3d5e7f9a1c3e
                created_at: "2026-01-01T12:00:00Z"
        "400":
          description: >-
