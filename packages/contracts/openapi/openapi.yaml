            changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_approval_required
                  message: "environment flag config: this environment requires approval for configuration changes"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/history/compare:
    get:
      operationId: compareFlagChangeHistoryPoints
      summary: Compare two history points of the same flag and environment
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. Both before_id and after_id are
        history point ids, scoped to the caller's own Organization
        identically to the single-point retrieval endpoint. The difference
        is expressed in targeting-model terms (fields and rules), never as
        opaque text, per flag-change-history's "Two Points Can Be Compared"
        requirement.
      tags: [flag-change-history]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
        - name: before_id
          in: query
          required: true
          schema:
            type: string
        - name: after_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Difference computed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Difference"
              example:
                identical: false
                fields:
                  - field: enabled
                    before: false
                    after: true
                rules: []
        "400":
          description: before_id or after_id was missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: flag_change_history_validation_error
                  message: "before_id and after_id are both required."
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The session's Member does not hold
            environment-flag-configs:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Either history point was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

