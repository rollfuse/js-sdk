          type: string
        reason:
          type: string
          description: >-
            Explicit human-readable reason, populated for insufficient-data
            (no Observations in the window), already-handled (breached,
            but a sibling Guardrail's breach already aborted the Rollout
            in the same tick), sustained-healthy (promoted), sustained-
            uncertain (paused), and no-longer-uncertain (resumed)
            evaluations; empty otherwise.
        evaluated_at:
          type: string
          format: date-time

    GuardrailList:
      type: object
