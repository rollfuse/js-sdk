  /v1/projects/{project_id}/environment-flag-configs/compare:
    get:
      operationId: compareEnvironmentFlagSets
      summary: Side-by-side comparison of every flag across two environments
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. Lists every FeatureFlag in the
        project configured in at least one of the two environments,
        showing what differs, stating explicitly when they match, and
        naming flags present in only one environment — per project-
        environment-management's side-by-side environment comparison
        requirement. A FeatureFlag never configured in either environment
        is omitted.
      tags: [flag-change-history]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: before_environment_id
          in: query
          required: true
          schema:
            type: string
        - name: after_environment_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Per-flag comparisons (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlagComparison"
              example:
                - feature_flag_id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                  feature_flag_key: checkout-flow
                  presence: both
                  difference:
                    identical: false
                    fields:
                      - field: enabled
                        before: false
                        after: true
                    rules: []
        "400":
          description: before_environment_id or after_environment_id was missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The session's Member does not hold
            environment-flag-configs:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Either environment was not found, belongs to another
            Organization, or belongs to a different Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/projects/{project_id}/segments:
    post:
      operationId: createSegment
      summary: Create a reusable Segment under a project
      description: >-
        Requires a session for a Member holding segments:manage. A Segment
        is a named, Project-scoped, reusable set of 1-20 AND-composed
        attribute-equality conditions, referenced by id from a Rule's
        segment_id as an alternative to an inline condition — defined once,
        updated in one place, visible everywhere it's referenced. A project
        outside the caller's own Organization is rejected identically to an
        unknown one.
      tags: [reusable-segments]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSegmentRequest"
            example:
              name: Brazilian iOS users
              conditions:
                - attribute: country
                  value: BR
                - attribute: platform
                  value: ios
      responses:
        "201":
          description: Segment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
              example:
                id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: Brazilian iOS users
                conditions:
                  - attribute: country
                    value: BR
                  - attribute: platform
                    value: ios
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: >-
