  /v1/experiments/{experiment_id}/sample-ratio-mismatch:
    get:
      operationId: checkExperimentSampleRatioMismatch
      summary: Check an Experiment for a Sample Ratio Mismatch
      description: >-
        Requires a session for a Member holding experiments:manage.
        Computes, on demand, a Sample Ratio Mismatch (SRM) check
        comparing each of the Experiment's compared Variations' distinct
        attributed-subject count (from attributed ExposureEvents)
        against an equal-split expectation, using a chi-squared
        goodness-of-fit test with a fixed significance threshold of
        p < 0.001. Not persisted or scheduled: every call recomputes
        from current attributed data. When any compared Variation has
        zero distinct attributed subjects, the response reports
        `insufficient_data: true` with no computed statistic/p-value,
        rather than a spurious mismatch. This check is purely advisory:
        it never alters the Experiment's lifecycle state or conclusion.
        An Experiment whose owning Project belongs to another
        Organization is rejected identically to an unknown Experiment
        id.
      tags: [experiment-sample-ratio-analysis]
      security:
        - sessionAuth: []
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sample Ratio Mismatch check computed from the Experiment's current attributed data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleRatioMismatchResult"
              examples:
                balanced:
                  summary: A balanced split reports no mismatch.
                  value:
                    insufficient_data: false
                    variations:
                      - variation_key: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                        observed_count: 500
                      - variation_key: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                        observed_count: 498
                    statistic: 0.004016
                    p_value: 0.949478
                    mismatch_detected: false
