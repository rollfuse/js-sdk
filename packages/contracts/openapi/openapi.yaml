                  - $ref: "#/components/schemas/Connector"
                  - $ref: "#/components/schemas/ConnectorCreated"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The Connector, the referenced MetricDefinition, or the
            referenced Environment was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: connector_not_found
                  message: Connector was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/connectors/{connector_id}/disable:
    post:
      operationId: disableConnector
      summary: Disable a Connector
      description: >-
        Requires a session for a Member holding connectors:manage. A
        disabled Connector retains its configuration and sync history but
        rejects sync requests. A Connector whose owning Project belongs
        to another Organization is rejected identically to an unknown
        Connector id.
      tags: [connectors]
      security:
        - sessionAuth: []
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connector disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold connectors:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Connector was not found, or belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/connectors/{connector_id}/sync:
    post:
      operationId: syncConnector
      summary: Trigger an on-demand sync of a Connector's source
      description: >-
        Requires a session for a Member holding connectors:manage.
        Fetches from the Connector's configured source and records each
        fetched entry as an Observation against the Connector's mapped
        MetricDefinition and Environment, through the same validated
        path an SDK push already uses. Any failure (source unreachable,
        non-2xx response, unparseable body, or a downstream recording
        failure) records no Observation and returns an error; the
        Connector's persisted last-sync-failed state is visible on a
        subsequent Get. A Connector whose owning Project belongs to
        another Organization is rejected identically to an unknown
        Connector id.
      tags: [connectors]
      security:
        - sessionAuth: []
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sync succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        "400":
          description: The Connector is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold connectors:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Connector was not found, or belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: >-
            The sync failed (source unreachable, non-2xx response,
            unparseable body, or a downstream recording failure). No
            Observation was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: connector_sync_failed
                  message: "httpclient: non-success status 503"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environment-flag-configs/{environment_flag_config_id}/rollouts:
    post:
      operationId: createRollout
      summary: Create a Rollout for an EnvironmentFlagConfig
      description: >-
        Requires a session for a Member holding rollouts:manage. NOT
        Credential-authenticated, unlike the evaluation endpoints. Rejects
        the request if the EnvironmentFlagConfig has any manually-authored
        Rules, or already has a scheduled or active Rollout. Stages MUST
        have strictly increasing target percentages and the final stage
        MUST be exactly 100. An EnvironmentFlagConfig outside the caller's
        own Organization is rejected identically to an unknown one.
      tags: [rollout-scheduling]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_flag_config_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRolloutRequest"
            example:
              target_variation_id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
              stages:
                - target_percentage: 10
                  activate_at: "2026-01-01T12:00:00Z"
                - target_percentage: 50
                  activate_at: "2026-01-02T12:00:00Z"
                - target_percentage: 100
                  activate_at: "2026-01-03T12:00:00Z"
      responses:
        "201":
          description: Rollout created in the scheduled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
              example:
                id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                environment_flag_config_id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                target_variation_id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                state: scheduled
                stages:
                  - position: 0
                    target_percentage: 10
                    activate_at: "2026-01-01T12:00:00Z"
                  - position: 1
                    target_percentage: 100
                    activate_at: "2026-01-03T12:00:00Z"
                last_applied_stage_position: -1
                created_at: "2026-01-01T00:00:00Z"
                updated_at: "2026-01-01T00:00:00Z"
        "400":
          description: >-
            Validation error (malformed JSON, no stages, non-increasing
            stage percentages, a final stage below 100, or an unknown
            target Variation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_validation_error
                  message: "rollout: stage target percentages must strictly increase"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold rollouts:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The EnvironmentFlagConfig was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_not_found
                  message: Environment flag configuration was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The EnvironmentFlagConfig has manually-authored Rules
            (rollout_config_has_manual_rules) or is already owned by a
            scheduled/active Rollout (rollout_config_already_owned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_config_already_owned
                  message: >-
                    rollout: environment flag config already owned by a
                    scheduled or active rollout
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listRolloutsForConfig
      summary: List every Rollout ever created for an EnvironmentFlagConfig
      description: >-
        Requires a session for a Member holding rollouts:manage. Returns
        Rollouts in every lifecycle state (scheduled, active, completed,
        aborted), oldest first. An EnvironmentFlagConfig outside the
        caller's own Organization is rejected identically to an unknown
        one.
      tags: [rollout-scheduling]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_flag_config_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rollouts found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloutList"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold rollouts:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The EnvironmentFlagConfig was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_not_found
                  message: Environment flag configuration was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

