          type: string
        organization_id:
          type: string
        kind:
          type: string
          enum: [role_grant, environment_flag_config_change]
        target_member_id:
          type: string
        role:
          type: string
          enum: [admin]
        environment_id:
          type: string
        feature_flag_id:
          type: string
        requested_by_member_id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        decided_by_member_id:
          type: string
        decision_reason:
          type: string
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time

    ScimTokenResponse:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
        token:
          type: string
          description: >-
            Present only in the issuance response — the plaintext token
