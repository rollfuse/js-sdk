        utm_term:
          type: string
        utm_content:
          type: string
        landing_url:
          type: string
        referrer:
          type: string
        occurred_at:
          type: string
          format: date-time

    RecordAcquisitionContextResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    AcquisitionContext:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          subject_key,
          utm_source,
          utm_medium,
          utm_campaign,
          utm_term,
          utm_content,
          landing_url,
          referrer,
          occurred_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        subject_key:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_term:
          type: string
        utm_content:
          type: string
        landing_url:
          type: string
        referrer:
          type: string
        occurred_at:
          type: string
          format: date-time

    RecordIdentityLinkRequest:
      type: object
      required: [alias_key, canonical_key, linked_at]
      additionalProperties: false
      properties:
        alias_key:
          type: string
        canonical_key:
          type: string
        linked_at:
          type: string
          format: date-time

    RecordIdentityLinkResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    ResolveIdentityResponse:
      type: object
      required: [subject_key, canonical_key]
      properties:
        subject_key:
          type: string
        canonical_key:
          type: string

    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"

    BillingPlan:
      type: object
      required: [key, display_name, description, plan_version_id, version]
      properties:
        key:
          type: string
          description: The catalog entry's stable key (e.g. "starter", "pro").
        display_name:
          type: string
        description:
          type: string
        plan_version_id:
          type: string
          description: >-
            The specific immutable PlanVersion in play. A Subscription is
            always pinned to a version, never to the catalog entry, so
            editing the catalog never silently changes an existing
            subscriber's terms.
        version:
          type: integer

    BillingGrant:
      type: object
      required: [resource_key, policy_kind]
      properties:
        resource_key:
          type: string
          enum:
            - project
            - environment
            - feature_flag
            - segment
            - guardrail
            - experiment
            - webhook_endpoint
        policy_kind:
          type: string
          enum: [unlimited, finite]
        policy_limit:
          type: integer
          description: Present only when policy_kind is "finite".

    BillingPrice:
      type: object
      required: [id, amount, currency, interval]
      properties:
        id:
          type: string
        amount:
          type: integer
          format: int64
          description: >-
            An integer amount in the smallest unit of currency (e.g.
            cents), never a float. May be 0 — the platform's default plan
            is a $0 plan.
        currency:
          type: string
        interval:
          type: string
          enum: [month, year]

    ScheduledPlanChange:
      type: object
      required: [plan, effective_at]
      properties:
        plan:
          $ref: "#/components/schemas/BillingPlan"
        effective_at:
          type: string
          format: date-time
          description: >-
            When the agreed change takes financial and entitlement effect —
            the end of the current billing cycle, for a downgrade.

    Subscription:
      type: object
      required: [id, status, plan, grants, cycle_end_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [trialing, active, past_due, suspended, canceled]
        plan:
          $ref: "#/components/schemas/BillingPlan"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/BillingGrant"
        price:
          allOf:
            - $ref: "#/components/schemas/BillingPrice"
          description: >-
            The specific price of the plan version this Organization is
            billed under. Absent when the plan version carries no price.
        scheduled_plan_change:
          allOf:
            - $ref: "#/components/schemas/ScheduledPlanChange"
          description: Absent when no plan change is pending.
        cycle_end_at:
          type: string
          format: date-time
        requires_payment_method_to_activate:
          type: boolean
          description: >-
            True when this Subscription has never been billed at the
            gateway yet (still on the platform's $0 default plan) —
            changing to a paid plan requires a payment method verified via
            the setup-intent endpoint first.
        can_start_new_checkout:
          type: boolean
          description: >-
            True when this Subscription is `canceled` — the organization
            has no blocking subscription and may start an independent new
            checkout (POST .../billing/subscription/checkout) for any
            published paid plan, always with a newly collected payment
            method rather than reusing this Subscription's own (now-ended)
            one.

    OrganizationSubscription:
      type: object
      required: [organization_id]
      properties:
        organization_id:
          type: string
        subscription:
          allOf:
            - $ref: "#/components/schemas/Subscription"
          description: >-
            Absent when the Organization has no Subscription — a legitimate
            state for an Organization whose default-plan enrollment failed
            or that predates enrollment, not an error.

    OrganizationSubscriptionStatus:
      type: object
      required: [organization_id, suspended]
      properties:
        organization_id:
          type: string
        status:
          type: string
          enum: [trialing, active, past_due, suspended, canceled]
          description: >-
            Absent when the Organization has no Subscription at all — a
            legitimate state, not an error.
        suspended:
          type: boolean
          description: >-
            True only for a suspended Subscription. It is the one question
            the console shell asks, answered here rather than left to every
            caller to re-derive from `status`.

    ReplacePaymentMethodRequest:
      type: object
      required: [payment_method_id]
      properties:
        payment_method_id:
          type: string
          description: >-
            The payment gateway's own id for an instrument already collected
            and verified by the browser. No card data is ever sent to this
            API.

    UpdateBillingDetailsRequest:
      type: object
      required: [billing_email, organization_legal_name, country, tax_id]
      properties:
        billing_email:
          type: string
        organization_legal_name:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        tax_id:
          type: string
          description: The organization's tax identifier (e.g. CNPJ in Brazil).

    PaymentMethodSummary:
      type: object
      required: [brand]
      description: >-
        Identifies a saved instrument without describing it well enough to
        use. It never carries a full instrument number: `last4` is at most
        four digits, and there is no other numeric field.
      properties:
        brand:
          type: string
          description: >-
            The provider's brand label for the instrument (e.g. `visa`), or
            the method type for an instrument with no brand.
          example: visa
        last4:
          type: string
          description: >-
            Exactly four digits. Omitted for an instrument with no trailing
            digits to show.
          example: "4242"
        exp_month:
          type: integer
          description: 1-12. Omitted together with exp_year when the instrument has no expiry.
          example: 12
        exp_year:
          type: integer
          example: 2030

    OrganizationPaymentMethod:
      type: object
      required: [organization_id, present]
      properties:
        organization_id:
          type: string
        present:
          type: boolean
          description: >-
            False when the Organization has nothing on record — including
            when the provider no longer holds the instrument it had. A
            legitimate state the caller renders as an offer to add one, not
            an error.
        payment_method:
          allOf:
            - $ref: "#/components/schemas/PaymentMethodSummary"
          description: Omitted when `present` is false.

    OrganizationCharge:
      type: object
      required: [id, organization_id, status, amount, currency, refunded_amount, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        status:
          type: string
          enum: [created, pending, paid, failed, expired, disputed]
        amount:
          type: integer
          format: int64
          description: Integer amount in the currency's smallest unit, never a float.
        currency:
          type: string
          example: BRL
        refunded_amount:
          type: integer
          format: int64
          description: >-
            The gateway-confirmed refunded total, in the same currency. Zero
            for a charge nothing has been refunded against.
        hosted_invoice_url:
          type: string
          format: uri
          description: >-
            The gateway-hosted invoice for this charge. Omitted — never an
            empty string — when the gateway published none, so a client
            renders no link at all rather than a link to nowhere.
        receipt_url:
          type: string
          format: uri
          description: >-
            The gateway-hosted receipt for this charge, omitted on the same
            terms as `hosted_invoice_url`.
        created_at:
          type: string
          format: date-time

    OrganizationChargeList:
      type: object
      required: [charges, has_more]
      properties:
        charges:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationCharge"
        has_more:
          type: boolean
          description: >-
            True when the Organization has older charges than this capped
            page carries.

    OrganizationChargeItem:
      type: object
      required: [charge]
      properties:
        charge:
          $ref: "#/components/schemas/OrganizationCharge"

    PlanCatalogEntry:
      type: object
      required: [plan, is_default, grants, prices]
      properties:
        plan:
          $ref: "#/components/schemas/BillingPlan"
        is_default:
          type: boolean
          description: >-
            Exactly one catalog entry carries this flag: the plan every
            newly provisioned Organization is enrolled into.
        grants:
          type: array
          items:
            $ref: "#/components/schemas/BillingGrant"
        prices:
          type: array
          description: >-
            Every price attached to this plan version. A plan version may
            carry several simultaneously (e.g. monthly and annual, or the
            same interval in several currencies).
          items:
            $ref: "#/components/schemas/BillingPrice"

    PlanCatalog:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanCatalogEntry"

    PublicOverageRate:
      type: object
      required: [resource_key, amount_per_unit, per_units]
      properties:
        resource_key:
          type: string
          enum:
            - project
            - environment
            - feature_flag
            - segment
            - guardrail
            - experiment
            - webhook_endpoint
            - seat
            - mtu
        amount_per_unit:
          type: integer
          format: int64
          description: >-
            An integer amount in the price's currency's smallest unit (e.g.
            centavos), charged per per_units units of usage beyond the
            plan's included allowance for this resource.
        per_units:
          type: integer
          format: int64
          description: >-
            The block size amount_per_unit is charged per, e.g. 1000 for
            "R$1,50 per 1000 MTU". Always at least 1. A partial final block
            is billed as a whole one.

    PublicBillingPrice:
      type: object
      required: [id, amount, currency, interval, is_default, overage_rates]
      properties:
        id:
          type: string
        amount:
          type: integer
          format: int64
          description: >-
            An integer amount in the smallest unit of currency (e.g.
            centavos), never a float. May be 0 — the platform's default
            plan is a zero-amount plan.
        currency:
          type: string
        interval:
          type: string
          enum: [month, year]
        is_default:
          type: boolean
          description: >-
            True for the plan's own price for this billing interval, false
            for a simultaneously published variant (e.g. a
            pricing-experiment cohort's price). A reader with no assignment
            of its own renders the default.
        overage_rates:
          type: array
          description: >-
            What usage beyond a metered allowance costs under this price.
            Empty for a plan version with no metered grant.
          items:
            $ref: "#/components/schemas/PublicOverageRate"

    PublicBillingGrant:
      type: object
      required: [resource_key, policy_kind]
      properties:
        resource_key:
          type: string
          enum:
            - project
            - environment
            - feature_flag
            - segment
            - guardrail
            - experiment
            - webhook_endpoint
            - seat
            - mtu
        policy_kind:
          type: string
          enum: [unlimited, finite, metered, capped_metered]
        policy_limit:
          type: integer
          description: >-
            The included allowance. Absent only when policy_kind is
            "unlimited".

    PublicPlanCatalogEntry:
      type: object
      required: [plan, is_default, grants, prices]
      properties:
        plan:
          $ref: "#/components/schemas/BillingPlan"
        is_default:
          type: boolean
          description: >-
            Exactly one catalog entry carries this flag: the plan every
            newly provisioned Organization is enrolled into.
        grants:
          type: array
          items:
            $ref: "#/components/schemas/PublicBillingGrant"
        prices:
          type: array
          description: >-
            Every price published against this plan version, not narrowed
            to one — there is no reading Organization to narrow by. Use
            is_default to pick the plan's own price per interval.
          items:
            $ref: "#/components/schemas/PublicBillingPrice"

    PublicPlanCatalog:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PublicPlanCatalogEntry"

    ChangePlanRequest:
      type: object
      required: [plan_version_id, price_id]
      properties:
        plan_version_id:
          type: string
        price_id:
          type: string
          description: >-
            Must name a price attached to plan_version_id. Required
            separately because a plan version may carry several prices.

    CheckoutRequest:
      type: object
      required: [plan_version_id, price_id, payment_method_id]
      properties:
        plan_version_id:
          type: string
        price_id:
          type: string
          description: >-
            Must name a price attached to plan_version_id. Required
            separately because a plan version may carry several prices.
        payment_method_id:
          type: string
          description: >-
            A payment method verified through a setup intent (see POST
            .../billing/setup-intent). Always required: checkout always
            collects a new payment method, even for an organization whose
            prior Subscription is canceled — it never reuses one.

    EntitlementPolicy:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [finite, metered, capped_metered, unlimited]
        limit:
          type: integer
          description: Present only for a finite policy.
        included_amount:
          type: integer
          description: Present only for a metered or capped-metered policy.
        period:
          type: string
          description: Present only for a metered or capped-metered policy.

    EntitlementUsagePeriod:
      type: object
      required: [period_start, period_end, amount]
      properties:
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        amount:
          type: integer

    EntitlementMeteredUsage:
      type: object
      required: [included_amount, period]
      properties:
        included_amount:
          type: integer
        period:
          type: string
        current_period:
          $ref: "#/components/schemas/EntitlementUsagePeriod"

    EntitlementDowngradeEvent:
      type: object
      required: [selection_deadline_at, lock_deadline_at, selection_method]
      properties:
        selection_deadline_at:
          type: string
          format: date-time
        lock_deadline_at:
          type: string
          format: date-time
        selection_method:
          type: string

    EntitlementAllocation:
      type: object
      required: [resource_id, status, allocated_at]
      properties:
        resource_id:
          type: string
        status:
          type: string
        allocated_at:
          type: string
          format: date-time

    EntitlementStatus:
      type: object
      required: [resource_key, policy, active_count]
      properties:
        resource_key:
          type: string
        policy:
          $ref: "#/components/schemas/EntitlementPolicy"
        active_count:
          type: integer
          description: 0 for a metered grant, which has no allocations to count.
        open_downgrade_event:
          $ref: "#/components/schemas/EntitlementDowngradeEvent"
        pending_selection:
          type: array
          items:
            $ref: "#/components/schemas/EntitlementAllocation"
        metered_usage:
          $ref: "#/components/schemas/EntitlementMeteredUsage"

    FinalizeEntitlementSelectionRequest:
      type: object
      required: [kept_resource_ids]
      properties:
        kept_resource_ids:
          type: array
          items:
            type: string

    CreateSetupIntentResponse:
      type: object
      required: [client_secret]
      properties:
        client_secret:
          type: string
          description: >-
            The payment gateway's setup-intent client secret. The frontend
            confirms it directly against the gateway; it never reaches this
            API again.

    CreateSupportTicketRequest:
      type: object
      required: [kind, description]
      properties:
        kind:
          type: string
          enum: [feedback, ticket]
        project_id:
          type: string
          description: >-
            Auto-captured by the console when the Member is viewing a
            Project-scoped screen; omitted otherwise.
        subject:
          type: string
          description: Required when kind is "ticket".
        description:
          type: string
        category:
          type: string
          enum: [bug, dúvida, sugestão, outro]
          description: Required when kind is "ticket"; must be omitted for "feedback".

    SupportTicket:
      type: object
      required: [id, kind, description, created_at, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [feedback, ticket]
        project_id:
          type: string
        subject:
          type: string
          description: Present only for kind "ticket".
        description:
          type: string
        category:
          type: string
          enum: [bug, dúvida, sugestão, outro]
          description: Present only for kind "ticket".
        status:
          type: string
          enum: [open, answered, resolved]
          description: >-
            Present only for kind "ticket" — a feedback entry's internal
            status is never exposed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListSupportTicketsResponse:
      type: object
      required: [support_tickets, limit, offset]
      properties:
        support_tickets:
          type: array
          items:
            $ref: "#/components/schemas/SupportTicket"
        limit:
          type: integer
        offset:
          type: integer

    AddSupportMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    SupportMessage:
      type: object
      required: [id, ticket_id, author_type, author_id, body, created_at]
      properties:
        id:
          type: string
        ticket_id:
          type: string
        author_type:
          type: string
          enum: [member, staff]
        author_id:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time

    ListSupportMessagesResponse:
      type: object
      required: [support_messages]
      properties:
        support_messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"

    AddSupportMessageResponse:
      type: object
      required: [message, status]
      properties:
        message:
          $ref: "#/components/schemas/SupportMessage"
        status:
          type: string
          enum: [open, answered, resolved]
          description: >-
            The ticket's status after this message was applied — reflects
            an auto-reopen when a Member replied on a resolved ticket.

    PresignSupportAttachmentRequest:
      type: object
      required: [content_type, size_bytes]
      properties:
        ticket_id:
          type: string
          description: >-
            Set when the attachment targets a ticket/feedback entry
            directly. Exactly one of ticket_id/message_id must be set.
        message_id:
          type: string
          description: >-
            Set when the attachment targets a later reply. Exactly one of
            ticket_id/message_id must be set.
        content_type:
          type: string
          enum: [image/jpeg, image/png]
        size_bytes:
          type: integer
          format: int64
          description: Declared size; re-validated against the real object at confirm time.

    PresignSupportAttachmentResponse:
      type: object
      required: [attachment_id, object_key, upload_url]
      properties:
        attachment_id:
          type: string
        object_key:
          type: string
          description: >-
            Server-derived from the Organization, the owning ticket or
            message and this attachment_id. Informational only: the
            confirm endpoint derives it again from the recorded upload and
            accepts no object key of any kind.
        upload_url:
          type: string
          description: Presigned URL the client PUTs the object's bytes to directly.

    ConfirmSupportAttachmentRequest:
      type: object
      properties:
        ticket_id:
          type: string
          description: >-
            Optional. When set it MUST match the owner recorded when the
            upload was presigned; it is compared, never used to address
            anything. A value that disagrees is refused as a not-found.
        message_id:
          type: string
          description: >-
            Optional. Compared against the recorded owner exactly like
            ticket_id.

    SupportAttachment:
      type: object
      required: [id, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
        ticket_id:
          type: string
        message_id:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png]
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    SupportAttachmentDownloadResponse:
      type: object
      required: [download_url]
      properties:
        download_url:
          type: string

    ListSupportAttachmentsResponse:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/SupportAttachment"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A Service Credential token, issued by POST
        /v1/environments/{environment_id}/credentials, presented as
        "Authorization: Bearer <token>". Verified by
        credential.VerifyCredential via platform/httpauth. Used by the
        evaluation endpoints (GET /v1/config, POST /v1/evaluate, requiring
        config:read), the observation ingestion endpoint (POST
        /v1/environments/{environment_id}/metric-definitions/{metric_definition_id}/observations,
        requiring metrics:write), the acquisition-context submission
        endpoint (POST
        /v1/environments/{environment_id}/acquisition-contexts, requiring
        acquisition:write) and the identity-link submission endpoint (POST
        /v1/environments/{environment_id}/identity-links, requiring
        identity:write) — every other endpoint in this document remains
        unauthenticated development-foundation scaffolding.
    sessionAuth:
      type: http
      scheme: bearer
      description: >-
        A human Session token, issued by GET /v1/auth/callback on a
        successful OIDC login, presented as "Authorization: Bearer
        <token>". Verified directly by member.RevokeSession (logout) or,
        for future operator-authenticated endpoints, by
        member.ResolveSession via platform/httpauth's session resolver.
    staffSessionAuth:
      type: http
      scheme: bearer
      description: >-
        A StaffSession token, issued by POST
        /v1/staff/magic-link/{token}/confirm, presented as "Authorization:
        Bearer <token>" or, for a browser, as the `rf_staff_session` cookie.
        Verified by staff.ResolveStaffSession via platform/httpauth's
        StaffSessionMiddleware.


        It is a completely separate credential family from sessionAuth: a
        StaffSession resolves a platform-staff identity that spans every
        Organization and carries none, while a Member Session always
        resolves to exactly one Organization. Neither token is accepted
        where the other is expected, and the two use different cookie names.
    scimTokenAuth:
      type: http
      scheme: bearer
      description: >-
        A ScimToken, issued by POST
        /v1/organizations/{organization_id}/scim-tokens, presented as
        "Authorization: Bearer <token>". Scopes every /scim/v2/* request
        to the Organization it was issued for. Verified by
        scim.VerifyScimToken via platform/httpauth's ScimTokenMiddleware.

tags:
  - name: billing
    description: >-
      Self-serve billing endpoints: reading an Organization's current
      subscription, browsing the published plan catalog, and changing
      plan. The two Organization-scoped endpoints require a session for
      a Member holding billing:manage; the plan catalog is platform-wide
      and requires only a valid session. Catalog authoring (creating or
      publishing a plan, plan version or price) is deliberately not
      exposed here — it stays seed/migration-driven.
  - name: entitlements
    description: >-
      Reading an Organization's entitlement status per resource (policy,
      active count, metered usage, an open plan-downgrade selection window)
      and finalizing which resources survive a downgrade. Both endpoints
      require a session scoped to the caller's own Organization; finalizing
      a selection additionally requires entitlements:manage.
  - name: health
    description: Process liveness and readiness signals.
  - name: visitor-journeys
    description: >-
      First-party visitor-journey capture for Rollfuse' own marketing site
      and console: consent decisions, journey events, and the stitching of
      an anonymous visitor to a Lead or Member. These records describe our
      own visitors and are not tenant data, so the read and erasure
      endpoints are restricted to the platform operator Organization rather
      than to any Member holding analytics:read.
  - name: organizations
    description: >-
      Development-foundation Organization endpoints. Unauthenticated until
      the authentication change lands.
  - name: identity-provider
    description: >-
      Human SSO login endpoints: configuring an Organization's OIDC
      provider, initiating and completing a login, and revoking a session.
      Configuration and login endpoints remain unauthenticated
      development-foundation scaffolding (they bootstrap the auth
      mechanism itself); logout is authenticated by the presented session
      token directly.
  - name: platform-staff
    description: >-
      Platform-staff authentication and identity: requesting, checking and
      confirming a staff magic link, and reading the signed-in StaffMember.
      A StaffMember is not scoped to any Organization and is a distinct
      identity from a Member, with its own session, its own cookie
      (`rf_staff_session`) and its own small permission catalog
      (`billing:refund`, `support:view`, `support:respond`,
      `support:close`, `privacy:erase`, `residency:review`, `leads:work`).
  - name: personal-data-lifecycle
    description: >-
      Erasure of a person's personal data: the in-product request an
      authenticated Member makes for their own account, the request an
      operator records on behalf of a person with no account, and the
      staff-triggered processing that visits every store in the enumerated
      erasure scope and reports the outcome of each.

      Erasure is a recorded request with a stated processing window, not a
      synchronous delete: it crosses billing records under a retention
      obligation, an audit trail whose integrity depends on not vanishing,
      and an Organization that may have other members and an active
      subscription.


      There is deliberately no endpoint here that creates a StaffMember,
      disables one, or changes one's permissions: provisioning is an
      out-of-band operation performed directly against the datastore, since
      no staff-management API or console exists yet.
  - name: rbac
    description: >-
      Grant, revoke and list a Member's Roles within their Organization.
      Require a session for a Member already holding roles:manage.
  - name: member
    description: >-
      Read endpoints over an Organization's Members. Listing exists to
      support RBAC administration and requires roles:manage.
  - name: projects
    description: >-
      Development-foundation Project endpoints, nested under their owning
      Organization. Unauthenticated until the authentication change lands.
  - name: environments
    description: >-
      Development-foundation Environment endpoints, nested under their
      owning Project. Unauthenticated until the authentication change
      lands.
  - name: feature-flags
    description: >-
      Development-foundation FeatureFlag endpoints, nested under their
      owning Project. Unauthenticated until the authentication change
      lands.
  - name: environment-flag-targeting
    description: >-
      Development-foundation EnvironmentFlagConfig endpoints, nested under
      their owning Environment and referenced FeatureFlag. Unauthenticated
      until the authentication change lands.
  - name: flag-change-history
    description: >-
      Read-only retrieval of an EnvironmentFlagConfig's change history: a
      HistoryPoint is recorded on every successful configuration change
      (manual or rollout-driven), retained for a stated period, per
      add-flag-operations-essentials.
  - name: reusable-segments
    description: >-
      Development-foundation Segment endpoints, nested under their owning
      Project (creation and listing) or referenced directly by id (get,
      update). A Segment is a named, reusable set of AND-composed
      attribute-equality conditions a Rule can reference by id instead of
      duplicating an inline condition — editing a Segment's conditions
      changes the behavior of every Rule that references it. Unauthenticated
      until the authentication change lands.
  - name: rollout-scheduling
    description: >-
      Development-foundation Rollout endpoints, nested under their owning
      EnvironmentFlagConfig (creation and listing) or referenced directly
      by id (get, abort). Unauthenticated until the authentication change
      lands, like every other tag in this document except evaluation.
  - name: rollout-pause-resume
    description: >-
      Development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands) manual pause/resume
      endpoints for a Rollout, referenced directly by id. A Rollout may
      also be paused and later auto-resumed automatically by a Guardrail
      (see guardrail-auto-rollback) — that path never goes through these
      HTTP endpoints, which always attribute the pause to the operator.
  - name: credentials
    description: >-
      Development-foundation Credential endpoints, nested under their
      owning Environment (issuance and listing) or referenced directly by
      id (revocation). Issuing and managing credentials themselves stays
      unauthenticated in this change — no human/operator auth exists yet.
      Only a future config-fetch endpoint that consumes these credentials
      will be protected by platform/httpauth.
  - name: evaluation
    description: >-
      Credential-authenticated configuration-delivery and evaluation
      endpoints (GET /v1/config, POST /v1/evaluate). Unlike every other
      tag in this document, these endpoints ARE authenticated from day
      one, via a Bearer Service Credential token (bearerAuth), scoped to
      the Credential's own Organization/Project/Environment.
  - name: exposure-event-recording
    description: >-
      Development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands) read endpoint listing
      ExposureEvents recorded for a FeatureFlag within an Environment.
      ExposureEvents themselves are written asynchronously and best-
      effort by the evaluation module, never on this document's request
      path.
  - name: metric-definition-ingestion
    description: >-
      MetricDefinition create/get and Observation list endpoints are
      development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands). The Observation ingestion
      endpoint (POST .../observations) is the exception: it IS
      Credential-authenticated from day one, via a Bearer Service
      Credential token (bearerAuth) requiring the metrics:write scope,
      scoped to the Credential's own Environment/Project. Observations are
      written asynchronously and best-effort, mirroring
      exposure-event-recording.
  - name: guardrail-auto-rollback
    description: >-
      Development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands) Guardrail create/get and
      PolicyEvaluation listing endpoints, nested under their owning
      Rollout. Guardrails themselves are evaluated asynchronously by a
      background reconciler, never on this document's request path; a
      breach automatically aborts the owning Rollout via the same
      rollout-scheduling abort path a human operator would use. A
      Guardrail may optionally also be configured (via
      promote_after_healthy_seconds/pause_after_uncertain_seconds) to
      trigger an early stage promotion or an automatic pause instead —
      see rollout-pause-resume for the Rollout-side pause/resume
      mechanism these actions drive.
  - name: guardrail-templates
    description: >-
      Development-foundation GuardrailTemplate endpoints, nested under
      their owning Project (creation and listing) or referenced directly
      by id (get, update, install). A GuardrailTemplate is a named,
      reusable Guardrail policy shape that can be installed onto any
      Rollout in the same Project, producing an independent Guardrail —
      installing copies the template's field values once; later template
      edits never affect an already-installed Guardrail. Unauthenticated
      until the authentication change lands.
  - name: connectors
    description: >-
      Development-foundation Connector endpoints, nested under their
      owning Project (creation and listing) or referenced directly by id
      (get, update, disable, sync). A Connector is a Project-scoped
      configuration for pulling Observation data from an external HTTP
      source into a mapped MetricDefinition and Environment, both owned
      by the same Project. Sync is manual/on-demand in this slice — there
      is no automatic recurring sync. Unauthenticated until the
      authentication change lands.
  - name: connector-templates
    description: >-
      ContractTemplate/ContractTemplateVersion endpoints: a reviewable,
      versioned library of Connector source-shape mappings, either
      platform-scoped (read-only, shared across every Project) or
      project-scoped (owned and editable by one Project). A Connector
      pins a specific, approved ContractTemplateVersion at creation.
  - name: experiment-hypothesis
    description: >-
      Development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands) Experiment create/get/list
      and lifecycle (start/conclude/abort) endpoints, nested under their
      owning FeatureFlag (creation and listing) or referenced directly by
      id (get, start, conclude, abort). An Experiment is purely
      declarative in this slice: it never reads or writes ExposureEvents,
      Observations, EnvironmentFlagConfig or Rollout state — see this
      capability's design.md Non-Goals in add-experiment-hypothesis.
      Starting an Experiment is now additionally rejected if another
      Experiment is already running for the same FeatureFlag and
      Environment, per add-experiment-outcome-attribution's exclusivity
      requirement (needed so ExposureEvent attribution below is never
      ambiguous).
  - name: experiment-outcome-attribution
    description: >-
      Development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands) read endpoints listing the
      ExposureEvents and Observations attributed to an Experiment.
      Attribution itself happens asynchronously, at ExposureEvent/
      Observation recording time (never on this document's request
      path): an ExposureEvent is attributed to every Experiment running
      for its own FeatureFlag+Environment whose compared Variations
      include the event's VariationKey; an Observation is attributed to
      every Experiment running in its own Environment, regardless of
      FeatureFlag (Observation carries no FeatureFlag/Variation
      reference). Attribution is never retroactive and never
      re-evaluated after the fact.
  - name: experiment-sample-ratio-analysis
    description: >-
      Development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands) on-demand Sample Ratio
      Mismatch (SRM) detection for a running or concluded Experiment: a
      chi-squared goodness-of-fit test comparing each compared Variation's
      distinct attributed-subject count against an equal-split
      expectation, at a fixed p < 0.001 significance threshold. Not
      persisted or scheduled — every call recomputes from current
      attributed data — and purely advisory: it never alters the
      Experiment's lifecycle state or triggers automatic conclusion. See
      this capability's design.md Non-Goals in
      add-experiment-sample-ratio-analysis for why no weighted/custom
      expected split and no outcome/conversion-rate test are in scope.
  - name: acquisition-context-capture
    description: >-
      Roadmap Phase 4 (Acquisition Context): first-touch UTM-parameter
      capture per subject within an Environment. The submission endpoint
      (POST .../acquisition-contexts) IS Credential-authenticated from day
      one, via a Bearer Service Credential token (bearerAuth) requiring the
      acquisition:write scope, scoped to the Credential's own Environment/
      Project/Organization, mirroring metric-definition-ingestion. Only the
      first submission per subject_key is captured; later submissions for
      the same subject_key are accepted but do not alter the stored record.
      The read endpoint (GET .../acquisition-contexts/{subject_key}) is
      development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands).
  - name: identity-merge
    description: >-
      Roadmap Phase 4 (Acquisition Context): links an alias subject key
      (typically anonymous, pre-login) to a canonical subject key
      (typically authenticated, post-login). The submission endpoint (POST
      .../identity-links) IS Credential-authenticated from day one, via a
      Bearer Service Credential token (bearerAuth) requiring the
      identity:write scope, scoped to the Credential's own Environment/
      Project/Organization, mirroring acquisition-context-capture. Only the
      first submission per alias_key is captured; later submissions for the
      same alias_key are accepted but do not alter the stored canonical_key.
      Resolution (GET .../identity-links/{subject_key}/canonical) is
      single-hop only — it never chains through a second link — and is
      development-foundation, operator-authenticated (unauthenticated
      until the authentication change lands).
  - name: acquisition-attribution
    description: >-
      Roadmap Phase 4 (Acquisition Context), completing its exit signal
      ("Acquisition segments influence experiments safely"). A single
      read endpoint (GET .../acquisition-attribution), development-
      foundation and operator-authenticated (unauthenticated until the
      authentication change lands), reporting an Experiment's attributed
      subjects broken down by compared Variation and acquisition channel
      (AcquisitionContext's utm_source/utm_medium/utm_campaign, resolved by
      direct match or a single identity-merge hop in either direction).
      Purely descriptive, like experiment-outcome-attribution's own list
      endpoints — not a statistical test, unlike
      experiment-sample-ratio-analysis or experiment-outcome-analysis.
  - name: webhooks
    description: >-
      Roadmap Phase 5 (Ecosystem): WebhookEndpoint create/list/disable
      endpoints, nested under their owning Project (creation and listing)
      or referenced directly by id (disable), plus read-only
      WebhookDelivery history (list per endpoint, and single-delivery
      detail including its delivered payload) so an operator can debug a
      failing integration without direct database access.
      Development-foundation, unauthenticated until the authentication
      change lands, mirroring credentials' own foundation-endpoint
      posture. Endpoints are never called on this document's request
      path — a background reconciler
      signs (HMAC-SHA256, X-Webhook-Signature header) and delivers pending
      WebhookDeliveries, created by DomainEventRecorder's fan-out whenever
      a subscribed event type is recorded: flag.published
      (environment-flag-targeting's manual publish only, never automated
      Rollout projections), rollout.promoted/paused/resumed/rolled_back
      (rollout-scheduling and rollout-pause-resume), guardrail.tripped
      (guardrail-auto-rollback, only for an automatic rollback or pause —
      never a promotion or resume, which are already covered by their own
      rollout.* events) and experiment.concluded (experiment-hypothesis).


      **Limits.** A Project may have at most 20 WebhookEndpoints (active or
      disabled both count toward this), and a single WebhookEndpoint may
      subscribe to at most 20 event types. Both are fixed limits, not
      currently configurable per customer.


      **Delivered body contract.** Every delivery body is a versioned
      envelope, not the raw event-specific fields — the
      `X-Webhook-Signature` HMAC covers this entire envelope, not just
      `data`:

      ```json
      {
        "event_type": "flag.published",
        "event_version": 1,
        "occurred_at": "2026-07-21T18:04:00Z",
        "data": { "environment_id": "env_1", "feature_flag_id": "flag_1", "enabled": true }
      }
      ```

      `data`'s shape is defined per `event_type` and versioned
      independently:

      - `flag.published` v1: `{ environment_id, feature_flag_id, enabled }`
      - `rollout.promoted` / `rollout.paused` / `rollout.resumed` /
        `rollout.rolled_back` v1: `{ reason, stage_position?,
        stage_target_percent?, environment_flag_config_id }`
      - `guardrail.tripped` v1: `{ rollout_id, observed_value, threshold,
        config_version, action, correlation_id, reason }`
      - `experiment.concluded` v1: `{ conclusion, winning_variation_id? }`

      **Compatibility policy.** Adding an optional field to `data` does not
      change `event_version`. Removing, renaming, or changing the type or
      meaning of a field increments `event_version` for that event type;
      receivers should check `event_version` and reject/ignore a value they
      do not understand rather than assuming an unfamiliar shape matches a
      known one.
  - name: support
    description: >-
      In-console feedback and support-ticket submission for a Member's own
      Organization: the floating widget's two flows (lightweight feedback,
      formal tickets with subject/description/category), a bidirectional
      message thread with staff, and presigned image-attachment upload.
      Every endpoint requires only a valid Member session — no additional
      RBAC permission — and is scoped to the caller's own Organization,
      rejecting a cross-Organization id identically to an unknown one.
      Ticket/message submission is rate limited per Member. The
      staff-facing counterpart (list/reply/close across every
      Organization, gated by support:view/support:respond/support:close)
      is a separate module, not yet exposed here.
