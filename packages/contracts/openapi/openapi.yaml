                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: A feature flag with this key already exists in this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_key_conflict
                  message: A feature flag with this key already exists in this project.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listFeatureFlags
      summary: List a project's feature flags
      description: >-
        Requires a session for a Member holding feature-flags:manage — it
        sits beside the create and get operations on this resource
        family and is gated no differently.


        Returns the project's feature flags newest first, with the identifier
        as tiebreaker so pagination is stable. Each flag carries its
        variations inline, so a list view needs no follow-up request per row.
        A project that owns no flag yields an empty collection, not a
        not-found; a project that does not exist, or belongs to another
        Organization, yields a non-disclosing not-found.
      tags: [feature-flags]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Defaults to 50 when absent, zero, or above the maximum
            of 200.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Rows to skip in the newest-first ordering. Defaults to 0.
          schema:
            type: integer
            minimum: 0
        - name: include_archived
          in: query
          required: false
          description: >-
            Include archived feature flags. Defaults to false, so the
            listing returns only the active set. This only changes which
            rows of the caller's own already-authorized project are
            returned, never which project can be queried.
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive substring match against the flag's name or
            key. Absent or empty means unfiltered.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: >-
            Restrict the result to flags carrying this exact tag. Absent
            or empty means unfiltered.
          schema:
            type: string
      responses:
        "200":
          description: The project's feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFeatureFlagsResponse"
              example:
                feature_flags:
                  - id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                    project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                    name: New Checkout Flow
                    description: Rolls out the redesigned checkout flow.
                    key: new-checkout-flow
                    variations:
                      - id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                        key: "on"
                        value: true
                      - id: 018f2f3a-9001-7000-9c3a-1f2b3c4d5e6f
                        key: "off"
                        value: false
                    tags: []
                    created_at: "2026-01-01T12:00:00Z"
                    updated_at: "2026-01-01T12:00:00Z"
                    archived_at: null
                limit: 50
                offset: 0
                has_more: false
        "400":
          description: Invalid limit, offset or include_archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_validation_error
                  message: limit must be a non-negative integer.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold feature-flags:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The project was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/feature-flags/{feature_flag_id}:
