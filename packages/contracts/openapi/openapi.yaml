        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        key:
          type: string
        aggregation_type:
          type: string
          enum: [count, sum, average, rate]
        unit:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MetricDefinitionList:
