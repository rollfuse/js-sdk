        an unknown one.
      tags: [metric-definition-ingestion]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metric definitions found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinitionList"
              example:
                metric_definitions:
                  - id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                    project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                    name: Checkout Error Rate
