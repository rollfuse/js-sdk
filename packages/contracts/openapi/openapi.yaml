  /v1/projects/{project_id}/environments/{environment_id}/clone:
    post:
      operationId: cloneEnvironment
      summary: Create an environment by cloning another
      description: >-
        Requires a session for a Member holding environments:manage.
        Creates a new environment and copies the source environment's flag
        configurations into it — never credentials or recorded traffic —
        per project-environment-management's "An Environment Can Be
        Created By Cloning Another" requirement. Each configuration is
        copied through the same manual write path as any other change, so
        it is validated and subject to the new environment's approval
        policy; a configuration that could not be copied is named in the
        response rather than failing the clone silently.
      tags: [environments]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: environment_id
          in: path
          required: true
          description: The source environment being cloned.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneEnvironmentRequest"
      responses:
        "201":
          description: Environment created; configurations copied where possible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloneEnvironmentResponse"
              example:
                environment:
                  id: 018f2f3a-8100-7000-9c3a-1f2b3c4d5e6f
                  project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                  name: Staging Clone
                  slug: staging-clone
                  is_production: false
                  requires_approval: false
                  disable_exempt_from_approval: true
                  created_at: "2026-01-01T12:00:00Z"
                  updated_at: "2026-01-01T12:00:00Z"
                copied_feature_flag_ids:
                  - 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                skipped: []
        "400":
          description: Validation error (malformed JSON, invalid name or slug).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
