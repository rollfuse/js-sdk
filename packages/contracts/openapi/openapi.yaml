    Experiment:
      type: object
      required:
        [
          id,
          project_id,
          environment_id,
          feature_flag_id,
          variation_ids,
          hypothesis,
          state,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        feature_flag_id:
          type: string
        variation_ids:
          type: array
          items:
            type: string
        hypothesis:
          type: string
        state:
          type: string
          enum: [draft, running, concluded, aborted]
        conclusion:
          type: string
          description: Absent (empty) until the Experiment is concluded.
        winning_variation_id:
          type: string
          description: Present only if a winning Variation was declared at conclusion.
        started_at:
          type: string
          format: date-time
          description: Present only once the Experiment has been started.
        concluded_at:
          type: string
          format: date-time
          description: Present only once the Experiment has been concluded.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExperimentList:
      type: object
      required: [experiments]
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"

    SampleRatioMismatchResult:
      type: object
      required: [insufficient_data]
      properties:
        insufficient_data:
          type: boolean
          description: >-
            True when any compared Variation has zero distinct attributed
            subjects. When true, variations/statistic/p_value/
            mismatch_detected are all absent: no computed statistic exists
            in that case.
        variations:
          type: array
          description: Present only when insufficient_data is false.
          items:
            type: object
            required: [variation_key, observed_count]
            properties:
              variation_key:
                type: string
              observed_count:
                type: integer
        statistic:
          type: number
          format: double
          description: The chi-squared goodness-of-fit statistic. Present only when insufficient_data is false.
        p_value:
          type: number
          format: double
          description: >-
            The approximate p-value, via the Wilson-Hilferty
            transformation. Present only when insufficient_data is false.
        mismatch_detected:
          type: boolean
          description: >-
            True iff p_value is below the fixed significance threshold
            (p < 0.001). Present only when insufficient_data is false.

    ComparisonPair:
      type: object
      required:
        [
          baseline_variation_id,
          variation_id,
          baseline_subject_count,
          variation_subject_count,
          effect_size,
          confidence_interval_low,
          confidence_interval_high,
          p_value,
        ]
      properties:
        baseline_variation_id:
          type: string
        variation_id:
          type: string
        baseline_subject_count:
          type: integer
        variation_subject_count:
          type: integer
        effect_size:
          type: number
          format: double
          description: Difference of proportions (count metrics) or difference of means (sum/average/rate metrics), variation minus baseline.
        confidence_interval_low:
          type: number
          format: double
        confidence_interval_high:
          type: number
          format: double
        p_value:
          type: number
          format: double
          description: >-
            Two-tailed p-value. No significance verdict is included; the
            operator interprets effect_size, the confidence interval and
            p_value together.

    OutcomeAnalysisResult:
      type: object
      required:
        [
          experiment_id,
          metric_definition_id,
          aggregation_type,
          unassigned_subject_count,
          contaminated_subject_count,
          multiple_comparison_correction_applied,
          comparisons,
        ]
      properties:
        experiment_id:
          type: string
        metric_definition_id:
          type: string
        aggregation_type:
          type: string
          enum: [count, sum, average, rate]
        unassigned_subject_count:
          type: integer
          description: Subjects with no attributed exposure to one of the Experiment's own compared Variations.
        contaminated_subject_count:
          type: integer
          description: Subjects whose attributed exposures span more than one of the Experiment's own compared Variations.
        multiple_comparison_correction_applied:
          type: boolean
          description: Always false in this iteration; disclosed explicitly rather than hidden when more than two Variations are compared.
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonPair"

    AcquisitionChannelBucket:
      type: object
      required:
        [variation_key, utm_source, utm_medium, utm_campaign, resolved, subject_count]
      properties:
        variation_key:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        resolved:
          type: boolean
          description: >-
            False when no AcquisitionContext could be resolved for the
            subjects in this bucket, by direct match or either single-hop
            identity resolution — distinct from a resolved AcquisitionContext
            whose UTM fields happen to be blank.
        subject_count:
          type: integer

    AcquisitionAttributionResult:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionChannelBucket"

    IssueCredentialRequest:
      type: object
      required: [scopes]
      additionalProperties: false
      properties:
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
          description: >-
            Issue this credential as safe to embed in browser-visible code.
            MUST be restricted to exactly the config:read scope — issuing a
            Public credential with any other scope is rejected. Defaults to
            false.

    Credential:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          scopes,
          public,
          status,
          token,
          created_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
          description: >-
            Whether this credential was issued as safe to embed in
            browser-visible code. Fixed at issuance.
        status:
          type: string
          enum: [active, revoked]
        token:
          type: string
          description: >-
            The plaintext credential token. Returned only in the issuance
            response; no other response ever includes it.
        created_at:
          type: string
          format: date-time

    ConfigureIdentityProviderRequest:
      type: object
      required: [issuer, client_id, client_secret, redirect_uri]
      additionalProperties: false
      properties:
        issuer:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        redirect_uri:
          type: string

    IdentityProvider:
      type: object
      required:
        [
          id,
          organization_id,
          issuer,
          client_id,
          redirect_uri,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"

    MemberResponse:
      type: object
      required: [id, email, name, status, roles]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        roles:
          type: array
          items:
            type: string

    InviteMemberRequest:
      type: object
      required: [email]
      description: >-
        Carries the invited email and nothing else. There is deliberately no
        organization_id field: an invite is always issued into the caller's
        own session-bound Organization, so the body cannot express a
        cross-tenant issuance. Unknown fields are rejected.
      properties:
        email:
          type: string
          format: email

    MemberInviteResponse:
      type: object
      required:
        [
          id,
          email,
          status,
          inviter_member_id,
          created_at,
          expires_at,
          accepted_at,
          revoked_at,
        ]
      description: >-
        A MemberInvite projected for administration. It has no token field by
        design: only the emailed link ever carries the accept token, and only
        a one-way hash of it is persisted.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: >-
            The status an operator must act on. A pending invite whose expiry
            has lapsed is reported as expired even though the stored row still
            says pending.
        inviter_member_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    MemberInviteListResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/MemberInviteResponse"

    AcceptInviteResponse:
      type: object
      required: [member_id, organization_id, email]
      description: >-
        The Member provisioned by a successful acceptance. It has no
        session-token field: accepting an invite provisions a Member, it does
        not sign anybody in.
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        email:
          type: string
          format: email

    CompleteLoginResponse:
      type: object
      required:
        [member_id, organization_id, email, session_token, expires_at]
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        email:
          type: string
        session_token:
          type: string
          description: >-
            The plaintext session token. Returned only in this response; no
            other response ever includes it.
        expires_at:
          type: string
          format: date-time

    RequestMagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RequestMagicLinkResponse:
      type: object
      required: [message]
      description: >-
        Deliberately identical whether or not the email matched an existing
        Member — see requestMagicLink's description.
      properties:
        message:
          type: string

    PeekMagicLinkResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean

    CurrentSessionResponse:
      type: object
      required: [member, organization, roles]
      description: >-
        The identity behind a presented session. It has no session-token field
        by design, so the endpoint cannot leak the token it is looked up by.
      properties:
        member:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
        organization:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        roles:
          type: array
          description: >-
            The roles this Member holds. Empty for a Member with no role
            assignment, which is the default after just-in-time provisioning.
          items:
            type: string

    GrantRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, member]

    RoleAssignment:
      type: object
      required:
        [id, organization_id, member_id, role, status, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        member_id:
          type: string
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    GrantRoleResponse:
      type: object
      required: [status]
      description: >-
        Discriminated by status: "granted" carries the created
        RoleAssignment; "pending_approval" carries approval_request_id
        instead.
      properties:
        status:
          type: string
          enum: [granted, pending_approval]
        approval_request_id:
          type: string
        role_assignment:
          $ref: "#/components/schemas/RoleAssignment"

    ApprovalRequest:
      type: object
      required:
        [
          id,
          organization_id,
          target_member_id,
          requested_by_member_id,
          role,
          status,
          created_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        target_member_id:
          type: string
        requested_by_member_id:
          type: string
        role:
          type: string
          enum: [admin]
        status:
          type: string
          enum: [pending, approved, rejected]
        decided_by_member_id:
          type: string
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time

    ScimTokenResponse:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
        token:
          type: string
          description: >-
            Present only in the issuance response — the plaintext token
            is never retrievable again.
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    ScimTokenListResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ScimTokenResponse"

    ScimUserRequest:
      type: object
      required: [externalId, userName]
      properties:
        externalId:
          type: string
        userName:
          type: string
          format: email
        displayName:
          type: string

    ScimUser:
      type: object
      required: [schemas, id, userName, active]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean

    ScimListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimUser"

    ScimPatchRequest:
      type: object
      required: [Operations]
      description: >-
        RFC 7644 §3.5.2 PatchOp shape. Only an "active" value is
        inspected; every other attribute is ignored.
      properties:
        Operations:
          type: array
          items:
            type: object
            properties:
              op:
                type: string
              path:
                type: string
              value: {}

    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
        detail:
          type: string

    CredentialMetadata:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          scopes,
          public,
          status,
          created_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
          description: >-
            Whether this credential was issued as safe to embed in
            browser-visible code. Fixed at issuance.
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    CreateWebhookEndpointRequest:
      type: object
      required: [url, event_types]
      additionalProperties: false
      properties:
        url:
          type: string
          description: Must be an http(s) URL.
        event_types:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              [
                flag.published,
                rollout.promoted,
                rollout.paused,
                rollout.resumed,
                rollout.rolled_back,
                guardrail.tripped,
                experiment.concluded,
              ]

    WebhookEndpoint:
      type: object
      required: [id, project_id, url, event_types, status, secret, created_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        secret:
          type: string
          description: >-
            The plaintext signing secret. Returned only in the creation
            response; no other response ever includes it. Used to compute
            each delivery's X-Webhook-Signature HMAC-SHA256 header.
        created_at:
          type: string
          format: date-time

    WebhookEndpointMetadata:
      type: object
      required: [id, project_id, url, event_types, status, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDeliveryMetadata:
      type: object
      required:
        [
          id,
          webhook_endpoint_id,
          event_type,
          status,
          attempt_count,
          last_attempted_at,
          next_attempt_at,
          last_failure_reason,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        webhook_endpoint_id:
          type: string
        event_type:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt_count:
          type: integer
        last_attempted_at:
          type: [string, "null"]
          format: date-time
          description: Null until the first delivery attempt.
        next_attempt_at:
          type: string
          format: date-time
        last_failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      required:
        [
          id,
          webhook_endpoint_id,
          event_type,
          payload,
          status,
          attempt_count,
          last_attempted_at,
          next_attempt_at,
          last_failure_reason,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        webhook_endpoint_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          description: >-
            The full enveloped body (event_type, event_version, occurred_at,
            data) that was signed and sent to the receiving endpoint.
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt_count:
          type: integer
        last_attempted_at:
          type: [string, "null"]
          format: date-time
          description: Null until the first delivery attempt.
        next_attempt_at:
          type: string
          format: date-time
        last_failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvaluationVariation:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}

    EvaluationOutcome:
      type: object
      additionalProperties: false
      properties:
        variation_key:
          type: string
        rollout:
          type: array
          minItems: 2
          items:
            type: object
            required: [variation_key, percentage]
            properties:
              variation_key:
                type: string
              percentage:
                type: integer
                minimum: 1
                maximum: 100

    EvaluationRule:
      type: object
      required: [outcome]
      properties:
        conditions:
          type: array
          description: >-
            Attribute-equality conditions that MUST ALL match (logical AND)
            for this Rule to apply. Absent or empty means an unconditional
            catch-all. A Rule that referenced a reusable Segment has that
            Segment's conditions resolved here — the two look identical on
            the wire.
          items:
            type: object
            required: [attribute, value]
            properties:
              attribute:
                type: string
              value:
                type: string
        outcome:
          $ref: "#/components/schemas/EvaluationOutcome"

    FlagConfig:
      type: object
      required: [flag_key, enabled, default_variation, variations, rules]
      properties:
        flag_key:
          type: string
        enabled:
          type: boolean
        default_variation:
          type: string
        variations:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationVariation"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationRule"

    Configuration:
      type: object
      required: [environment_id, version, flags]
      properties:
        environment_id:
          type: string
        version:
          type: integer
          description: >-
            Monotonically increasing Configuration Version for this
            Environment. Advances whenever a FeatureFlag, its Variations,
            or an EnvironmentFlagConfig affecting this Environment is
            created, updated or removed.
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FlagConfig"

    EvaluateRequest:
      type: object
      required: [subject_key]
      additionalProperties: false
      properties:
        subject_key:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        flag_key:
          type: string
          description: Omit to evaluate every FeatureFlag configured in the Environment.

    EvaluationResult:
      type: object
      required:
        [
          flag_key,
          variation_key,
          value,
          reason,
          config_version,
          track_exposure,
        ]
      properties:
        flag_key:
          type: string
        variation_key:
          type: string
        value: {}
        reason:
          type: string
          enum:
            [
              rule_match,
              default_disabled,
              default_no_rule_match,
              default_fallback,
            ]
        config_version:
          type: integer
        track_exposure:
          type: boolean

    EvaluateResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationResult"

    ExposureEvent:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          feature_flag_id,
          subject_key,
          variation_key,
          reason,
          config_version,
          correlation_id,
          occurred_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        feature_flag_id:
          type: string
        subject_key:
          type: string
        variation_key:
          type: string
        reason:
          type: string
        config_version:
          type: integer
        correlation_id:
          type: string
        occurred_at:
          type: string
          format: date-time

    ExposureEventList:
      type: object
      required: [exposure_events]
      properties:
        exposure_events:
          type: array
          items:
            $ref: "#/components/schemas/ExposureEvent"

    ExposureEventSubmission:
      type: object
      required:
        [flag_key, subject_key, variation_key, reason, config_version]
      properties:
        flag_key:
          type: string
        subject_key:
          type: string
        variation_key:
          type: string
        reason:
          type: string
        config_version:
          type: integer
        correlation_id:
          type: string
          description: >-
            Client-generated. Falls back to the request's own request id
            when omitted.
        occurred_at:
          type: string
          format: date-time
          description: >-
            When the local evaluation that produced this event occurred.
            Falls back to the server's receive time when omitted.

    SubmitExposureEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ExposureEventSubmission"

    SubmitExposureEventsResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: >-
            How many submitted events resolved to a known flag_key and
            were handed off for best-effort recording.

    SegmentConditionInput:
