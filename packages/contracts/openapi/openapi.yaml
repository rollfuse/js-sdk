  /v1/support/tickets:
    post:
      operationId: createSupportTicket
      summary: Submit feedback or open a formal support ticket
      description: >-
        Requires a valid Member session; no additional RBAC permission —
        any Member of an Organization may submit feedback or a ticket for
        that Organization. organization_id and member_id are always taken
        from the resolved session, never from the request body. Rate
        limited per Member (429 on excess). kind "feedback" starts with
        no visible status and accepts no category; kind "ticket" requires
        subject, description and category, and starts at status "open".
      tags: [support]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketRequest"
            examples:
              feedback:
                value:
                  kind: feedback
                  description: Love the new dashboard, would be great to filter by tag.
              ticket:
                value:
                  kind: ticket
                  subject: Webhook deliveries failing since yesterday
                  description: All webhook deliveries to our endpoint have 500'd since ~14:00 UTC.
                  category: bug
      responses:
        "201":
          description: Feedback entry or support ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: >-
            Validation error (invalid kind, missing required field for
            kind "ticket", or category outside the fixed set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: support_validation_error
                  message: "support ticket: category is not one of the allowed values"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The submitting Member exceeded the per-Member rate limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: listSupportTickets
      summary: List the caller's Organization's feedback and tickets
      description: >-
        Requires a valid Member session. Returns both kind "feedback" and
        kind "ticket" entries for the session's own Organization, newest
        first. A feedback entry's status is never included.
      tags: [support]
      security:
        - sessionAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Defaults to 50 when absent, zero, or above the
            maximum of 200.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Rows to skip in the newest-first ordering. Defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The caller's Organization's feedback and tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSupportTicketsResponse"
        "400":
          description: Invalid limit or offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/support/tickets/{support_ticket_id}:
