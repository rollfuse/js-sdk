  /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/history/{history_point_id}/restore:
    post:
      operationId: restoreFlagChangeHistoryPoint
      summary: Restore a previous history point as a new change
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. Applies the point's configuration
        as a new change to its own Environment+FeatureFlag pair (not
        necessarily the pair named in the path, which is accepted only for
        a consistent, nested route shape), subject to the same validation
        and approval-policy rules as any other manual write, per
        flag-change-history's "A Previous Configuration Can Be Restored"
        requirement. Records a flag.restored audit event and a new
        HistoryPoint identifying the point that was restored.
      tags: [flag-change-history]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
        - name: history_point_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The point was restored; the resulting configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationSnapshot"
              example:
                enabled: true
                default_variation_id: 018f2f3a-9200-7000-9c3a-1f2b3c4d5e6f
                rules: []
        "400":
          description: >-
            The restored configuration is no longer valid: it references a
            variation or segment that no longer exists, or another
            validation error environmentflagconfig's own write path would
            reject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: flag_restore_no_longer_valid
                  message: "environment flag config: referenced variation does not belong to this feature flag"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: >-
            The feature flag's entitlement allocation is locked (see the
            config PUT endpoint's identical 402).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The session's Member does not hold
            environment-flag-configs:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            History point was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: history_point_not_found
                  message: History point was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The configuration is owned by a scheduled or active Rollout,
