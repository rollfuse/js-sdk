  /v1/projects/{project_id}/metric-definitions/{metric_definition_id}:
    get:
      operationId: getMetricDefinition
      summary: Get a metric definition by ID
      description: >-
        Requires a session for a Member holding metrics:manage. Returns a
        non-disclosing not-found response when the metric definition
        exists but belongs to a different project, or a project outside
        the caller's own Organization.
      tags: [metric-definition-ingestion]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metric definition found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinition"
              example:
                id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: Checkout Error Rate
                description: Share of checkout attempts that fail.
                key: checkout-error-rate
                aggregation_type: rate
                unit: percent
                archived_at: null
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Metric definition was not found, belongs to a different
            project, or that project belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: metric_definition_not_found
                  message: Metric definition or environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    patch:
      operationId: renameMetricDefinition
      summary: Rename and/or redescribe a metric definition
      description: >-
        Requires a session for a Member holding metrics:manage. Updates
        the definition's name and description. Its key is immutable after
        creation.
      tags: [metric-definition-ingestion]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameMetricDefinitionRequest"
      responses:
        "200":
          description: Metric definition renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinition"
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Metric definition was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteMetricDefinition
      summary: Delete a metric definition
      description: >-
        Requires a session for a Member holding metrics:manage. Deletion
        is permanent and distinct from archive, which remains the
        reversible option. Refused with
        metric_definition_has_dependents, naming every one, when a
        Guardrail or Connector still references the definition.
      tags: [metric-definition-ingestion]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Metric definition deleted.
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Metric definition was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The metric definition is still referenced by at least one
            Guardrail or Connector, named in the error message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: metric_definition_has_dependents
                  message: "metric definition: cannot be deleted while referenced by guardrail gr_1, connector conn_1"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/metric-definitions/{metric_definition_id}/archive:
    post:
      operationId: archiveMetricDefinition
      summary: Archive a metric definition
      description: >-
        Requires a session for a Member holding metrics:manage. Archiving
        stops the definition being offered for new use, but every
        existing Guardrail, Connector or Observation referencing it
        continues to resolve. Nothing is deleted.
      tags: [metric-definition-ingestion]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Metric definition archived.
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Metric definition was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The metric definition is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: metric_definition_already_archived
                  message: This metric definition is already archived.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/metric-definitions/{metric_definition_id}/observations:
    post:
      operationId: ingestObservations
      summary: Ingest a batch of Observations for a MetricDefinition within an Environment
      description: >-
        Credential-authenticated endpoint (Bearer token, requires the
        metrics:write scope). Observations are attributed to exactly the
        Credential's own Environment; the referenced MetricDefinition MUST
        belong to that Environment's Project. Every observation in the
        batch is validated independently; if any observation is malformed,
        the ENTIRE request is rejected, identifying which observation(s)
        failed, and NOTHING from the batch is persisted (no
        partial-success). Accepted observations are persisted
        asynchronously and best-effort via a bounded in-process queue and
        background worker, mirroring exposure-event-recording; under
        sustained overload some accepted observations may still be dropped
        (see the metric.observations.dropped counter).
      tags: [metric-definition-ingestion]
      security:
        - bearerAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestObservationsRequest"
            example:
              observations:
                - value: 0.02
                  occurred_at: "2026-01-01T00:00:00Z"
                  correlation_id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                - value: 0.03
                  occurred_at: "2026-01-01T00:01:00Z"
      responses:
        "202":
          description: >-
            Every observation in the batch passed validation and was
            submitted for asynchronous persistence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestObservationsResponse"
              example:
                accepted: 2
        "400":
          description: >-
            Malformed JSON, or one or more observations in the batch
            failed validation. Non-disclosing about which fields succeed:
            the message identifies every failing observation's index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: observations_validation_error
                  message: "invalid observations: observation[1]: observation: value is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing, unknown, revoked or otherwise invalid Credential token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_invalid
                  message: A valid bearer credential is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The Credential does not grant the metrics:write scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_scope_denied
                  message: The credential does not grant the required scope.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: >-
            The referenced MetricDefinition does not exist, or belongs to
            a different Project than the Credential's own. Non-disclosing:
            the response never distinguishes these cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: metric_definition_not_found
                  message: Metric definition or environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listObservations
      summary: List Observations for a MetricDefinition within an Environment
      description: >-
        Requires a session for a Member holding metrics:manage, separate
        from the Credential-authenticated ingestion endpoint above, per
        design.md decision 5 in add-metric-definition-ingestion. Returns
        Observations ordered by occurrence time, optionally bounded by
        from/to and paginated by limit/offset. An Environment outside the
        caller's own Organization is rejected identically to an unknown
        MetricDefinition/Environment pair.
      tags: [metric-definition-ingestion]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on occurred_at (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on occurred_at (RFC3339).
          schema:
            type: string
            format: date-time
        - name: subject_key
          in: query
          required: false
          description: >-
            When present, restricts the result to Observations recorded
            for that subject key.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Observations found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationList"
              example:
                observations:
                  - id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                    metric_definition_id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                    environment_id: 018f2f3a-3000-7000-9c3a-1f2b3c4d5e6f
                    value: 0.02
                    occurred_at: "2026-01-01T00:00:00Z"
                    correlation_id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                    subject_key: user_1
        "400":
          description: A from/to/limit/offset query parameter was malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: observations_validation_error
                  message: "from must be a valid RFC3339 timestamp."
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The MetricDefinition or Environment was not found, they
            belong to different Projects, or the Environment belongs to
            another Organization. Non-disclosing: the response never
            distinguishes these cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: metric_definition_not_found
                  message: Metric definition or environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/observations:
