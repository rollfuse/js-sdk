          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the feature flag was archived, or null when it is active.
            Archiving is a soft state: the flag, its variations and all of
            its history remain readable, only its entitlement slot is
            released and its targeting disabled everywhere.

    RolloutSplit:
      type: object
      required: [variation_id, percentage]
      additionalProperties: false
      properties:
        variation_id:
          type: string
        percentage:
          type: number
          description: >-
            Up to two decimal places, matching the bucketing space's
            0.01% resolution (expand-targeting-model task 8.5) — a
            canary below one percent is expressible.
          minimum: 0.01
          maximum: 100

    Outcome:
      type: object
      additionalProperties: false
      properties:
        variation_id:
          type: string
        rollout:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RolloutSplit"

    RuleInput:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        attribute:
          type: string
          description: >-
            Mutually exclusive with segment_id. Both attribute and value
            set is a clause condition; both empty (with no segment_id) is
            an unconditional catch-all.
        value:
          type: string
        op:
          type: string
          description: >-
            The clause operator, from expand-targeting-model's enumerated,
            closed set. Omitted defaults to eq (exact string equality),
            matching every Rule authored before this field existed.
          enum:
            [
              eq,
              neq,
              gt,
              gte,
              lt,
              lte,
              in,
              prefix,
              suffix,
              substring,
              regex,
              semver_gt,
              semver_gte,
              semver_lt,
              semver_lte,
              present,
            ]
        value_type:
          type: string
          description: >-
            The typed shape value carries. Omitted defaults to string,
            matching every Rule authored before this field existed.
          enum: [string, number, boolean, list]
        segment_id:
          type: string
          description: >-
            References an existing Segment's conditions instead of an
            inline attribute/value pair. Mutually exclusive with attribute.
        condition:
          $ref: "#/components/schemas/ClauseTree"
          description: >-
            expand-targeting-model's composed condition (AND/OR/negation/
            nesting) — mutually exclusive with attribute/segment_id. Omitted
            means this Rule uses the flat leaf shape above instead.
        outcome:
          $ref: "#/components/schemas/Outcome"

    Rule:
      type: object
      required: [outcome]
      properties:
        attribute:
          type: string
        value:
          type: string
        op:
          type: string
        value_type:
          type: string
        segment_id:
          type: string
        condition:
          $ref: "#/components/schemas/ClauseTree"
        outcome:
          $ref: "#/components/schemas/Outcome"

    ClauseTree:
      type: object
      description: >-
        A rule condition node: a single leaf clause, or a group of child
        clause_trees combined with AND/OR, or a negation of exactly one
        child, per environment-flag-targeting's "Clauses Compose With AND,
        OR And Negation" requirement. Groups nest to a bounded depth
        (5, expand-targeting-model task 1.2's recorded bound). Mirrors
        apps/api/internal/evaluation/domain's ClauseTree JSON encoding
        exactly — there is one wire shape, not two independently-drifting
        ones.
      required: [op]
      properties:
        op:
          type: string
          enum: [leaf, and, or, not, segment]
        attribute:
          type: string
          description: Set only for a leaf node.
        type:
          type: string
          enum: [string, number, boolean, list]
          description: Set only for a leaf node.
        value:
          description: Set only for a leaf node; its shape follows type.
        clause:
          $ref: "#/components/schemas/ClauseTree"
          description: Set only for a "not" node — the single negated child.
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/ClauseTree"
          description: Set only for an "and"/"or" node.
        segment_id:
          type: string
          description: Set only for a "segment" node.

    IndividualTarget:
      type: object
      required: [variation_id, subject_keys]
      properties:
        variation_id:
          type: string
        subject_keys:
