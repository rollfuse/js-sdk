                id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                webhook_endpoint_id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                event_type: flag.published
                payload:
                  event_type: flag.published
                  event_version: 1
                  occurred_at: "2026-01-01T12:00:00Z"
                  data:
                    environment_id: 018f2f3a-3000-7000-9c3a-1f2b3c4d5e6f
                    feature_flag_id: 018f2f3a-4000-7000-9c3a-1f2b3c4d5e6f
                    enabled: true
                status: delivered
                attempt_count: 1
                last_attempted_at: "2026-01-01T12:00:05Z"
                next_attempt_at: "2026-01-01T12:00:05Z"
                last_failure_reason: ""
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:05Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold webhooks:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The webhook delivery was not found, or its endpoint belongs to
            another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: webhook_delivery_not_found
                  message: Webhook delivery was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/config:
    get:
      operationId: getConfiguration
      summary: Fetch the caller's Environment published flag configuration
      description: >-
        Credential-authenticated endpoint (Bearer token, requires the
        config:read scope). Unlike every other endpoint in this document,
        this one IS authenticated from day one: it is the first endpoint a
        Service Credential (rather than a human/operator) calls. Returns
        every FeatureFlag owned by the Credential's own Project, configured
        for the Credential's own Environment, plus the current
        Configuration Version. A Credential can never retrieve another
        Environment's configuration: the query scope comes solely from the
        resolved Credential, never from a request parameter.
      tags: [evaluation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's Environment configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
              example:
                environment_id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                version: 3
                flags:
                  - flag_key: checkout-redesign
                    enabled: true
                    default_variation: off
                    variations:
                      - key: "on"
                        value: true
                      - key: "off"
                        value: false
                    rules:
                      - conditions:
                          - attribute: plan
                            value: enterprise
                        outcome:
                          variation_key: "on"
        "401":
          description: Missing, unknown, revoked or otherwise invalid Credential token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_invalid
                  message: A valid bearer credential is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The Credential does not grant the config:read scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_scope_denied
                  message: The credential does not grant the required scope.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/evaluate:
    post:
      operationId: evaluateFlags
      summary: Evaluate one or all FeatureFlags for a subject in the caller's Environment
      description: >-
        Credential-authenticated endpoint (Bearer token, requires the
        config:read scope). Evaluates flag_key (or every FeatureFlag
        configured in the caller's own Environment, if flag_key is
        omitted) deterministically for subject_key and attributes, using
        the stable bucketing/evaluation algorithm documented in the
        evaluation module. Per the Safe Fallback requirement, a disabled
        flag or a flag with no matching rule always resolves to its
        default Variation rather than an error; only an unknown flag_key
        returns 404.


        Before evaluating, attributes is enriched with the subject_key's
        captured AcquisitionContext (utm_source, utm_medium, utm_campaign,
        utm_term, utm_content, landing_url, referrer), if one exists for
        the caller's Environment: any of those keys the request did not
        already supply is filled in from the captured context, so a Rule
        or Segment can target acquisition attributes without the SDK
        having to resend them on every call. An attribute explicitly
        supplied in the request always wins over the captured one on the
        same key. No captured AcquisitionContext for the subject is not an
        error; attributes are evaluated unchanged. This enrichment only
        applies to this endpoint, not to /v1/config.
      tags: [evaluation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
            examples:
              explicit_attributes:
                summary: Attributes supplied directly by the caller
                value:
                  subject_key: user_123
                  attributes:
                    plan: enterprise
                  flag_key: checkout-redesign
              enriched_from_acquisition_context:
                summary: >-
                  No utm_source supplied; the subject's captured
                  AcquisitionContext still resolves a Rule/Segment
                  targeting it
                value:
                  subject_key: user_123
                  flag_key: checkout-redesign
      responses:
        "200":
          description: Evaluation result(s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
              example:
                results:
                  - flag_key: checkout-redesign
                    variation_key: "on"
                    value: true
                    reason: rule_match
                    config_version: 3
                    track_exposure: true
        "400":
          description: Validation error (including malformed JSON or a missing subject_key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: evaluation_validation_error
                  message: subject_key is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing, unknown, revoked or otherwise invalid Credential token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_invalid
                  message: A valid bearer credential is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The Credential does not grant the config:read scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_scope_denied
                  message: The credential does not grant the required scope.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: >-
            The requested flag_key does not exist in the Credential's
            Project. Non-disclosing: the response never distinguishes this
            from any other reason a flag key might be considered invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_not_found
                  message: Feature flag was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/exposure-events:
    post:
      operationId: submitExposureEvents
      summary: Submit a batch of ExposureEvents produced by local evaluation
      description: >-
        Credential-authenticated endpoint (Bearer token, requires the
        config:read scope). Lets a client that evaluates flags locally
        (an SDK, per ADR 0004) submit the ExposureEvents its own
        evaluation produced, since /v1/evaluate's own exposure recording
        has no equivalent for a client that never called it. Every event
        is attributed to the caller's own Credential-resolved
        Organization/Project/Environment; organization_id/project_id/
        environment_id are never accepted in the request body. Each
        event's flag_key is resolved to a FeatureFlag id scoped to the
        caller's own Project; an event whose flag_key cannot be resolved
        there is dropped from the batch rather than failing the whole
        request (e.g. a locally-cached Configuration referencing a
        since-deleted or -renamed flag). Recording itself remains
        best-effort, per exposure-event-recording's own "Non-Blocking,
        Best-Effort Recording" requirement: this endpoint's 202 response
        means the batch was accepted for best-effort recording, not that
        every event has already persisted.
      tags: [evaluation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitExposureEventsRequest"
            example:
              events:
                - flag_key: checkout-redesign
                  subject_key: user_123
                  variation_key: "on"
                  reason: rule_match
                  config_version: 3
                  correlation_id: 018f2f3a-7a1b-7c2d-9e3f-1f2b3c4d5e6f
                  occurred_at: "2026-07-26T12:00:00Z"
      responses:
        "202":
          description: >-
            The batch was accepted for best-effort recording. accepted
            counts events that resolved to a known flag_key and were
            handed off for recording, not events that have already
            persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitExposureEventsResponse"
              example:
                accepted: 1
        "400":
          description: >-
            Validation error (malformed JSON, or an event missing a
            required field other than an unresolvable flag_key, which is
            dropped rather than rejected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: exposure_submission_validation_error
                  message: events[0] is missing a required field.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing, unknown, revoked or otherwise invalid Credential token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_invalid
                  message: A valid bearer credential is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The Credential does not grant the config:read scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_scope_denied
                  message: The credential does not grant the required scope.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/exposure-events:
    get:
      operationId: listExposureEvents
      summary: List ExposureEvents for a FeatureFlag within an Environment
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands (operator-authenticated per
        design.md decision 5 in add-exposure-event-recording, NOT
        Credential-authenticated, unlike the evaluation endpoints).
        Returns ExposureEvents ordered by occurrence time, optionally
        bounded by from/to and paginated by limit/offset. Recording
        itself is asynchronous and best-effort: an ExposureEvent may not
        yet be visible immediately after the evaluation that produced it
        returns, and under sustained queue overload some ExposureEvents
        may never be recorded at all (see the exposure.events.dropped
        counter).
      tags: [exposure-event-recording]
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on occurred_at (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on occurred_at (RFC3339).
          schema:
            type: string
            format: date-time
        - name: subject_key
          in: query
          required: false
          description: >-
            When present, restricts the result to ExposureEvents recorded
            for that subject key.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: ExposureEvents found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureEventList"
              example:
                exposure_events:
                  - id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                    organization_id: 018f2f3a-1000-7000-9c3a-1f2b3c4d5e6f
                    project_id: 018f2f3a-2000-7000-9c3a-1f2b3c4d5e6f
                    environment_id: 018f2f3a-3000-7000-9c3a-1f2b3c4d5e6f
                    feature_flag_id: 018f2f3a-4000-7000-9c3a-1f2b3c4d5e6f
                    subject_key: user_123
                    variation_key: "on"
                    reason: rule_match
                    config_version: 3
                    correlation_id: 018f2f3a-5000-7000-9c3a-1f2b3c4d5e6f
                    occurred_at: "2026-01-01T00:00:00Z"
        "400":
          description: A from/to/limit/offset query parameter was malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: exposure_events_validation_error
                  message: "from must be a valid RFC3339 timestamp."
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: >-
            The FeatureFlag or Environment was not found, or they belong
            to different Projects. Non-disclosing: the response never
            distinguishes these cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: exposure_events_not_found
                  message: Feature flag or environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/metric-definitions:
