  /v1/projects/{project_id}/guardrail-templates:
    post:
      operationId: createGuardrailTemplate
      summary: Create a reusable GuardrailTemplate under a project
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. A GuardrailTemplate is a named,
        Project-scoped, reusable Guardrail policy shape (comparison
        operator, threshold, evaluation window, and optional promote/pause/
        resume-cool-down durations) that can later be installed onto any
        Rollout in the same Project, producing an independent Guardrail —
        see POST /v1/guardrail-templates/{guardrail_template_id}/install.
      tags: [guardrail-templates]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuardrailTemplateRequest"
            example:
              name: Error rate guard
              comparison_operator: gt
              threshold: 0.01
              evaluation_window_seconds: 900
      responses:
        "201":
          description: GuardrailTemplate created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
              example:
                id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: Error rate guard
                comparison_operator: gt
                threshold: 0.01
                evaluation_window_seconds: 900
                review_status: draft
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: >-
            Validation error (malformed JSON, missing name, invalid
            comparison operator, or a non-positive evaluation window or
            optional duration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: evaluation window must be a positive duration"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: The owning project was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listGuardrailTemplates
      summary: List GuardrailTemplates registered for a project
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands.
      tags: [guardrail-templates]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GuardrailTemplates found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplateList"
              example:
                guardrail_templates:
                  - id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                    project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                    name: Error rate guard
                    comparison_operator: gt
                    threshold: 0.01
                    evaluation_window_seconds: 900
                    review_status: draft
                    created_at: "2026-01-01T12:00:00Z"
                    updated_at: "2026-01-01T12:00:00Z"

  /v1/guardrail-templates/{guardrail_template_id}:
    get:
      operationId: getGuardrailTemplate
      summary: Get a GuardrailTemplate by ID
      description: >-
        Development-foundation endpoint, unauthenticated until the
