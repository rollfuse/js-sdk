        "400":
          description: subject_key was missing, or limit/offset was malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: observations_validation_error
                  message: "subject_key is required."
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The Environment was not found, or belongs to another
            Organization. Non-disclosing: the response never distinguishes
            these cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: metric_definition_not_found
                  message: Metric definition or environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/acquisition-contexts:
    post:
      operationId: recordAcquisitionContext
      summary: Submit a first-touch AcquisitionContext for a subject within an Environment
      description: >-
        Credential-authenticated endpoint (Bearer token, requires the
        acquisition:write scope). The AcquisitionContext is attributed to
        exactly the Credential's own Organization/Project/Environment. Only
        the FIRST submission for a given subject_key is captured: a later
        submission for a subject_key that already has a stored
        AcquisitionContext is accepted (202) but does not alter the stored
        values, per the "First-Touch-Only Capture" requirement. Accepted
        submissions are persisted asynchronously and best-effort via a
        bounded in-process queue and background worker, mirroring
        exposure-event-recording and metric-definition-ingestion; under
        sustained overload some accepted submissions may still be dropped
        (see the acquisition.contexts.dropped counter).
      tags: [acquisition-context-capture]
      security:
        - bearerAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAcquisitionContextRequest"
            example:
              subject_key: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
              utm_source: google
              utm_medium: cpc
              utm_campaign: spring-sale
              landing_url: https://example.com/pricing
              referrer: https://google.com
              occurred_at: "2026-01-01T00:00:00Z"
      responses:
        "202":
          description: >-
            The submission passed validation and was submitted for
            asynchronous persistence (whether or not it will be the
            subject's first-touch record).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordAcquisitionContextResponse"
              example:
                accepted: true
        "400":
          description: Malformed JSON, or the submission failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: acquisition_context_validation_error
                  message: "acquisition context: subject_key is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing, unknown, revoked or otherwise invalid Credential token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_invalid
                  message: A valid bearer credential is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The Credential does not grant the acquisition:write scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_scope_denied
                  message: The credential does not grant the required scope.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/acquisition-contexts/{subject_key}:
    get:
      operationId: getAcquisitionContext
      summary: Get the AcquisitionContext recorded for a subject within an Environment
      description: >-
        Development-foundation, operator-authenticated (unauthenticated
        until the authentication change lands) read endpoint, separate from
        the Credential-authenticated submission endpoint above.
      tags: [acquisition-context-capture]
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: subject_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AcquisitionContext found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionContext"
              example:
                id: 018f2f3a-e000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-1000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-2000-7000-9c3a-1f2b3c4d5e6f
                environment_id: 018f2f3a-3000-7000-9c3a-1f2b3c4d5e6f
                subject_key: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                utm_source: google
                utm_medium: cpc
                utm_campaign: spring-sale
                utm_term: ""
                utm_content: ""
                landing_url: https://example.com/pricing
                referrer: https://google.com
                occurred_at: "2026-01-01T00:00:00Z"
        "404":
          description: >-
            No AcquisitionContext exists for this subject_key, or the
            Environment does not exist. Non-disclosing: the response never
            distinguishes these cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: acquisition_context_not_found
                  message: Acquisition context or environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/identity-links:
    post:
      operationId: recordIdentityLink
      summary: Submit an IdentityLink for a subject within an Environment
      description: >-
        Credential-authenticated endpoint (Bearer token, requires the
        identity:write scope). The IdentityLink is attributed to exactly the
        Credential's own Organization/Project/Environment. Only the FIRST
        submission for a given alias_key is captured: a later submission for
        an alias_key that already has a stored IdentityLink is accepted
        (202) but does not alter the stored canonical_key, even if it names
        a different one, per the "First-Link-Wins Capture" requirement.
        alias_key and canonical_key MUST differ. Accepted submissions are
        persisted asynchronously and best-effort via a bounded in-process
        queue and background worker, mirroring acquisition-context-capture;
        under sustained overload some accepted submissions may still be
        dropped (see the identity.links.dropped counter).
      tags: [identity-merge]
      security:
        - bearerAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordIdentityLinkRequest"
            example:
              alias_key: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
              canonical_key: 018f2f3a-f000-7000-9c3a-1f2b3c4d5e6f
              linked_at: "2026-01-01T00:00:00Z"
      responses:
        "202":
          description: >-
            The submission passed validation and was submitted for
            asynchronous persistence (whether or not it will be the alias
            key's first link).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordIdentityLinkResponse"
              example:
                accepted: true
        "400":
          description: >-
            Malformed JSON, or the submission failed validation (including
            alias_key equal to canonical_key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: identity_link_validation_error
                  message: "identity link: alias_key must not equal canonical_key"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing, unknown, revoked or otherwise invalid Credential token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_invalid
                  message: A valid bearer credential is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The Credential does not grant the identity:write scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_scope_denied
                  message: The credential does not grant the required scope.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/identity-links/{subject_key}/canonical:
    get:
      operationId: resolveIdentity
      summary: Resolve a subject key to its canonical key within an Environment
      description: >-
        Development-foundation, operator-authenticated (unauthenticated
        until the authentication change lands) read endpoint, separate from
        the Credential-authenticated submission endpoint above. Resolution
        is single-hop only: if the subject key is a known alias, its direct
        canonical key is returned; otherwise the subject key itself is
        returned unchanged. Resolution never chains through a second link.
      tags: [identity-merge]
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: subject_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Resolution succeeded. canonical_key equals subject_key when no
            IdentityLink exists for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIdentityResponse"
              example:
                subject_key: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                canonical_key: 018f2f3a-f000-7000-9c3a-1f2b3c4d5e6f
        "404":
          description: The Environment does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: identity_environment_not_found
                  message: Environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/members:
    get:
      operationId: listMembers
      summary: List an Organization's Members with their currently active roles
      description: >-
        Requires a session for a Member holding roles:manage. Exists
        specifically to support RBAC administration — discovering a
        Member id to grant or revoke a role for — not as a general team
        directory. Never includes idp_subject, which is IdP-internal.
      tags: [member]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Members listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
              example:
                members:
                  - id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                    email: person@example.com
                    name: Person One
                    status: active
                    roles: [admin]
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/invites:
    post:
      operationId: inviteMember
      summary: Invite a person to join an Organization by email
      description: >-
        Requires a session for a Member holding members:manage. Issues a
        single-use MemberInvite expiring in 7 days and emails its accept link
        to the invited address.


        No Member is created here: provisioning is deferred to acceptance.
        The Organization is always the caller's own session-bound one —
        organization_id in the path is only compared against it, and a path
        id naming a different Organization is answered exactly like an
        unknown one.
      tags: [member]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
            example:
              email: invitee@example.com
              role: member
      responses:
        "201":
          description: Invite issued and emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInviteResponse"
              example:
                id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                email: invitee@example.com
                role: member
                status: pending
                inviter_member_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                created_at: "2026-01-01T12:00:00Z"
                expires_at: "2026-01-08T12:00:00Z"
                accepted_at: null
                revoked_at: null
        "400":
          description: Missing email, or a malformed body (unknown fields are rejected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_validation_error
                  message: email is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold members:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The organization was not found, or is not the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The email already has a pending invite in this Organization, or
            already belongs to one of its Members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_invite_already_pending
                  message: A pending invite already exists for this email. Revoke it before issuing a new one.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

    get:
      operationId: listInvites
      summary: List an Organization's MemberInvites
      description: >-
        Requires a session for a Member holding members:manage. Scoped to the
        caller's own session-bound Organization. Never includes token
        material.
      tags: [member]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invites listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInviteListResponse"
              example:
                invites:
                  - id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                    email: invitee@example.com
                    role: member
                    status: pending
                    inviter_member_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                    created_at: "2026-01-01T12:00:00Z"
                    expires_at: "2026-01-08T12:00:00Z"
                    accepted_at: null
                    revoked_at: null
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold members:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The organization was not found, or is not the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/invites/{invite_id}:
    delete:
      operationId: revokeInvite
      summary: Revoke a pending MemberInvite
      description: >-
        Requires a session for a Member holding members:manage. Marks a still
        pending invite revoked so it can never be accepted.


        An invite belonging to another Organization is rejected identically
        to an invite id that does not exist — the two cases are deliberately
        indistinguishable.
      tags: [member]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberInviteResponse"
              example:
                id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                email: invitee@example.com
                role: member
                status: revoked
                inviter_member_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                created_at: "2026-01-01T12:00:00Z"
                expires_at: "2026-01-08T12:00:00Z"
                accepted_at: null
                revoked_at: "2026-01-02T09:30:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold members:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No such invite in the caller's Organization — including an invite
            that belongs to a different one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_invite_not_found
                  message: Invite was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The invite is no longer pending (already accepted, already
            revoked, or past its expiry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_invite_not_pending
                  message: This invite is no longer pending and can no longer be revoked.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept a MemberInvite and provision the invited Member
      description: >-
        Unauthenticated by design: the invite token is itself the credential,
        the same posture as magic-link consumption, so no session or
        permission applies — the token-hash lookup is what proves
        authorization.


        Atomically consumes the invite — succeeding only once, even under
        concurrent attempts — and creates a Member in the inviting
        Organization with no automatic role. It issues no session; the new
        Member signs in afterward through their Organization's normal login
        path. Every rejection reason (unknown, expired, revoked, already
        accepted) is answered identically. Rate-limited per client IP.
      tags: [member]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite accepted and Member provisioned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResponse"
              example:
                member_id: 018f2f3a-e000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                email: invitee@example.com
        "400":
          description: No token was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_validation_error
                  message: token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: >-
            The invite is invalid, expired, revoked or has already been used.
            The four cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_invite_invalid
                  message: This invite link is invalid, expired, revoked or has already been used.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/identity-provider:
    put:
      operationId: configureIdentityProvider
      summary: Configure an Organization's OIDC identity provider
      description: >-
        Development-foundation endpoint, unauthenticated until a further
        change gates operator endpoints behind a real session — this
        endpoint necessarily bootstraps the authentication mechanism
        itself. An Organization owns at most one IdentityProvider;
        configuring again replaces the existing one. The client secret is
        never returned in the response.
      tags: [identity-provider]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureIdentityProviderRequest"
            example:
              issuer: https://idp.example.com
              client_id: growth-ops
              client_secret: super-secret-value
              redirect_uri: https://api.example.com/v1/auth/callback
      responses:
        "200":
          description: Identity provider configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
              example:
                id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                issuer: https://idp.example.com
                client_id: growth-ops
                redirect_uri: https://api.example.com/v1/auth/callback
                status: active
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: Validation error, malformed JSON body, or an issuer that does not serve valid OIDC discovery metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_validation_error
                  message: "member: issuer is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: The organization was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: organization_not_found
                  message: Organization was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/login:
    get:
      operationId: initiateLogin
      summary: Start an OIDC login for an Organization
      description: >-
        Redirects the browser to the Organization's configured identity
        provider, embedding a fresh state and nonce tracked as a
        LoginAttempt.


        The response also issues a short-lived, `HttpOnly` browser-binding
        cookie scoped to `/v1/auth/callback`. The callback requires it, so a
        client that completes the flow must carry cookies through the
        redirect chain; a callback presented without the matching value is
        refused before any authorization code is exchanged.
      tags: [identity-provider]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider's authorization endpoint.
          headers:
            Set-Cookie:
              description: >-
                `growth_ops_login_binding=<secret>;
                Path=/v1/auth/callback; Max-Age=600; HttpOnly; SameSite=Lax`,
                plus `Secure` outside development. Only its digest is stored
                with the LoginAttempt; the callback requires the value back.
              schema:
                type: string
        "404":
          description: No active identity provider is configured for this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: identity_provider_not_configured
                  message: No identity provider is configured for this organization.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/auth/social/google:
    get:
      operationId: initiateSocialLogin
      summary: Start a platform-level Google login
      description: >-
        Redirects the browser to Google's OAuth authorization endpoint. This
        is the entry point for every self-serve signup, so it takes no
        `organization_id` — unlike `/v1/organizations/{organization_id}/login`,
        social login exists precisely to start a login before any
        Organization is known.


        The response also issues a short-lived, `HttpOnly` browser-binding
        cookie scoped to `/v1/auth/social/google/callback`; the callback
        requires it back before exchanging any authorization code.
      tags: [identity-provider]
      responses:
        "302":
          description: Redirect to Google's authorization endpoint.
          headers:
            Set-Cookie:
              description: >-
                `growth_ops_social_login_binding=<secret>;
                Path=/v1/auth/social/google/callback; Max-Age=600; HttpOnly;
                SameSite=Lax`, plus `Secure` outside development.
              schema:
                type: string
        "404":
          description: No platform Google OAuth client is configured for this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: social_login_not_configured
                  message: Google social login is not configured for this deployment.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/auth/social/google/callback:
    get:
      operationId: completeSocialLogin
      summary: Complete a platform-level Google login
      description: >-
        Verifies the callback's state against its tracked attempt, exchanges
        the authorization code, and resolves or just-in-time provisions the
        authenticated Member — auto-provisioning a new Organization,
        Project and Environment when the Google identity is unknown to the
        platform.


        The `growth_ops_social_login_binding` cookie issued at
        `/v1/auth/social/google` is REQUIRED and is verified before the
        authorization code is exchanged. It is single-use and is cleared by
        this response either way.


        The response shape is negotiated by the request's Accept header,
        identically to `/v1/auth/callback`: a browser receives the session
        as an `HttpOnly`, `SameSite=Lax` cookie and a redirect; every other
        caller receives the 200 JSON body, the only place the plaintext
        session token is ever returned.
      tags: [identity-provider]
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: >-
            An Accept value preferring `text/html` selects the browser
            response (cookie + redirect) instead of the JSON body.
          schema:
            type: string
        - name: growth_ops_social_login_binding
          in: cookie
          required: true
          description: >-
            The browser-binding secret issued when the login was started. A
            callback that does not present it is refused before any
            authorization code is exchanged.
          schema:
            type: string
      responses:
        "302":
          description: >-
            Login completed for a browser. The session is set as an HttpOnly
            cookie and the browser is redirected into the console — either
            "/projects", or "/welcome" with the auto-provisioned Project and
            Environment ids when this was a brand-new self-service signup.
          headers:
            Location:
              description: The console landing path.
              schema:
                type: string
            Set-Cookie:
              description: >-
                `growth_ops_session=<token>; Path=/; HttpOnly; SameSite=Lax`,
                plus `Secure` outside development and `Domain` when
                configured.
              schema:
                type: string
        "200":
          description: Login completed for a non-browser caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteLoginResponse"
              example:
                member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                email: person@example.com
                session_token: sess_018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f.7f3a9c1b2e4d6a8f0c1b3d5e7f9a1c3e
                expires_at: "2026-01-02T12:00:00Z"
        "401":
          description: The callback is invalid, expired, or was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: callback_invalid
                  message: The login callback is invalid or has expired.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: No platform Google OAuth client is configured for this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: social_login_not_configured
                  message: Google social login is not configured for this deployment.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The Google identity's email already belongs to a different
            Member — either another Organization entirely, or an unverified
            Google email colliding with an existing account — so no session
            was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: social_email_already_taken
                  message: This email already belongs to another account. Verify your Google email or sign in through your organization instead.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/auth/callback:
    get:
      operationId: completeLogin
      summary: Complete an OIDC login
      description: >-
        Verifies the callback's state, nonce and ID token signature against
        its tracked LoginAttempt, resolves or just-in-time provisions the
        authenticated Member, and issues a Session.


        The `growth_ops_login_binding` cookie issued when the login was
        started is REQUIRED and is verified before the authorization code is
        exchanged: a callback presented by any other user agent — or with no
        such cookie — is refused with 401 and establishes no session. The
        cookie is single-use and is cleared by this response either way.


        The response shape is negotiated by the request's Accept header. A
        request preferring `text/html` — that is, a browser — receives the
        session as an `HttpOnly`, `SameSite=Lax` cookie (`Secure` outside
        development) and a 302 redirect to the configured web app; the token
        never appears in the redirect target or the body. Every other caller,
        including one sending no Accept header at all, receives the 200 JSON
        response below.


        The 200 body is the ONLY place the plaintext session token is ever
        returned — it cannot be retrieved again afterward. No failure path
        sets a session cookie.
      tags: [identity-provider]
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: >-
            An Accept value preferring `text/html` selects the browser
            response (cookie + redirect) instead of the JSON body.
          schema:
            type: string
        - name: growth_ops_login_binding
          in: cookie
          required: true
          description: >-
            The browser-binding secret issued when the login was started. A
            callback that does not present it is refused before any
            authorization code is exchanged.
          schema:
            type: string
      responses:
        "302":
          description: >-
            Login completed for a browser. The session is set as an HttpOnly
            cookie and the browser is redirected to the web app.
          headers:
            Location:
              description: The configured web app base URL.
              schema:
                type: string
            Set-Cookie:
              description: >-
                `growth_ops_session=<token>; Path=/; HttpOnly; SameSite=Lax`,
                plus `Secure` outside development and `Domain` when
                configured.
              schema:
                type: string
        "200":
          description: Login completed for a non-browser caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteLoginResponse"
              example:
                member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                email: person@example.com
                session_token: sess_018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f.7f3a9c1b2e4d6a8f0c1b3d5e7f9a1c3e
                expires_at: "2026-01-02T12:00:00Z"
        "401":
          description: The callback is invalid, expired, or was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: callback_invalid
                  message: The login callback is invalid or has expired.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The authenticated identity has no Member yet and the organization
            has no available seat, so just-in-time provisioning was refused
            and no Member was created. Reported distinctly from the 401 above
            because the login is retryable once a seat is freed or the plan is
            upgraded. An already-provisioned Member signing in again is
            unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: seat_limit_exceeded
                  message: This organization has no available seats. Free up a seat or upgrade the plan, then try again.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/auth/magic-link:
    post:
      operationId: requestMagicLink
      summary: Request a magic-link login email
      description: >-
        Emails a single-use, 15-minute login link to an existing Member's
        address. It never provisions a new Organization or Member: an email
        matching no Member is a silent no-op.


        The response is deliberately identical whether or not the email
        matches an existing Member, so this endpoint cannot be used to
        enumerate accounts. Rate-limited both per client IP and,
        independently, per recipient email address.
      tags: [identity-provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestMagicLinkRequest"
            example:
              email: person@example.com
      responses:
        "200":
          description: >-
            Always returned, whether or not the email matches an existing
            Member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestMagicLinkResponse"
              example:
                message: If that email is registered, a login link has been sent.
        "429":
          description: Rate limit exceeded (per IP or per recipient email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/auth/magic-link/{token}:
    get:
      operationId: peekMagicLink
      summary: Check whether a magic-link token is still valid
      description: >-
        Read-only: reports whether token exists, is unexpired and unused,
        WITHOUT consuming it or creating a session. Safe to call repeatedly,
        including by an automated corporate email-security link scanner
        that prefetches the emailed link before a human clicks it — the
        confirmation page calls this to decide what to render, then calls
        the confirm endpoint below only on an explicit user action.
      tags: [identity-provider]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Always 200; validity is reported in the body, not the status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeekMagicLinkResponse"
              example:
                valid: true

  /v1/auth/magic-link/{token}/confirm:
    post:
      operationId: confirmMagicLink
      summary: Consume a magic-link token and issue a session
      description: >-
        Atomically consumes token — succeeding only once, even under
        concurrent attempts — and issues a Session for the Member it
        resolves to. Rejected if the token is unknown, expired,
        already used, or resolves to a disabled Member.


        Session delivery follows the same Accept-header negotiation as
        `/v1/auth/callback`: a browser gets an `HttpOnly`, `SameSite=Lax`
        cookie plus a 302 redirect to the web app; every other caller gets
        the plaintext token once in the 200 JSON body. No failure path sets
        a session cookie.
      tags: [identity-provider]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: >-
            An Accept value preferring `text/html` selects the browser
            response (cookie + redirect) instead of the JSON body.
          schema:
            type: string
      responses:
        "302":
          description: >-
            Login completed for a browser. The session is set as an HttpOnly
            cookie and the browser is redirected to the web app.
          headers:
            Location:
              description: The configured web app base URL.
              schema:
                type: string
            Set-Cookie:
              description: >-
                `growth_ops_session=<token>; Path=/; HttpOnly; SameSite=Lax`,
                plus `Secure` outside development and `Domain` when
                configured.
              schema:
                type: string
        "200":
          description: Login completed for a non-browser caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteLoginResponse"
              example:
                member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                email: person@example.com
                session_token: sess_018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f.7f3a9c1b2e4d6a8f0c1b3d5e7f9a1c3e
                expires_at: "2026-01-02T12:00:00Z"
        "401":
          description: >-
            The token is invalid, expired, already used, or resolves to a
            disabled Member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: magic_link_invalid
                  message: This login link is invalid, expired or has already been used.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/magic-link:
    post:
      operationId: requestStaffMagicLink
      summary: Request a platform-staff magic-link login email
      description: >-
        Emails a single-use, 15-minute login link to an existing, active
        StaffMember's address. It never creates a StaffMember: an email
        matching no StaffMember — or matching a disabled one — is a silent
        no-op.


        The response is deliberately identical in every case, so this
        endpoint cannot be used to enumerate platform staff. Rate-limited
        both per client IP and, independently, per recipient email address.


        A StaffMember is NOT scoped to any Organization and is a distinct
        identity from a Member, even when the same address also holds a
        Member account somewhere. This endpoint therefore has nothing to do
        with `/v1/auth/magic-link`, and the two issue different, mutually
        unusable credentials.
      tags: [platform-staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestStaffMagicLinkRequest"
            example:
              email: ops@rollfuse.example
      responses:
        "200":
          description: >-
            Always returned, whether or not the email matches an active
            StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStaffMagicLinkResponse"
              example:
                message: If that email belongs to platform staff, a login link has been sent.
        "429":
          description: Rate limit exceeded (per IP or per recipient email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/magic-link/{token}:
    get:
      operationId: peekStaffMagicLink
      summary: Check whether a staff magic-link token is still valid
      description: >-
        Read-only: reports whether token exists, is unexpired and unused,
        WITHOUT consuming it or creating a StaffSession. Safe to call
        repeatedly, including by an automated corporate email-security link
        scanner that prefetches the emailed link before a human clicks it.


        It reports validity only, and never names the StaffMember the token
        belongs to: a leaked link must not disclose who a staff user is.
      tags: [platform-staff]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Returned whether or not the token is usable: an unknown,
            expired or already-used token is reported as `valid: false`
            rather than as an error status, so this endpoint discloses
            nothing beyond usability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeekStaffMagicLinkResponse"
              example:
                valid: true
        "429":
          description: Rate limit exceeded (per IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: Too many requests. Please try again later.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/magic-link/{token}/confirm:
    post:
      operationId: confirmStaffMagicLink
      summary: Consume a staff magic-link token and issue a StaffSession
      description: >-
        Atomically consumes token — succeeding only once, even under
        concurrent attempts — and issues a StaffSession for the StaffMember
        it resolves to. Rejected if the token is unknown, expired, already
        used, or resolves to a disabled StaffMember.


        A browser (an Accept value preferring `text/html`) gets an
        `HttpOnly`, `SameSite=Lax` cookie named `rf_staff_session` plus a
        302 redirect; every other caller gets the plaintext token once in
        the 200 JSON body. The cookie name is deliberately different from
        the Member session cookie's, so the two credentials can coexist on
        one host without either being mistaken for the other. No failure
        path sets a cookie.
      tags: [platform-staff]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: >-
            An Accept value preferring `text/html` selects the browser
            response (cookie + redirect) instead of the JSON body.
          schema:
            type: string
      responses:
        "302":
          description: >-
            Login completed for a browser. The StaffSession is set as an
            HttpOnly cookie and the browser is redirected to the web app.
          headers:
            Location:
              description: The configured web app base URL, plus `/staff`.
              schema:
                type: string
            Set-Cookie:
              description: >-
                `rf_staff_session=<token>; Path=/; HttpOnly; SameSite=Lax`,
                plus `Secure` outside development and `Domain` when
                configured.
              schema:
                type: string
        "200":
          description: Login completed for a non-browser caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmStaffMagicLinkResponse"
              example:
                staff_member:
                  id: 01930000-0000-7000-8000-00000000000a
                  email: ops@rollfuse.example
                  name: Ops
                  status: active
                  permissions: ["billing:refund"]
                session_token: stfs_01930000-0000-7000-8000-00000000000b.7f3a9c1b2e4d6a8f0c1b3d5e7f9a1c3e
                expires_at: "2026-01-02T12:00:00Z"
        "401":
          description: >-
            The token is invalid, expired, already used, or resolves to a
            disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_magic_link_invalid
                  message: This login link is invalid, expired or has already been used.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/session:
    get:
      operationId: currentStaffSession
      summary: Read the signed-in platform-staff identity
      description: >-
        Returns the StaffMember behind the presented StaffSession and the
        staff permissions they hold. It requires a valid StaffSession but no
        particular permission: reading your own identity must work for a
        StaffMember holding no grant at all.


        The credential is read from `Authorization: Bearer <token>` or, for
        a browser, from the `rf_staff_session` cookie. A Member session
        token or the Member session cookie never satisfies it.


        The response carries no Organization (a StaffMember has none) and no
        token or hash field, so it cannot leak the credential it is looked
        up by.
      tags: [platform-staff]
      security:
        - staffSessionAuth: []
      responses:
        "200":
          description: The staff identity behind the presented StaffSession.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentStaffSessionResponse"
              example:
                staff_member:
                  id: 01930000-0000-7000-8000-00000000000a
                  email: ops@rollfuse.example
                  name: Ops
                  status: active
                  permissions: ["billing:refund"]
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_session_invalid
                  message: A valid staff session is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/session/logout:
    post:
      operationId: staffLogout
      summary: End the presented staff session
      description: >-
        Marks the presented StaffSession revoked server-side and clears the
        `rf_staff_session` cookie. Revocation is the point: a copy of the
        cookie taken before logout stops being accepted on the very next
        request, which clearing the cookie alone would not achieve.


        The credential is read from `Authorization: Bearer <token>` or, for
        a browser, from the `rf_staff_session` cookie. The cookie is cleared
        on every path that reaches a decision about the token, rejection
        included, so a browser holding a token the API refuses is not left
        bouncing between "cookie present" and "unauthorized".


        A request authenticated by the cookie rather than a bearer header
        must also carry an `Origin` header on the staff write allow-list; one
        that does not is answered `403 staff_origin_rejected`.
      tags: [platform-staff]
      security:
        - staffSessionAuth: []
      responses:
        "204":
          description: The session was revoked and the cookie cleared.
        "401":
          description: >-
            No staff credential was presented, or the presented one is
            invalid, expired or already revoked. The cookie is cleared in
            this case too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_session_invalid
                  message: A valid staff session is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: >-
            The request was authenticated by the staff cookie and carried no
            allowed Origin header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_origin_rejected
                  message: This request's origin is not allowed to perform staff writes.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/sessions/{staff_session_id}/revoke:
    post:
      operationId: revokeStaffSession
      summary: Revoke a named staff session
      description: >-
        Revokes a StaffSession believed to be compromised, without waiting
        for its absolute expiry. Every later request presenting it is
        refused.


        Requires a valid StaffSession, and revokes only a session belonging
        to the same StaffMember: a session id that does not exist and one
        belonging to another StaffMember are both answered `404` with the
        same body, so this route cannot be used to enumerate other staff
        members' sessions. Killing another StaffMember's session stays an
        out-of-band operation, like every other StaffMember administration
        action.


        Revoking an already revoked session succeeds: the caller's intent is
        already true.


        A request authenticated by the cookie rather than a bearer header
        must also carry an `Origin` header on the staff write allow-list.
      tags: [platform-staff]
      security:
        - staffSessionAuth: []
      parameters:
        - name: staff_session_id
          in: path
          required: true
          description: The StaffSession to revoke.
          schema:
            type: string
          example: 01930000-0000-7000-8000-00000000000b
      responses:
        "204":
          description: The session is revoked (or already was).
        "401":
          description: No valid StaffSession was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_session_invalid
                  message: A valid staff session is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: >-
            The request was authenticated by the staff cookie and carried no
            allowed Origin header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_origin_rejected
                  message: This request's origin is not allowed to perform staff writes.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: >-
            No such session belongs to the calling StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_session_not_found
                  message: No such staff session.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/organizations/{organization_id}/charges/{charge_id}:
    get:
      operationId: getStaffChargeRefundStatus
      summary: Read a one-off charge's refund status
      description: >-
        Returns an Organization's one-off charge with its amount, the amount
        refunded so far, and the remaining refundable balance — the numbers a
        staff operator needs before issuing a further refund, answered from
        the platform's own records without a gateway lookup.


        Requires a StaffSession holding `billing:refund`. A Member session
        never satisfies it, no matter which Organization-scoped permissions
        that Member holds: platform staff and an Organization's own members
        are separate identity systems.


        The charge must belong to the Organization named in the path. A
        charge that does not exist and one that exists under a different
        Organization are both answered `404` with the same body, so a
        mismatched pair cannot be used to probe which charges exist.


        `refunded_amount` reflects only refunds the payment gateway has
        confirmed by webhook, so it can briefly lag a refund requested moments
        ago — whether through this API or in the gateway's own dashboard.
      tags: [platform-staff]
      security:
        - staffSessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: charge_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The charge's refund status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffChargeResponse"
              example:
                charge:
                  id: 01930000-0000-7000-8000-0000000000c1
                  organization_id: 01930000-0000-7000-8000-000000000001
                  status: paid
                  amount: 10000
                  currency: BRL
                  refunded_amount: 4000
                  remaining_refundable_amount: 6000
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_session_invalid
                  message: A valid staff session is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The StaffMember does not hold `billing:refund`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_permission_denied
                  message: The staff member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: >-
            No such charge, or the charge belongs to a different
            Organization than the one named in the path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_not_found
                  message: Billing information was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/staff/organizations/{organization_id}/charges/{charge_id}/refunds:
    post:
      operationId: issueStaffChargeRefund
      summary: Request a refund of a one-off charge
      description: >-
        Asks the payment gateway to refund `amount` of an Organization's
        one-off charge, on behalf of platform staff, and records a
        `charge.refund_requested` audit event attributed to the requesting
        StaffMember.


        Requires a StaffSession holding `billing:refund` — deliberately not
        `billing:manage`, since an Organization refunding itself is not the
        intended control. The charge must belong to the Organization named in
        the path, exactly as for the read above.


        The response is `202`, not `200`: the gateway has accepted the
        request, but the charge's `refunded_amount` deliberately does not move
        until the gateway confirms the refund through its own webhook. The
        charge returned here therefore still shows the totals as they were,
        and a subsequent read reflects the refund once that confirmation
        lands. This mirrors the separation between creating a charge and
        confirming its payment.


        `amount` is validated against the charge's remaining refundable
        balance before the gateway is contacted. That check reads local state
        which can be stale relative to the gateway, so it is a fast rejection
        for the common case rather than the final word: the gateway enforces
        the real limit against its own records regardless.
      tags: [platform-staff]
      security:
        - staffSessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: charge_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRefundRequest"
            example:
              amount: 5000
      responses:
        "202":
          description: >-
            The gateway accepted the refund request. The returned charge's
            refunded total is unchanged until the gateway's webhook confirms
            it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffChargeResponse"
              example:
                charge:
                  id: 01930000-0000-7000-8000-0000000000c1
                  organization_id: 01930000-0000-7000-8000-000000000001
                  status: paid
                  amount: 10000
                  currency: BRL
                  refunded_amount: 4000
                  remaining_refundable_amount: 6000
        "400":
          description: The requested amount is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_validation_error
                  message: The refund amount must be a positive integer in the charge's currency.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_session_invalid
                  message: A valid staff session is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The StaffMember does not hold `billing:refund`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: staff_permission_denied
                  message: The staff member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: >-
            No such charge, or the charge belongs to a different
            Organization than the one named in the path. No gateway call is
            attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: billing_not_found
                  message: Billing information was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The requested amount exceeds the charge's remaining refundable
            balance (`refund_exceeds_remaining_balance`), or the charge never
            reached the payment gateway and so has nothing there to refund
            (`charge_not_refundable`). No gateway call is attempted in either
            case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: refund_exceeds_remaining_balance
                  message: The requested refund exceeds this charge's remaining refundable balance.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/sessions/logout:
    post:
      operationId: logout
      summary: Revoke the caller's session
      description: >-
        Revokes the Session identified by the presented bearer session
        token (logout). A revoked session cannot resolve any further
        request; the Member and prior audit evidence are unaffected.


        The response also clears the browser session cookie, on both the
        success and the rejection path — a token the API refuses is of no use
        to the browser either.
      tags: [identity-provider]
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Clears `growth_ops_session`.
              schema:
                type: string
        "401":
          description: The presented session token is missing, invalid, expired or already revoked.
          headers:
            Set-Cookie:
              description: Clears `growth_ops_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: The session is invalid, expired or revoked.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Read the signed-in Member's identity and roles
      description: >-
        Returns the Member the presented session resolves to, the
        Organization that session is bound to, and the roles the Member
        holds. The operator web app calls this on every authenticated render
        to display identity and decide which affordances to offer.


        Gated by a valid session only, with no permission requirement: every
        authenticated Member must be able to read their own identity,
        including one holding no role — the default state after just-in-time
        provisioning.


        Roles are returned rather than the expanded permission list: roles are
        the stable public vocabulary, while the role-to-permission mapping is
        an internal detail that grows additively.


        The response never contains the session token, its hash, or any
        identity-provider client secret.
      tags: [identity-provider]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The current session's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
              example:
                member:
                  id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                  email: person@example.com
                  name: Person
                organization:
                  id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                  name: Acme
                roles: [admin]
                terms:
                  current_version: 1.0.0
                  acceptance_required: false
        "401":
          description: >-
            The presented session token is missing, invalid, expired or
            revoked. The reason is not disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/sessions/current/terms-acceptance:
    post:
      operationId: acceptTerms
      summary: Record the caller's acceptance of the terms of service
      description: >-
        Records that the signed-in Member deliberately accepted the terms of
        service currently in force, together with the version and the
        instant. This is the only path that writes an acceptance: no
        Member-creating path records one on the person's behalf, because a
        record written by a code path is evidence of the code path and not of
        an act.


        Gated by a valid session only, with no permission requirement — a
        Member holding no role must be able to accept, since that is the
        default after just-in-time provisioning and they can reach nothing
        else until they have.


        The Member and the Organization both come from the resolved session.
        There is no member id in the body and none in the path, so this
        endpoint can only ever write the caller's own row.


        `terms_version` is compared against the version in force and the
        version in force is what gets recorded. A caller naming a different
        version is refused with `terms_version_mismatch` rather than
        recording what they asked for.
      tags: [identity-provider]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTermsRequest"
            example:
              terms_version: 1.0.0
      responses:
        "204":
          description: The acceptance was recorded.
        "400":
          description: The body was undecodable or named no version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_validation_error
                  message: "member: terms version is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: >-
            The presented session token is missing, invalid, expired or
            revoked, or the Member it resolves to has been disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The version named is not the one in force (`terms_version_mismatch`
            — reload and read the current document), or this deployment
            publishes no terms at all (`terms_acceptance_not_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: terms_version_mismatch
                  message: >-
                    The terms version you accepted is no longer the one in
                    force. Reload and read the current terms.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: List the Organization's audit trail
      description: >-
        Requires a session for a Member holding audit:read. Returns the
        recorded AuditEvents of the caller's own Organization, newest first,
        filtered by any combination of event_type, subject_type, subject_id,
        actor_type, actor_id and an inclusive occurred-at window
        (occurred_after/occurred_before, RFC3339). The Organization is always
        taken from the session — any organization_id supplied by the caller
        is ignored. Results are paginated with limit/offset; the response
        echoes the pagination actually applied (the default limit kicks in
        when none is supplied).
      tags: [audit]
      security:
        - sessionAuth: []
      parameters:
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: subject_type
          in: query
          required: false
          schema:
            type: string
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
        - name: actor_type
          in: query
          required: false
          description: Matches AuditEventActor.type exactly (member, staff, system or gateway).
          schema:
            type: string
            enum: [member, staff, system, gateway]
        - name: actor_id
          in: query
          required: false
          description: Matches the acting Member's or StaffMember's id exactly.
          schema:
            type: string
        - name: occurred_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: occurred_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The filtered, paginated audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
              example:
                audit_events:
                  - id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                    organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                    event_type: role.granted
                    subject_type: member
                    subject_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                    payload:
                      role: admin
                    actor:
                      type: member
                      id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                    predates_actor_capture: false
                    created_at: "2026-01-01T12:00:00Z"
                limit: 100
                offset: 0
                has_more: false
        "400":
          description: >-
            An invalid filter (inverted occurred-at window, malformed
            timestamp) or invalid pagination (non-integer or negative
            limit/offset).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: audit_validation_error
                  message: "audit: occurred_after must not be later than occurred_before"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold audit:read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/audit-events/export:
    get:
      operationId: exportAuditEvents
      summary: Export the Organization's audit trail
      description: >-
        Requires a session for a Member holding audit:read. Returns the same
        Organization-scoped, filtered set of AuditEvents as GET
        /v1/audit-events — honoring the same event_type, subject_type,
        subject_id, actor_type, actor_id and occurred-at filters — but as a
        single downloadable document without the listing's pagination limit.
        The format query parameter selects csv (the default) or json. In
        CSV, the payload column holds the event's JSON document as a quoted
        field, which consumers must parse as JSON, and the actor_type/actor_id
        columns are both empty for an event recorded without an actor.
      tags: [audit]
      security:
        - sessionAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: subject_type
          in: query
          required: false
          schema:
            type: string
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
        - name: actor_type
          in: query
          required: false
          schema:
            type: string
            enum: [member, staff, system, gateway]
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
        - name: occurred_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: occurred_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The filtered audit trail as a downloadable document.
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,organization_id,event_type,subject_type,subject_id,actor_type,actor_id,predates_actor_capture,created_at,payload
                018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f,018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f,role.granted,member,018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f,member,018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f,false,2026-01-01T12:00:00Z,"{""role"":""admin""}"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "400":
          description: An unknown export format, an invalid filter, or a malformed timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: audit_validation_error
                  message: "format must be one of: csv, json."
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold audit:read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/roles:
    get:
      operationId: listRoleCatalog
      summary: List every recognized Role and the Permissions it grants
      description: >-
        Requires a session for a Member holding roles:manage. The catalog
        is fixed and identical for every caller — per rbac's "A Role's
        Permissions Are Discoverable" requirement, so an administrator can
        be shown what a role permits before assigning it.
      tags: [rbac]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Every recognized role with its permission set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleCatalogEntry"
              example:
                - role: member
                  permissions: [audit:read, segments:read, feature-flags:read]
                - role: admin
                  permissions: [roles:manage, audit:read, segments:manage]
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/members/{member_id}/roles:
    post:
      operationId: grantRole
      summary: Grant a Role to a Member
      description: >-
        Requires a session for a Member holding roles:manage. Granting a
        Role a Member already holds is rejected as a conflict. Granting
        "member" takes effect immediately. Granting "admin" instead raises
        a pending ApprovalRequest — see POST
        /v1/approval-requests/{approval_request_id}/approve — that a
        second, different Member holding roles:manage must approve before
        the RoleAssignment is created.
      tags: [rbac]
      security:
        - sessionAuth: []
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRoleRequest"
            example:
              role: admin
      responses:
        "201":
          description: >-
            Role granted immediately ("member"), or an admin grant approval
            requested ("admin").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantRoleResponse"
              examples:
                granted:
                  summary: Granting "member" takes effect immediately.
                  value:
                    status: granted
                    role_assignment:
                      id: 018f2f3a-e000-7000-9c3a-1f2b3c4d5e6f
                      organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                      member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                      role: member
                      status: active
                      created_at: "2026-01-01T12:00:00Z"
                pending_approval:
                  summary: Granting "admin" raises a pending ApprovalRequest instead.
                  value:
                    status: pending_approval
                    approval_request_id: 018f2f3a-f000-7000-9c3a-1f2b3c4d5e6f
        "400":
          description: Validation error, malformed JSON body, or an unrecognized role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rbac_validation_error
                  message: "rbac: role is not recognized"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: The member was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: member_not_found
                  message: Member was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The member already holds this role, or (for "admin") a pending
            approval request already exists for this member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                role_already_granted:
                  value:
                    error:
                      code: role_already_granted
                      message: Member already holds this role.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                approval_already_pending:
                  value:
                    error:
                      code: approval_already_pending
                      message: A pending approval request already exists for this member.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listRoles
      summary: List a Member's granted roles
      description: >-
        Requires a session for a Member holding roles:manage. Returns only
        currently active RoleAssignments.
      tags: [rbac]
      security:
        - sessionAuth: []
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active role assignments for the member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignment"
              example:
                - id: 018f2f3a-e000-7000-9c3a-1f2b3c4d5e6f
                  organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                  member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                  role: admin
                  status: active
                  created_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/members/{member_id}/roles/{role}:
    delete:
      operationId: revokeRole
      summary: Revoke a Member's Role
      description: >-
        Requires a session for a Member holding roles:manage. Revoking a
