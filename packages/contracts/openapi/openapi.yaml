        hypothesis:
          type: string
          description: Non-empty documented hypothesis being tested.

    ConcludeExperimentRequest:
      type: object
      required: [conclusion]
      properties:
        conclusion:
          type: string
          description: Non-empty documented conclusion.
        winning_variation_id:
          type: string
          description: >-
            Optional. Must be one of the Experiment's own compared
