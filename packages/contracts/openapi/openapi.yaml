          type: string

    RenameMetricDefinitionRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000

    MetricDefinition:
      type: object
      required:
        [id, project_id, name, description, key, aggregation_type, unit, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        key:
          type: string
        aggregation_type:
          type: string
          enum: [count, sum, average, rate]
        unit:
          type: string
        archived_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the metric definition was archived, or null when it is
            active. Archiving is a soft state: it stops being offered for
            new use, but every existing Guardrail, Connector or
            Observation referencing it continues to resolve.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MetricDefinitionList:
      type: object
      required: [metric_definitions]
      properties:
        metric_definitions:
          type: array
          items:
            $ref: "#/components/schemas/MetricDefinition"

    ObservationRequest:
      type: object
      required: [value, occurred_at]
      properties:
        value:
          type: number
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        subject_key:
          type: string
          description: >-
            Optional identifier of who or what generated this observation.
            Required for the observation to be assignable to a Variation
            during experiment outcome analysis.

    IngestObservationsRequest:
      type: object
      required: [observations]
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationRequest"

    IngestObservationsResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer

    Observation:
      type: object
      required:
        [id, metric_definition_id, environment_id, value, occurred_at, correlation_id, subject_key]
      properties:
        id:
          type: string
        metric_definition_id:
          type: string
        environment_id:
          type: string
        value:
          type: number
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        subject_key:
          type: string

    ObservationList:
      type: object
      required: [observations]
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/Observation"
        has_more:
          type: boolean
          description: >-
            Whether more Observations exist beyond this page. Set by
            GET /v1/environments/{environment_id}/metric-definitions/{metric_definition_id}/observations
            and GET /v1/environments/{environment_id}/observations; absent
            from GET /v1/experiments/{experiment_id}/observations.

    RecordAcquisitionContextRequest:
      type: object
      required: [subject_key, occurred_at]
