                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: New Checkout Flow
                description: Rolls out the redesigned checkout flow.
                key: new-checkout-flow
                variations:
                  - id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                    key: "on"
