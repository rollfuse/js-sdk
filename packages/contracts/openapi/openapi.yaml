    CreateOrganizationRequest:
      type: object
      required: [name, slug, region]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        region:
          description: >-
            The declared data-residency region. The accepted set is the set
            of regions this deployment actually serves, taken from its
            `SERVED_REGIONS` configuration — not from this enumeration,
            which mirrors it. This deployment serves `us` only: every byte
            is stored in one Amazon Web Services United States region. A
            recognized region it does not serve (for example `eu`) is
            refused with `organization_region_not_served` rather than
            accepted and quietly stored elsewhere.
          type: string
          enum: [us]

    Organization:
      type: object
      required: [id, name, slug, region, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        region:
          description: >-
            The data-residency region this Organization declared when it was
            created. It is immutable. The set accepted at creation is
            narrower than the set readable here: an Organization created
            before a region was withdrawn still carries it, and those are
            listed for reconciliation at
            `GET /v1/staff/organizations/unserved-regions`. A region here is
            a declared and audited commitment, not one enforced by separate
            regional infrastructure — this deployment stores all data in one
            Amazon Web Services United States region.
          type: string
          enum: [us, eu]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UnservedRegionOrganizationsResponse:
      description: >-
        One page of Organizations declaring a data-residency region this
        deployment does not serve, for operator reconciliation.
      type: object
      required: [organizations, total, limit, offset, served_regions]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        total:
          description: >-
            The number of matching Organizations across the whole table, not
            just this page, so a capped page discloses what it left behind.
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        served_regions:
          description: >-
            The regions this deployment actually serves, which is what
            membership of this listing was measured against.
          type: array
          items:
            type: string

    CreateOrganizationResponse:
      description: >-
        An Organization plus its single-use identity-provider bootstrap
        credential, returned in plaintext exactly once and never
        retrievable again.
      type: object
      required: [id, name, slug, region, created_at, updated_at, identity_provider_bootstrap_token]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        region:
          description: >-
            The data-residency region assigned to the new Organization. See
            the `Organization` schema's own `region` for what the commitment
            means and where the data actually lives.
          type: string
          enum: [us]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        identity_provider_bootstrap_token:
          type: string
          description: >-
            Single-use, 30-minute credential authorizing exactly one call
            to PUT /v1/organizations/{organization_id}/identity-provider
            before the Organization has any Member.

