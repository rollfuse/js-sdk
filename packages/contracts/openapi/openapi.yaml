                error:
                  code: metric_definition_validation_error
                  message: "metric definition: aggregation type is not recognized"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold metrics:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The owning project was not found, or belongs to another
