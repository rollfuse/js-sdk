              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/support/attachments/presign:
    post:
      operationId: presignSupportAttachment
      summary: Presign a direct-to-storage upload for a ticket/feedback attachment
      description: >-
        Requires a valid Member session. Exactly one of ticket_id or
        message_id must be set — an attachment on the original submission
        targets the ticket directly, one added on a later reply targets
        that reply's message. Either way, the owning ticket must belong to
        the caller's own Organization, rejected identically to an unknown
        id otherwise. Accepts only image/jpeg and image/png, and at most
        10 attachments per ticket/message; the COMBINED declared size of
        every attachment on that ticket/message (this one plus whatever
        is already persisted against it) must not exceed 20MB — not 20MB
        per file. The object key is namespaced by organization_id and a
        server-generated id, never derived from client input. Does not
        itself persist an attachment — see POST .../attachments/{id}/confirm.
      tags: [support]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignSupportAttachmentRequest"
      responses:
        "201":
          description: Presigned upload issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignSupportAttachmentResponse"
        "400":
          description: >-
            Validation error (neither or both of ticket_id/message_id
            set, declared content type outside image/jpeg or image/png,
            or declared size that would push the ticket/message's
            combined attachment total over 20MB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The owning ticket was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The owning ticket/message already has 10 attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: support_attachment_limit_exceeded
                  message: "support attachment: at most 10 attachments are allowed per submission"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/support/attachments/{support_attachment_id}/confirm:
    post:
      operationId: confirmSupportAttachment
      summary: Confirm an uploaded attachment after the client's direct PUT
      description: >-
        Requires a valid Member session. Called after the client has PUT
        the object's bytes to the URL returned by the presign endpoint.
        The upload recorded at presign time is resolved first: an
        attachment_id that was never issued, was issued to another
        Organization, or was already confirmed is refused with the same
        404 in every case, before any storage object is read or deleted.
        The object key is then derived from that record — the request body
        carries no object key, and one sent anyway is rejected as an
        unknown field. Fetches the object back and validates its actual
        content — JPG/JPEG/PNG only, inspected from the real bytes, never
        only the client-declared content type or extension — deleting the
        object at the derived key and rejecting the confirmation on a
        mismatch, oversized object, or limit already reached at
        confirmation time. Only on success is a SupportAttachment
        persisted.
      tags: [support]
      security:
        - sessionAuth: []
      parameters:
        - name: support_attachment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSupportAttachmentRequest"
      responses:
        "201":
          description: Attachment confirmed and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAttachment"
        "400":
          description: >-
            The request body carries a field this contract does not
            declare — including object_key, which was removed: the server
            derives the object key and accepts none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            No upload was issued under this attachment_id, it was issued
            to another Organization, it was already confirmed, or the
            owning ticket/message was not found — one response for all
            four.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The owning ticket/message already has 10 attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >-
            The object's actual content is not a valid JPEG or PNG image,
            or its size would push the owning ticket/message's combined
            attachment total over 20MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: support_attachment_invalid_content
                  message: "support attachment: content is not a valid JPEG or PNG image"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/support/attachments/{support_attachment_id}/download:
    get:
      operationId: downloadSupportAttachment
      summary: Get a time-limited download URL for an attachment
      description: >-
        Requires a valid Member session. Scoped identically to the
        attachment's owning ticket (directly, or via the owning ticket of
        a message-scoped attachment) — an attachment belonging to another
        Organization is rejected identically to an unknown one.
      tags: [support]
