  /v1/rollouts/{rollout_id}/abort:
    post:
      operationId: abortRollout
      summary: Abort a scheduled or active Rollout
      description: >-
        Requires a session for a Member holding rollouts:manage.
        Transitions the Rollout to aborted and reverts the owning
        EnvironmentFlagConfig to serving only its default Variation
        (100%), releasing the configuration for manual upserts again. A
        Rollout whose owning EnvironmentFlagConfig belongs to another
        Organization is rejected identically to one no longer valid for
        this transition.
      tags: [rollout-scheduling]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rollout aborted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold rollouts:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Rollout was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_not_found
                  message: Rollout was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The Rollout is already completed or aborted, or belongs to
            another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_invalid_transition
                  message: "rollout: invalid lifecycle transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/rollouts/{rollout_id}/pause:
    post:
      operationId: pauseRollout
      summary: Pause a scheduled or active Rollout
      description: >-
        Requires a session for a Member holding rollouts:manage.
        Transitions the Rollout to paused, attributed to the operator. A
        paused Rollout retains ownership of its EnvironmentFlagConfig
        (still blocking manual Rule upserts) but no Stage advances —
        neither on schedule nor by early promotion — until it is resumed.
        An operator-initiated pause never resumes automatically; only an
        explicit call to resume changes it back. A Rollout whose owning
        EnvironmentFlagConfig belongs to another Organization is rejected
        identically to one no longer valid for this transition.
      tags: [rollout-pause-resume]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rollout paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold rollouts:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Rollout was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_not_found
                  message: Rollout was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The Rollout is already paused, completed, or aborted, or
            belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_invalid_transition
                  message: "rollout: invalid lifecycle transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/rollouts/{rollout_id}/resume:
    post:
      operationId: resumeRollout
      summary: Resume a paused Rollout
      description: >-
        Requires a session for a Member holding rollouts:manage.
        Transitions a paused Rollout back to active; its Stages become
        eligible for scheduled activation or early promotion again. A
        Rollout whose owning EnvironmentFlagConfig belongs to another
        Organization is rejected identically to one no longer valid for
        this transition.
      tags: [rollout-pause-resume]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rollout resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold rollouts:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Rollout was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_not_found
                  message: Rollout was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The Rollout is not currently paused, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rollout_invalid_transition
                  message: "rollout: invalid lifecycle transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/rollouts/{rollout_id}/guardrails:
    post:
      operationId: createGuardrail
      summary: Create a Guardrail for a Rollout
      description: >-
        Requires a session for a Member holding guardrails:manage. The
        Rollout must be scheduled or active, and the referenced
        MetricDefinition must belong to the same Project as the Rollout's
        EnvironmentFlagConfig. A Rollout outside the caller's own
        Organization is rejected identically to an unknown one.
      tags: [guardrail-auto-rollback]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuardrailRequest"
            example:
              metric_definition_id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
              comparison_operator: gt
              threshold: 0.05
              evaluation_window_seconds: 300
      responses:
        "201":
          description: Guardrail created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrail"
