  /v1/experiments/{experiment_id}/sample-ratio-mismatch:
    get:
      operationId: checkExperimentSampleRatioMismatch
      summary: Check an Experiment for a Sample Ratio Mismatch
      description: >-
        Requires a session for a Member holding experiments:manage.
        Computes, on demand, a Sample Ratio Mismatch (SRM) check
        comparing each of the Experiment's compared Variations' distinct
        attributed-subject count (from attributed ExposureEvents)
        against an equal-split expectation, using a chi-squared
        goodness-of-fit test with a fixed significance threshold of
        p < 0.001. Not persisted or scheduled: every call recomputes
        from current attributed data. When any compared Variation has
        zero distinct attributed subjects, the response reports
        `insufficient_data: true` with no computed statistic/p-value,
        rather than a spurious mismatch. This check is purely advisory:
        it never alters the Experiment's lifecycle state or conclusion.
        An Experiment whose owning Project belongs to another
        Organization is rejected identically to an unknown Experiment
        id.
      tags: [experiment-sample-ratio-analysis]
      security:
        - sessionAuth: []
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sample Ratio Mismatch check computed from the Experiment's current attributed data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleRatioMismatchResult"
              examples:
                balanced:
                  summary: A balanced split reports no mismatch.
                  value:
                    insufficient_data: false
                    variations:
                      - variation_key: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                        observed_count: 500
                      - variation_key: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                        observed_count: 498
                    statistic: 0.004016
                    p_value: 0.949478
                    mismatch_detected: false
                insufficient_data:
                  summary: A zero-count Variation reports insufficient_data.
                  value:
                    insufficient_data: true
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold experiments:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Experiment was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: experiment_not_found
                  message: Experiment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/experiments/{experiment_id}/outcome-analysis:
    get:
      operationId: analyzeExperimentOutcome
      summary: Compare a MetricDefinition's outcome between an Experiment's compared Variations
      description: >-
        Requires a session for a Member holding experiments:manage.
        Computes, on demand, a statistical comparison of a
        MetricDefinition's outcome between the Experiment's compared
        Variations, using subject-level last-touch assignment derived
        from ExposureEvents and Observations already attributed to the
        Experiment. Requires the Experiment to be `running` or
        `concluded`. Not persisted or scheduled: every call recomputes from
        current attributed data. Observations require a subject_key (set at
        ingestion time) to be assignable; unassignable and contaminated
        subjects are excluded and counted separately. With more than two
        compared Variations, every non-first compared Variation is compared
        against the first-listed (baseline) Variation only, with no
        multiple-comparison correction, disclosed via
        multiple_comparison_correction_applied. This check is purely
        advisory: it never alters the Experiment's lifecycle state or
        conclusion. An Experiment or MetricDefinition outside the
        caller's own Organization is rejected identically to an unknown
        one.
      tags: [experiment-outcome-analysis]
      security:
        - sessionAuth: []
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
        - name: metric_definition_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Outcome analysis computed from the Experiment's current attributed data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeAnalysisResult"
        "400":
          description: metric_definition_id was missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold experiments:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Experiment or MetricDefinition was not found, or belongs to
            another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            The Experiment is not running or concluded, or a compared
            Variation pair has fewer than 2 assigned subjects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/experiments/{experiment_id}/acquisition-attribution:
    get:
      operationId: attributeAcquisitionChannels
      summary: Breakdown of an Experiment's attributed subjects by compared Variation and acquisition channel
      description: >-
        Requires a session for a Member holding experiments:manage.
        Computes, on demand, the distinct attributed-subject count per
        (compared Variation, acquisition channel) pair, where a channel
        is a subject's utm_source/utm_medium/utm_campaign triple from
        AcquisitionContext. A subject's channel is resolved by direct
        AcquisitionContext match, then a single IdentityLink hop forward
        (the subject key is a known alias), then a single IdentityLink
        hop in reverse (the subject key is itself a canonical key with a
        known alias); resolution never chains past that single hop. A
        subject with no resolvable AcquisitionContext is reported in an
        explicit unresolved bucket (resolved: false), distinct from a
        resolved AcquisitionContext whose UTM fields happen to be blank.
        Requires the Experiment to be `running` or `concluded`. Purely
        descriptive: not a statistical comparison. A subject with
        ExposureEvents matching more than one compared Variation is
        counted in each Variation's bucket, uncorrected. An Experiment
        whose owning Project belongs to another Organization is
        rejected identically to an unknown Experiment id.
      tags: [acquisition-attribution]
      security:
        - sessionAuth: []
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acquisition-channel breakdown computed from the Experiment's current attributed data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionAttributionResult"
              example:
                buckets:
                  - variation_key: "on"
                    utm_source: google
                    utm_medium: cpc
                    utm_campaign: spring-sale
                    resolved: true
                    subject_count: 42
                  - variation_key: "on"
                    utm_source: ""
                    utm_medium: ""
                    utm_campaign: ""
                    resolved: false
                    subject_count: 5
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold experiments:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Experiment was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The Experiment is not running or concluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: experiment_invalid_request
                  message: "experiment: acquisition attribution requires a running or concluded experiment"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/environments/{environment_id}/credentials:
    post:
      operationId: issueCredential
      summary: Issue a service credential for an environment
      description: >-
        Requires a session for a Member holding credentials:manage. The
        response is the ONLY place the plaintext token is ever returned —
        it cannot be retrieved again afterward. An environment outside the
        caller's own Organization is rejected identically to an unknown
        one.
      tags: [credentials]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCredentialRequest"
            example:
              scopes: [config:read]
      responses:
        "201":
          description: Credential issued. token is shown here once and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
              example:
                id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                environment_id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                scopes: [config:read]
                public: false
                status: active
                token: svc_018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f.7f3a9c1b2e4d6a8f0c1b3d5e7f9a1c3e
                created_at: "2026-01-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_validation_error
                  message: "credential: at least one scope is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold credentials:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The environment was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_not_found
                  message: Environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listCredentials
      summary: List credentials issued for an environment
      description: >-
        Requires a session for a Member holding credentials:manage. Each
        entry is metadata only: the plaintext secret and its hash are
        never included, per the spec's "Listing credentials never exposes
        the secret" requirement. Entries carry the credential's name, its
        expiry when it has one, and the instant it was last used (absent
        when it has never been used). An environment outside the caller's
        own Organization is rejected identically to an unknown one.
      tags: [credentials]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
