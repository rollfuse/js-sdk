          description: Connectors found (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold connectors:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The Project was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/connectors/preview:
    post:
      operationId: previewConnectorMapping
      summary: Test a mapping against a live source without persisting anything
      description: >-
        Requires a session for a Member holding connectors:manage. Fetches
        source_url once (bounded by the same timeout, response-size limit
        and SSRF protection as a Connector's own sync) and applies the
        supplied mapping fields — never a saved ContractTemplateVersion or
        Connector's own mapping. Never creates or modifies a Connector,
        ContractTemplateVersion, or Observation. A project outside the
        caller's own Organization is rejected identically to an unknown
        one.
      tags: [connectors]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewMappingRequest"
            example:
              source_url: https://billing.example.com/metrics
              secret: s3cr3t
              root_path: "."
              value_field: amount
              observed_at_field: observed_at
              observed_at_format: rfc3339
      responses:
        "200":
          description: >-
            The source was fetched successfully. observations is present
            on a resolved mapping; error is present instead when a
            mapping field failed to resolve — raw_response is always
            present either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewMappingResponse"
              examples:
                resolved:
                  summary: Mapping resolved
                  value:
                    raw_response: [{ amount: 42.5, observed_at: "2026-01-01T12:00:00Z" }]
                    observations:
                      - value: 42.5
                        observed_at: "2026-01-01T12:00:00Z"
                fieldFailedToResolve:
                  summary: A mapping field failed to resolve
                  value:
                    raw_response: [{ observed_at: "2026-01-01T12:00:00Z" }]
                    error: 'value_field "amount" not found'
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold connectors:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The Project was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "502":
          description: >-
            source_url could not be fetched (unreachable, timed out,
            returned a non-2xx status, or exceeded the response size
            limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: connector_preview_fetch_failed
                  message: "httpclient: non-success status 500"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

