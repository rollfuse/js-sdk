        organization_id:
          type: string
        issuer:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"

    MemberResponse:
      type: object
      required: [id, email, name, status, roles]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        roles:
          type: array
          items:
            type: string

    InviteMemberRequest:
      type: object
      required: [email]
      description: >-
        Carries the invited email and the role they will hold on acceptance.
        There is deliberately no organization_id field: an invite is always
        issued into the caller's own session-bound Organization, so the body
        cannot express a cross-tenant issuance. Unknown fields are rejected.
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member, read_only, feature_delivery, billing_administration]
          description: >-
            The role the invitee will hold once this invite is accepted.
            Omitted or empty defaults to the base "member" role. Conferring
            any other role requires the inviter to themselves hold
            roles:manage; conferring one that includes role administration
            follows the same approval rule as granting it directly.

    MemberInviteResponse:
      type: object
      required:
        [
          id,
          email,
          role,
          status,
          inviter_member_id,
          created_at,
          expires_at,
          accepted_at,
          revoked_at,
        ]
      description: >-
        A MemberInvite projected for administration. It has no token field by
        design: only the emailed link ever carries the accept token, and only
        a one-way hash of it is persisted.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member, read_only, feature_delivery, billing_administration]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: >-
            The status an operator must act on. A pending invite whose expiry
            has lapsed is reported as expired even though the stored row still
            says pending.
        inviter_member_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    MemberInviteListResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/MemberInviteResponse"

    AcceptInviteResponse:
      type: object
      required: [member_id, organization_id, email]
      description: >-
        The Member provisioned by a successful acceptance. It has no
        session-token field: accepting an invite provisions a Member, it does
        not sign anybody in.
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        email:
          type: string
        pending_approval_request_id:
          type: string
          description: >-
            Set only when the invite's role included role administration:
            the Member above is provisioned, but the role grant itself
            awaits a second member's approval.
          format: email

    CompleteLoginResponse:
      type: object
      required:
        [member_id, organization_id, email, session_token, expires_at]
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        email:
          type: string
        session_token:
          type: string
          description: >-
            The plaintext session token. Returned only in this response; no
            other response ever includes it.
        expires_at:
          type: string
          format: date-time

    RequestMagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RequestMagicLinkResponse:
      type: object
      required: [message]
      description: >-
        Deliberately identical whether or not the email matched an existing
        Member — see requestMagicLink's description.
      properties:
        message:
          type: string

    PeekMagicLinkResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean

    RequestStaffMagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RequestStaffMagicLinkResponse:
      type: object
      required: [message]
      description: >-
        Deliberately identical whether or not the email matched an active
        StaffMember — see requestStaffMagicLink's description.
      properties:
        message:
          type: string

    PeekStaffMagicLinkResponse:
      type: object
      required: [valid]
      description: >-
        Reports validity only. It never names the StaffMember the token
        belongs to.
      properties:
        valid:
          type: boolean

    StaffMember:
      type: object
      required: [id, email, name, status, permissions]
      description: >-
        A platform-staff identity. It has no organization field by design: a
        StaffMember acts across every Organization and is a distinct
        identity from a Member, even when the same email also holds a
        Member account somewhere. It carries no token or hash field either,
        so no staff endpoint can leak credential material.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        permissions:
          type: array
          description: >-
            The staff permissions this StaffMember was granted, drawn from a
            small fixed catalog. Read-only here: granting and revoking are
            out-of-band operations with no API surface.
          items:
            type: string
            enum: ["billing:refund", "support:view", "support:respond", "support:close", "privacy:erase", "residency:review", "leads:work"]

    ConfirmStaffMagicLinkResponse:
      type: object
      required: [staff_member, session_token, expires_at]
      description: >-
        The only place the plaintext StaffSession token is ever returned;
        only its one-way hash is persisted.
      properties:
        staff_member:
          $ref: "#/components/schemas/StaffMember"
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time

    CurrentStaffSessionResponse:
      type: object
      required: [staff_member]
      description: >-
        The staff identity behind a presented StaffSession. It has no
        session-token field by design, so the endpoint cannot leak the token
        it is looked up by.
      properties:
        staff_member:
          $ref: "#/components/schemas/StaffMember"

    IssueRefundRequest:
      type: object
      required: [amount]
      description: >-
        A staff-issued refund request against a one-off charge.


        It carries no currency: a refund is always denominated in the
        charge's own currency, which the API reads from the charge itself, so
        a currency mismatch is impossible rather than merely rejected.
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The amount to refund, in the charge's currency's smallest unit
            (e.g. cents). Must be positive and must not exceed the charge's
            remaining refundable balance.

    StaffChargeResponse:
      type: object
      required: [charge]
      description: The refund-facing view of a one-off charge.
      properties:
        charge:
          $ref: "#/components/schemas/StaffCharge"

    StaffCharge:
      type: object
      required:
        [
          id,
          organization_id,
          status,
          amount,
          currency,
          refunded_amount,
          remaining_refundable_amount,
        ]
      description: >-
        A one-off charge as platform staff see it for refund purposes. Every
        amount is an integer in currency's smallest unit (e.g. cents), never
        a float.
      properties:
        id:
          type: string
        organization_id:
          type: string
        status:
          type: string
          enum: [created, pending, paid, expired, failed, disputed]
          description: >-
            The charge's own lifecycle status. A refund never changes it: a
            fully refunded charge stays `paid`, since a refund is money
            voluntarily returned, not a payment reversed by the cardholder's
            bank (which is a dispute, and does move the status to `disputed`).
            `failed` means the gateway attempted the charge and was declined,
            as opposed to `expired`, which means an asynchronous method's
            payment window elapsed with nobody ever attempting to pay it.
        amount:
          type: integer
          format: int64
          description: The amount originally charged.
        currency:
          type: string
        refunded_amount:
          type: integer
          format: int64
          description: >-
            How much of this charge the payment gateway has confirmed as
            refunded so far, across every refund against it. It moves only on
            a gateway webhook confirmation, never on a refund request, so it
            can briefly lag a refund just issued.
        remaining_refundable_amount:
          type: integer
          format: int64
          description: >-
            `amount` minus `refunded_amount` — how much of this charge is
            still refundable. Returned rather than left to the caller so the
            two can never be read inconsistently.

    CurrentSessionResponse:
      type: object
      required: [member, organization, roles]
      description: >-
        The identity behind a presented session. It has no session-token field
        by design, so the endpoint cannot leak the token it is looked up by.
      properties:
        member:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
        organization:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        roles:
          type: array
          description: >-
            The roles this Member holds. Empty for a Member with no role
            assignment, which is the default after just-in-time provisioning.
          items:
            type: string
        terms:
          type: object
          required: [current_version, acceptance_required]
          description: >-
            The terms of service in force, and whether this Member still owes
            an acceptance of it. Carried on the identity response rather than
            on a second endpoint because the operator shell reads this on
            every authenticated render, and a separate call would let an
            authenticated screen paint before the answer arrived.


            No acceptance timestamp and no previously-accepted version are
            reported: the client only needs to know whether to ask. The
            record itself is evidence held server-side.
          properties:
            current_version:
              type: string
              description: >-
                The version marker of the terms of service currently in
                force, empty on a deployment that publishes no terms. Clients
                render this rather than restating a version of their own, so
                the published document and the accepted version cannot drift
                apart.
            acceptance_required:
              type: boolean
              description: >-
                True when this Member's recorded acceptance is for an earlier
                version or for nothing at all. A Member provisioned by SCIM,
                by an invite, by just-in-time OIDC login or by social signup
                starts with no recorded acceptance, so this is true for all
                of them until they have accepted.

    AcceptTermsRequest:
      type: object
      required: [terms_version]
      additionalProperties: false
      description: >-
        The version the caller is accepting. It is COMPARED against the
        version in force, never stored as given: a stale browser cannot
        record an acceptance of the document it happened to be showing.
      properties:
        terms_version:
          type: string
          minLength: 1

    GrantRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, member, read_only, feature_delivery, billing_administration]

    RoleAssignment:
