          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/staff/organizations/unserved-regions:
    get:
      operationId: listOrganizationsOnUnservedRegions
      summary: List Organizations declaring a region the deployment does not serve
      description: >-
        Requires a StaffSession holding `residency:review`. Lists every
        Organization whose declared data-residency region is outside the set
        this deployment actually serves, so an operator can reconcile the
        commitment with the customer.


        The listing is read-only by design: a region is immutable after
        creation, and an Organization carrying one the infrastructure does
        not honor is reconciled by talking to the customer, not by rewriting
        the row. `total` counts every matching Organization, not just the
        page, and `served_regions` states what the listing was measured
        against. On a deployment that serves everything its Organizations
        declare, the listing is empty.


        Each Organization the page returns is recorded as a staff read in
        that Organization's own audit trail, per platform-staff-access.
      tags: [organizations, platform-staff]
      security:
        - staffSessionAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Defaults to 50 when absent, zero, or above the
            maximum of 200.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Rows to skip in the oldest-first ordering. Defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Organizations declaring a region the deployment does not serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnservedRegionOrganizationsResponse"
              example:
                organizations: []
                total: 0
                limit: 50
                offset: 0
                served_regions: [us]
        "400":
          description: A malformed `limit` or `offset`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The StaffMember does not hold `residency:review`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

