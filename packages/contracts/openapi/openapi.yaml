openapi: 3.1.0
info:
  title: rollfuse API
  version: 0.1.0
  description: >-
    Phase 0/1/2/3/4 foundation contract: health checks and the Organization,
    Project, Environment, FeatureFlag, EnvironmentFlagConfig, Credential,
    ExposureEvent, MetricDefinition/Observation, Experiment,
    AcquisitionContext and IdentityLink vertical slices. These endpoints are
    unauthenticated development-foundation scaffolding until the
    authentication change lands; they are not production tenant
    administration. The evaluation endpoints (GET /v1/config, POST
    /v1/evaluate), the observation ingestion endpoint (POST
    /v1/environments/{environment_id}/metric-definitions/{metric_definition_id}/observations),
    the acquisition-context submission endpoint (POST
    /v1/environments/{environment_id}/acquisition-contexts) and the
    identity-link submission endpoint (POST
    /v1/environments/{environment_id}/identity-links) are the exceptions:
    they are Credential-authenticated from day one.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      description: >-
        Reports that the process is running. Never fails because of a
        PostgreSQL outage.
      tags: [health]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: ok

  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: >-
        Reports whether the instance can serve traffic, verifying PostgreSQL
        connectivity within a bounded timeout.
      tags: [health]
      responses:
        "200":
          description: Instance is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: ok
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: not_ready
                  message: Dependency check failed.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an organization
      description: >-
        Unauthenticated — the one endpoint with no possible authenticated
        caller, since no Member or credential can exist before an
        Organization does. The response includes a single-use
        identity-provider bootstrap credential, returned in plaintext
        exactly once, used to configure the Organization's OIDC provider
        via PUT /v1/organizations/{organization_id}/identity-provider
        before any Member exists.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
            example:
              name: Acme Inc
              slug: acme-inc
              region: us
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
              example:
                id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                name: Acme Inc
                slug: acme-inc
                region: us
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
                identity_provider_bootstrap_token: boot_9f2c1e...redacted
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: organization_validation_error
                  message: "organization: slug is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: An organization with this slug already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: organization_slug_conflict
                  message: An organization with this slug already exists.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}:
    get:
      operationId: getOrganization
      summary: Get an organization by ID
      description: >-
        Requires a session for a Member holding organizations:manage. An
        `organization_id` other than the caller's own Organization is
        rejected identically to an unknown one.
      tags: [organizations]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
              example:
                id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                name: Acme Inc
                slug: acme-inc
                region: us
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Organization was not found, or is not the caller's own
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: organization_not_found
                  message: Organization was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/visitor/events:
    post:
      operationId: recordVisitorJourneyEvents
      summary: Record a batch of visitor-journey events
      description: >-
        Unauthenticated — a visitor of the marketing site has no session.
        Rate limited per client IP. A batch whose consent block does not
        grant analytics is discarded and answered with the same 202 a
        stored batch receives, so a caller cannot tell stored state from
        discarded state. Consent is checked again against the stored
        consent record before anything is persisted.
      tags: [visitor-journeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVisitorEventsRequest"
            example:
              visitor_id: 018f2f3a6f4f7b3e9c3a1f2b3c4d5e6f
              session_id: 018f2f3a6f4f7b3e9c3a1f2b3c4d5e70
              locale: en
              consent:
                analytics: true
                marketing: false
              acquisition:
                utm_source: google
                utm_medium: cpc
                utm_campaign: launch
              events:
                - name: pageview
                  route: /pricing
                  occurred_at: "2026-01-01T12:00:00Z"
      responses:
        "202":
          description: Submission accepted for background processing, or discarded for lack of consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorIngestAccepted"
              example:
                accepted: true
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/visitor/consent:
    post:
      operationId: recordVisitorConsent
      summary: Record a visitor's cookie-consent decision
      description: >-
        Unauthenticated and rate limited per client IP. Every decision is
        accepted, including a full denial: the record is the evidence of
        what the visitor chose. Decisions are append-only — a later
        decision never overwrites an earlier one.
      tags: [visitor-journeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVisitorConsentRequest"
            example:
              visitor_id: 018f2f3a6f4f7b3e9c3a1f2b3c4d5e6f
              analytics: true
              marketing: false
              policy_version: "2026-09-04"
              decided_at: "2026-01-01T12:00:00Z"
      responses:
        "202":
          description: Decision accepted for background processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorIngestAccepted"
              example:
                accepted: true
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/visitor/identify:
    post:
      operationId: identifyVisitorAsLead
      summary: Stitch a visitor to a captured Lead
      description: >-
        Unauthenticated and rate limited per client IP. Accepts a Lead id
        only: that id is opaque and known solely to whoever just submitted
        the lead. Attaching a Member requires a session and uses
        /v1/visitor/identify-member instead, so an unauthenticated caller
        cannot attach a visitor to someone else's Member. Identification is
        first-write-wins per identity kind.
      tags: [visitor-journeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyVisitorRequest"
            example:
              visitor_id: 018f2f3a6f4f7b3e9c3a1f2b3c4d5e6f
              lead_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
      responses:
        "202":
          description: Identification accepted for background processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorIngestAccepted"
              example:
                accepted: true
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/visitor/identify-member:
    post:
      operationId: identifyVisitorAsMember
      summary: Stitch a visitor to the authenticated Member
      description: >-
        Requires a Member session. The Member id is taken from the resolved
        session and can never be supplied in the body — the request schema
        has no such field.
      tags: [visitor-journeys]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyVisitorAsMemberRequest"
            example:
              visitor_id: 018f2f3a6f4f7b3e9c3a1f2b3c4d5e6f
      responses:
        "202":
          description: Identification accepted for background processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorIngestAccepted"
              example:
                accepted: true
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/visitor-journeys/correlation:
    get:
      operationId: readVisitorCorrelation
      summary: Read the visitor acquisition/identification breakdown
      description: >-
        Operator-only. Requires a Member session holding analytics:read
        whose Organization is the configured platform operator
        Organization. Any other Member — including a customer admin who
        legitimately holds analytics:read inside their own Organization —
        receives a non-disclosing 404, because visitor journeys describe
        Rollfuse' own visitors and are not tenant data.
      tags: [visitor-journeys]
      security:
        - sessionToken: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start of the window (inclusive). Defaults to 30 days ago.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End of the window (exclusive). Defaults to now.
      responses:
        "200":
          description: Distinct visitor counts per acquisition channel and identification state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorCorrelation"
              example:
                from: "2026-01-01T00:00:00Z"
                to: "2026-01-31T00:00:00Z"
                buckets:
                  - utm_source: google
                    utm_medium: cpc
                    utm_campaign: launch
                    state: member
                    visitors: 42
        "400":
          description: Invalid window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Non-disclosing not-found for a caller outside the operator Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/visitor-journeys/{visitor_id}:
    delete:
      operationId: eraseVisitorJourney
      summary: Erase everything recorded under a visitor id
      description: >-
        Operator-only, same authorization as the correlation read. Deletes
        every visitor session, journey event and identity link under the
        visitor id. Consent records are deliberately kept: they are the
        evidence of the visitor's choices, including this one.
      tags: [visitor-journeys]
      security:
        - sessionToken: []
      parameters:
        - name: visitor_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: Visitor journey erased.
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Non-disclosing not-found for a caller outside the operator Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/leads:
    post:
      operationId: createLead
      summary: Capture a marketing lead
      description: >-
        Unauthenticated — a prospect submitting interest through the public
        marketing site has no session. Rate limited per client IP. Persists
        a standalone Lead record only; it does not create an Organization,
        Project, Environment or Member.
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
            example:
              email: prospect@example.com
              tier: growth
              company_name: Acme Inc
              locale: en
      responses:
        "201":
          description: Lead captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
              example:
                id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                email: prospect@example.com
                tier: growth
                company_name: Acme Inc
                locale: en
                captured_at: "2026-01-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: lead_validation_error
                  message: "lead: email is not a valid address"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "429":
          description: Rate limit exceeded for the originating IP address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/projects:
    post:
      operationId: createProject
      summary: Create a project under an organization
      description: >-
        Requires a session for a Member holding projects:manage. An
        `organization_id` other than the caller's own Organization is
        rejected identically to an unknown one.
      tags: [projects]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: Growth API
              slug: growth-api
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                name: Growth API
                slug: growth-api
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_validation_error
                  message: "project: slug is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold projects:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The owning organization was not found, or is not the
            caller's own Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: organization_not_found
                  message: Organization was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: A project with this slug already exists in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_slug_conflict
                  message: A project with this slug already exists in this organization.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listProjects
      summary: List an organization's projects
      description: >-
        Requires a session for a Member holding projects:manage — it
        sits beside the create and get operations on this resource
        family and is gated no differently.


        Returns the organization's projects newest first, with the identifier
        as tiebreaker so pagination is stable. An organization that owns no
        project yields an empty collection, not a not-found; an
        `organization_id` other than the caller's own, or one that does
        not exist, yields a non-disclosing not-found.
      tags: [projects]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Defaults to 50 when absent, zero, or above the maximum
            of 200.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Rows to skip in the newest-first ordering. Defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The organization's projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
              example:
                projects:
                  - id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                    organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                    name: Growth API
                    slug: growth-api
                    created_at: "2026-01-01T12:00:00Z"
                    updated_at: "2026-01-01T12:00:00Z"
                limit: 50
                offset: 0
        "400":
          description: Invalid limit or offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_validation_error
                  message: limit must be a non-negative integer.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold projects:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The organization was not found, or is not the caller's own
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: organization_not_found
                  message: Organization was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/organizations/{organization_id}/projects/{project_id}:
    get:
      operationId: getProject
      summary: Get a project by ID
      description: >-
        Requires a session for a Member holding projects:manage. Returns
        a non-disclosing not-found response when the project exists but
        belongs to a different organization, or when `organization_id`
        is not the caller's own Organization.
      tags: [projects]
      security:
        - sessionAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                name: Growth API
                slug: growth-api
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold projects:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Project was not found (or belongs to a different organization).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/environments:
    post:
      operationId: createEnvironment
      summary: Create an environment under a project
      description: >-
        Requires a session for a Member holding environments:manage. A
        Project outside the caller's own Organization is rejected
        identically to an unknown one.
      tags: [environments]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
            example:
              name: Production
              slug: production
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
              example:
                id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: Production
                slug: production
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: Validation error or malformed JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_validation_error
                  message: "environment: slug is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
