        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    ScimTokenListResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ScimTokenResponse"

    ScimUserRequest:
      type: object
