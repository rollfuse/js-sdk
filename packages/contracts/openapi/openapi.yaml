    CreateGuardrailRequest:
      type: object
      required:
        [
          metric_definition_id,
          comparison_operator,
          threshold,
          evaluation_window_seconds,
        ]
      properties:
        metric_definition_id:
          type: string
        comparison_operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold:
          type: number
        evaluation_window_seconds:
          type: integer
          description: >-
            Must be positive. The window of Observations averaged at
            evaluation time, ending at the evaluation instant.
        promote_after_healthy_seconds:
          type: integer
          description: >-
            Optional. Must be positive when set. Once this Guardrail has
            been continuously healthy for at least this duration, it
            triggers an early promotion of the owning Rollout's next
            Stage. Omitted entirely means this Guardrail does not
            participate in promotion.
        pause_after_uncertain_seconds:
          type: integer
          description: >-
            Optional. Must be positive when set. Once this Guardrail has
            been continuously insufficient-data for at least this
            duration, it pauses the owning Rollout. Omitted entirely means
            this Guardrail does not participate in pausing.
        resume_cool_down_seconds:
          type: integer
          description: >-
            Optional. Must be positive when set. After this Guardrail
            automatically resumes a Rollout it paused, it will not
            automatically re-pause for sustained-uncertain metrics again
            until this duration has elapsed. Never suppresses an automatic
            rollback caused by a breached metric. Omitted entirely means no
            cool-down.

