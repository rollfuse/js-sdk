                token: scim_018f2f3a-f100-7000-9c3a-1f2b3c4d5e6f.aBcDeFgHiJkLmNoPqRsT
                status: active
                created_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The organization was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/organizations/{organization_id}/scim-tokens/{scim_token_id}:
