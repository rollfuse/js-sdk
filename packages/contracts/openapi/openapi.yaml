  /v1/projects/{project_id}/guardrail-templates:
    post:
      operationId: createGuardrailTemplate
      summary: Create a reusable GuardrailTemplate under a project
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. A GuardrailTemplate is a named,
        Project-scoped, reusable Guardrail policy shape (comparison
        operator, threshold, evaluation window, and optional promote/pause/
        resume-cool-down durations) that can later be installed onto any
        Rollout in the same Project, producing an independent Guardrail —
        see POST /v1/guardrail-templates/{guardrail_template_id}/install.
      tags: [guardrail-templates]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuardrailTemplateRequest"
            example:
              name: Error rate guard
              comparison_operator: gt
              threshold: 0.01
              evaluation_window_seconds: 900
      responses:
        "201":
          description: GuardrailTemplate created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
              example:
                id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: Error rate guard
                comparison_operator: gt
                threshold: 0.01
                evaluation_window_seconds: 900
                review_status: draft
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: >-
            Validation error (malformed JSON, missing name, invalid
            comparison operator, or a non-positive evaluation window or
            optional duration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: evaluation window must be a positive duration"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: The owning project was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listGuardrailTemplates
      summary: List GuardrailTemplates registered for a project
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands.
      tags: [guardrail-templates]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GuardrailTemplates found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplateList"
              example:
                guardrail_templates:
                  - id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                    project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                    name: Error rate guard
                    comparison_operator: gt
                    threshold: 0.01
                    evaluation_window_seconds: 900
                    review_status: draft
                    created_at: "2026-01-01T12:00:00Z"
                    updated_at: "2026-01-01T12:00:00Z"

  /v1/guardrail-templates/{guardrail_template_id}:
    get:
      operationId: getGuardrailTemplate
      summary: Get a GuardrailTemplate by ID
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GuardrailTemplate found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
        "404":
          description: GuardrailTemplate was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_not_found
                  message: Guardrail template was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    put:
      operationId: updateGuardrailTemplate
      summary: Replace a GuardrailTemplate's tunable fields
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Replaces every tunable field
        wholesale, preserving the GuardrailTemplate's identifier and
        Project ownership. Does not affect any Guardrail already installed
        from this template — installs are one-time copies, not live
        references.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuardrailTemplateRequest"
            example:
              name: Error rate guard (stricter)
              comparison_operator: gt
              threshold: 0.005
              evaluation_window_seconds: 900
      responses:
        "200":
          description: GuardrailTemplate updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: evaluation window must be a positive duration"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: GuardrailTemplate was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_not_found
                  message: Guardrail template was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/guardrail-templates/{guardrail_template_id}/install:
    post:
      operationId: installGuardrailTemplate
      summary: Install a GuardrailTemplate onto a Rollout, creating a Guardrail
      description: >-
        Requires a session for a Member holding guardrails:manage. Creates
        a new, independent Guardrail for target rollout_id and
        metric_definition_id, with tunable field values copied from the
        GuardrailTemplate — validated by the exact same preconditions
        POST /v1/rollouts/{rollout_id}/guardrails already enforces (the
        Rollout must be scheduled or active, and the MetricDefinition
        must belong to the same Project as the Rollout), plus the
        GuardrailTemplate must belong to that same Project. The installed
        Guardrail retains no reference back to the GuardrailTemplate: a
        later template edit never affects it. A Rollout outside the
        caller's own Organization is rejected identically to an unknown
        one.
      tags: [guardrail-templates]
      security:
        - sessionAuth: []
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallGuardrailTemplateRequest"
            example:
              rollout_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
              metric_definition_id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
      responses:
        "201":
          description: Guardrail created from the GuardrailTemplate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrail"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold guardrails:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The GuardrailTemplate, Rollout or MetricDefinition was not
            found, or the Rollout belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_not_found
                  message: Guardrail template was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The Rollout is not scheduled/active, the MetricDefinition
            belongs to a different Project than the Rollout, the
            GuardrailTemplate belongs to a different Project than the
            Rollout, or the GuardrailTemplate's review_status is not
            approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                rolloutNotOwning:
                  summary: Rollout is not scheduled or active
                  value:
                    error:
                      code: guardrail_rollout_not_owning
                      message: "guardrail: rollout is not scheduled or active"
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                templateNotApproved:
                  summary: GuardrailTemplate is not approved
                  value:
                    error:
                      code: guardrail_template_not_approved
                      message: "guardrail: guardrail template is not approved"
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/guardrail-templates/{guardrail_template_id}/submit:
    post:
      operationId: submitGuardrailTemplate
      summary: Submit a GuardrailTemplate for review
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Transitions review_status from draft
        or rejected to submitted.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GuardrailTemplate submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
        "400":
          description: >-
            The GuardrailTemplate's review_status is neither draft nor
            rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: invalid review status transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: GuardrailTemplate was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_not_found
                  message: Guardrail template was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/guardrail-templates/{guardrail_template_id}/approve:
    post:
      operationId: approveGuardrailTemplate
      summary: Approve a submitted GuardrailTemplate
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Transitions review_status from
        submitted to approved. Only an approved GuardrailTemplate can be
        installed onto a Rollout.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveGuardrailTemplateRequest"
            example:
              note: Looks good, thresholds are reasonable.
      responses:
        "200":
          description: GuardrailTemplate approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
        "400":
          description: The GuardrailTemplate's review_status is not submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_template_validation_error
                  message: "guardrail template: invalid review status transition"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: GuardrailTemplate was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/guardrail-templates/{guardrail_template_id}/reject:
    post:
      operationId: rejectGuardrailTemplate
      summary: Reject a submitted GuardrailTemplate
      description: >-
        Development-foundation endpoint, unauthenticated until the
        authentication change lands. Transitions review_status from
        submitted to rejected, storing the required reason. A rejected
        template may be resubmitted for another review pass.
      tags: [guardrail-templates]
      parameters:
        - name: guardrail_template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectGuardrailTemplateRequest"
            example:
              reason: Threshold is too loose for this metric's typical variance.
      responses:
        "200":
          description: GuardrailTemplate rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailTemplate"
        "400":
          description: >-
            The reason is empty, or the GuardrailTemplate's review_status
            is not submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                missingReason:
                  summary: Reason is required
                  value:
                    error:
                      code: guardrail_template_validation_error
                      message: "guardrail template: rejection reason is required"
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                invalidTransition:
                  summary: Template is not submitted
                  value:
                    error:
