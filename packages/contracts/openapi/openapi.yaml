        evaluation_window_seconds, promote_after_healthy_seconds,
        pause_after_uncertain_seconds and resume_cool_down_seconds
        wholesale — there is no partial-patch shape. rollout_id and
        metric_definition_id are not updatable; a Guardrail requested
        through the wrong Rollout id, or whose Rollout belongs to another
        Organization, returns the same not-found response as a
        nonexistent Guardrail (non-disclosing), matching GET on this same
        path.
      tags: [guardrail-auto-rollback]
      security:
        - sessionAuth: []
      parameters:
        - name: rollout_id
          in: path
          required: true
          schema:
            type: string
        - name: guardrail_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuardrailRequest"
            example:
              comparison_operator: lte
              threshold: 0.9
              evaluation_window_seconds: 120
              resume_cool_down_seconds: 600
      responses:
        "200":
          description: Guardrail updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrail"
        "400":
          description: >-
            Validation error (malformed JSON, unknown comparison operator,
            a non-positive evaluation window, or a non-positive
            promote/pause/resume-cool-down duration when set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_validation_error
                  message: "guardrail: resume_cool_down must be a positive duration when set"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold guardrails:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Guardrail was not found, belongs to a different Rollout, or
            its Rollout belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: guardrail_not_found
                  message: Guardrail was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

