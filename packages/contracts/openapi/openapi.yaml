    patch:
      operationId: renameFeatureFlag
      summary: Rename and/or redescribe a feature flag
      description: >-
        Requires a session for a Member holding feature-flags:manage — the
        same gate the create, get and list operations on this resource
        family already apply.


        Updates the flag's name and description. Its key is immutable
        after creation: the key field is optional, and when supplied it
        MUST equal the flag's current key, or the request is refused with
        feature_flag_key_immutable rather than silently ignored.


        A feature flag whose owning project belongs to another Organization
        is rejected identically to an unknown feature flag id.
      tags: [feature-flags]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFeatureFlagRequest"
      responses:
        "200":
          description: Feature flag renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"
        "400":
          description: >-
            The request body failed validation, or attempted to change the
            flag's immutable key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_key_immutable
                  message: A feature flag's key cannot be changed after creation.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold feature-flags:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Feature flag was not found (or belongs to a different
            project or Organization).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_not_found
                  message: Feature flag was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    delete:
      operationId: deleteFeatureFlag
      summary: Delete a feature flag
      description: >-
        Requires a session for a Member holding feature-flags:manage — the
        same gate the create, get and list operations on this resource
        family already apply.


        Deletion is permanent and distinct from archive, which remains the
        reversible option. It is refused with feature_flag_has_dependents
        when a Rollout, Guardrail or Experiment still references the flag,
        naming every one of them. On success, the flag, its variations and
        every environment flag configuration referencing it are removed;
        its historical exposure events and audit events are retained.


        A flag evaluated within the last 24 hours may still be receiving
        traffic; deleting it is refused with
        feature_flag_delete_requires_confirmation unless confirm=true is
        passed, since clients still evaluating it will fall back once it is
        gone. This warning is separate from, and does not override, the
        dependents refusal above.


        A feature flag whose owning project belongs to another Organization
        is rejected identically to an unknown feature flag id.
      tags: [feature-flags]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
        - name: confirm
          in: query
          required: false
          description: >-
            Set to true to proceed despite a recent-evaluation warning. Has
            no effect on the dependents refusal, which confirm can never
            bypass.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Feature flag deleted.
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold feature-flags:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Feature flag was not found (or belongs to a different
            project or Organization).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_not_found
                  message: Feature flag was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            Either the flag is still referenced by at least one Rollout,
            Guardrail or Experiment (feature_flag_has_dependents, naming
            every one of them), or it was evaluated recently and confirm
            was not passed (feature_flag_delete_requires_confirmation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                has_dependents:
                  value:
                    error:
                      code: feature_flag_has_dependents
                      message: "feature flag: cannot be deleted while referenced by rollout rol_1, experiment exp_2"
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                requires_confirmation:
                  value:
                    error:
                      code: feature_flag_delete_requires_confirmation
                      message: This feature flag was evaluated recently; clients may still receive their fallback if it is deleted. Pass confirm=true to proceed.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/feature-flags/{feature_flag_id}/archive:
    post:
      operationId: archiveFeatureFlag
      summary: Archive a feature flag
      description: >-
        Requires a session for a Member holding feature-flags:manage — the
        same gate the create, get and list operations on this resource
        family already apply; archiving introduces no new authorization
        boundary.


        Archiving is a soft delete: the feature flag, its variations, its
        exposure events and its experiments all remain intact and readable.
        It records archived_at, releases the flag's feature_flag entitlement
        allocation so the slot is immediately reusable, and disables
        (enabled=false) every environment flag configuration referencing it.
        The flag's key stays permanently reserved within its project — a new
        flag can never reuse it.


        A feature flag whose owning project belongs to another Organization
        is rejected identically to an unknown feature flag id.
      tags: [feature-flags]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Feature flag archived.
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold feature-flags:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Feature flag was not found (or belongs to another
            Organization).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_not_found
                  message: Feature flag was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: The feature flag is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_already_archived
                  message: This feature flag is already archived.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/projects/{project_id}/feature-flags/{feature_flag_id}/unarchive:
    post:
      operationId: unarchiveFeatureFlag
      summary: Unarchive a feature flag
      description: >-
        Requires a session for a Member holding feature-flags:manage — the
        same gate the create, get and list operations on this resource
        family already apply.


        Unarchiving clears archived_at only after the same synchronous
        feature_flag entitlement check-and-allocate a creation goes through
        succeeds, so it is rejected when the Organization has no free slot
        at that moment (it downgraded, or filled the freed slot with another
        flag); the feature flag then remains archived.


        Unarchiving does not resume targeting: the environment flag
        configurations archiving disabled stay disabled until an operator
        re-enables each one explicitly.
      tags: [feature-flags]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Feature flag unarchived.
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: >-
            The organization has no available feature flag slot for the
            current plan, so the feature flag remains archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: entitlement_limit_exceeded
                  message: This organization has reached its feature flag limit for the current plan.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold feature-flags:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            Feature flag was not found (or belongs to another
            Organization).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_not_found
                  message: Feature flag was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: The feature flag is not archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: feature_flag_not_archived
                  message: This feature flag is not archived.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
  /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/config:
    put:
      operationId: putEnvironmentFlagConfig
      summary: Create or replace a feature flag's configuration in an environment
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. Upsert semantics: the first write
        creates the configuration, subsequent writes replace it (including
        wholesale replacement of its rules) in place. The environment and
        the feature flag must belong to the same project. An environment
        outside the caller's own Organization is rejected identically to an
        unknown one.
      tags: [environment-flag-targeting]
      security:
        - sessionAuth: []
      parameters:
        - name: environment_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_flag_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutEnvironmentFlagConfigRequest"
            example:
              enabled: true
              default_variation_id: 018f2f3a-9200-7000-9c3a-1f2b3c4d5e6f
              rules:
                - attribute: plan
                  value: enterprise
                  outcome:
                    variation_id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                - outcome:
                    rollout:
                      - variation_id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                        percentage: 50
                      - variation_id: 018f2f3a-9200-7000-9c3a-1f2b3c4d5e6f
                        percentage: 50
      responses:
        "200":
          description: >-
            Configuration created or replaced (status "applied"), or held
            pending approval (status "pending_approval") because the owning
            Environment's approval policy requires it -- see
            PutEnvironmentFlagConfigResponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutEnvironmentFlagConfigResponse"
              example:
                status: applied
                environment_flag_config:
                  id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                  environment_id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                  feature_flag_id: 018f2f3a-9000-7000-9c3a-1f2b3c4d5e6f
                  enabled: true
                  default_variation_id: 018f2f3a-9200-7000-9c3a-1f2b3c4d5e6f
                  rules:
                    - attribute: plan
                      value: enterprise
                      outcome:
                        variation_id: 018f2f3a-9100-7000-9c3a-1f2b3c4d5e6f
                  created_at: "2026-01-01T12:00:00Z"
                  updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: >-
            Validation error (including malformed JSON, missing default
            variation, an unknown variation or segment reference, a rule
            combining an inline condition with a segment_id, a partial
            rule condition, a rollout not summing to 100, or the
            environment and feature flag belonging to different projects).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_validation_error
                  message: "environment flag config: default variation is required"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: >-
            The feature flag's entitlement allocation is locked: the
            Organization is over its feature flag allowance for the
            current plan (after a downgrade, or after a subscription
            suspension reduced its grants to the free tier) and the grace
            period has elapsed. The flag keeps being read and evaluated
            normally; only creation and edits are refused, until the plan
            is upgraded or another feature flag is removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: entitlement_allocation_locked
                  message: >-
                    This feature flag is locked because the organization
                    is over its feature flag limit for the current plan.
                    Upgrade the plan, or remove another feature flag, to
                    edit it again.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: >-
            The session's Member does not hold
            environment-flag-configs:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The environment or the feature flag was not found, or the
            environment belongs to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_not_found
                  message: Environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The configuration is owned by a scheduled or active Rollout
            (manual upserts are rejected), or a change to this environment
            and feature flag is already pending approval (task 7.6 -- a
            second submission for the same subject is refused, not
            queued).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_flag_config_approval_already_pending
                  message: "environment flag config: a change to this environment and feature flag is already pending approval"
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: getEnvironmentFlagConfig
      summary: Get a feature flag's configuration in an environment
      description: >-
        Requires a session for a Member holding
        environment-flag-configs:manage. Returns a non-disclosing
        not-found response when no configuration exists for this
        environment and feature flag pair, or when the environment belongs
        to another Organization.
