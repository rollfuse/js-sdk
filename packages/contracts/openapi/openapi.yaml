  /v1/erasure-requests:
    post:
      operationId: requestErasure
      summary: Request erasure of your own account and personal data
      description: >-
        Records and acknowledges an authenticated Member's request to erase
        their account and personal data, and states the processing window
        the request will be answered within (thirty days by default, per
        ADR 0014). It does NOT erase anything: per
        personal-data-lifecycle, erasure is a recorded request with a
        stated window and a reported outcome per store, processed
        afterwards by an operator holding `privacy:erase`.

        Whose data is erased comes from the presented session, never from
        the body — there is no field to name a subject — so this endpoint
        cannot be pointed at another person. A Member who already has an
        open request receives that one back rather than a second.

        No permission is required beyond a valid session: asking for your
        own data to be erased is not a privilege.
      tags: [personal-data-lifecycle]
      security:
        - sessionAuth: []
      responses:
        "202":
          description: >-
            The request was recorded and acknowledged, with the stated
            processing window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "401":
          description: No session was presented, or the presented one is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/erasure-requests/current:
    get:
      operationId: getCurrentErasureRequest
      summary: Read back your own erasure request
      description: >-
        Returns the requesting Member's most recent erasure request that
        still names them. This is where a REFUSAL is read: when erasure is
        refused because the Member is the only administrator of an
        Organization with an active subscription, `refusal_reason` states
        what must happen first and the options available.

        A completed request is deliberately unreachable here, and by
        construction rather than by a filter: completing an erasure clears
        the member id the request was keyed by, so nothing is left to match
        on. That is the point — the platform keeps no index of whom it has
        erased.
      tags: [personal-data-lifecycle]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The Member's own erasure request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "401":
          description: No session was presented, or the presented one is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The Member has no erasure request that still names them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/staff/erasure-requests:
    post:
      operationId: recordContactErasureRequest
      summary: Record an erasure request that arrived through the published contact
      description: >-
        Requires a StaffSession holding `privacy:erase`. Records a request
        from a person who is not a Member and therefore has no account to
        ask from inside the product, per personal-data-lifecycle's
        "Erasure of a non-member" scenario: their records are located by
        the contact details they supplied.

        If the address does turn out to belong to an account, the request
        covers that account too — the same stores, the same erasers.
      tags: [personal-data-lifecycle, platform-staff]
      security:
        - staffSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordContactErasureRequest"
      responses:
        "202":
          description: The request was recorded and acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "400":
          description: No contact address was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The StaffMember does not hold `privacy:erase`, or a
            cookie-authenticated write arrived from an unapproved origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/staff/erasure-requests/{erasure_request_id}:
    get:
      operationId: getErasureRequest
      summary: Read one erasure request and its outcome report
      description: >-
        Requires a StaffSession holding `privacy:erase`. Returns the
        request's status and, once processed, the per-store outcomes and
        the rendered report naming what was deleted, what was anonymized
        and what was retained with the reason for each.
      tags: [personal-data-lifecycle, platform-staff]
      security:
        - staffSessionAuth: []
      parameters:
        - name: erasure_request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The erasure request and its outcome report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The StaffMember does not hold `privacy:erase`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/staff/erasure-requests/{erasure_request_id}/process:
    post:
      operationId: processErasureRequest
      summary: Process a recorded erasure request across every enumerated store
      description: >-
        Requires a StaffSession holding `privacy:erase`. Visits every store
        in the enumerated erasure scope, records the outcome per store, and
        clears the identifying input from the request record itself once
        every store completed.

        It is explicitly triggered rather than scheduled, per design.md:
        erasure processing is manual-triggered at first so it cannot run
        unattended before it is trusted.

        Two outcomes are not success. If the requester is the only
        administrator of an Organization with an active subscription the
        whole request is REFUSED and nothing is erased, with
        `refusal_reason` stating what must happen first. If any single
        store fails, the request is recorded as `failed` with that store's
        outcome naming the failure, and it keeps its subject so it can be
        retried — it never reports a completeness it does not have.
      tags: [personal-data-lifecycle, platform-staff]
      security:
        - staffSessionAuth: []
      parameters:
        - name: erasure_request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            The processed request, carrying the per-store outcomes and the
            rendered report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"
        "401":
          description: >-
            No StaffSession was presented, or the presented one is invalid,
            expired, revoked, or belongs to a disabled StaffMember.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            The StaffMember does not hold `privacy:erase`, or a
            cookie-authenticated write arrived from an unapproved origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The request has already been processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"


components:
  schemas:
    RecordContactErasureRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: >-
            The contact address the request arrived from. Records are
            located by it, canonically (trimmed and lower-cased).
      additionalProperties: false
    ErasureStoreOutcome:
      type: object
      required: [store, tables, disposition, records_affected]
      properties:
        store:
          type: string
          description: >-
            One store in the enumerated erasure scope. The scope is
            enumerated in exactly one place so a store added later cannot
            be silently skipped.
          enum:
            - members
            - member_access
            - approval_requests
            - visitor_journey
            - visitor_consent
            - leads
            - audit_events
            - flag_config_history
            - support
            - billing_charges
            - billing_notifications
            - identity_links
        tables:
          type: array
          description: The database tables that store covers.
          items:
            type: string
        disposition:
          type: string
          description: >-
            What was done. `retained`, `not_applicable` and `failed`
            always carry a reason.
          enum: [deleted, anonymized, retained, not_applicable, failed]
        records_affected:
          type: integer
          format: int64
          description: >-
            How many records the disposition applied to: deleted,
            anonymized, or counted and kept. Zero for a not-applicable or
            failed store.
        reason:
          type: string
          description: >-
            Why the records were kept, why the store held nothing
            reachable, or why it failed.
      additionalProperties: false
    ErasureRequest:
      type: object
      description: >-
        A recorded erasure request, its acknowledgement and — once
        processed — the outcome per store.

        It deliberately carries NO field naming the person: not the member
        id it was recorded against, not the contact address. The
        acknowledgement goes back to whoever already proved they are that
        person, so echoing it would only make the response another copy of
        what the request exists to erase. The stored record itself is
        cleared of both the moment processing completes.
      required:
        - id
        - origin
        - status
        - acknowledgement
        - requested_at
        - respond_by
        - response_window_days
        - processed_at
        - outcomes
      properties:
        id:
          type: string
        origin:
          type: string
          description: >-
            `member` for an authenticated in-product request, `contact` for
            one recorded by an operator on behalf of a person with no
            account.
          enum: [member, contact]
        status:
          type: string
          description: >-
            `received` is recorded and awaiting processing. `completed` is
            every store visited without failure, with the identifying input
            cleared. `refused` is nothing erased, with `refusal_reason`
            saying what must happen first. `failed` is at least one store
            that could not be processed, kept retryable.
          enum: [received, completed, refused, failed]
        acknowledgement:
          type: string
          description: >-
            The plain-language acknowledgement, stating the processing
            window while the request is open.
        requested_at:
          type: string
          format: date-time
        respond_by:
          type: string
          format: date-time
          description: >-
            The deadline of the stated processing window, persisted when
            the request was recorded so a later configuration change cannot
            move a commitment already made.
        response_window_days:
          type: integer
          description: The stated window in days, derived from this request's own timestamps.
        processed_at:
          type: [string, "null"]
          format: date-time
          description: When the request finished processing, or null while still pending.
        refusal_reason:
          type: string
          description: >-
            Present only for a refused request: what must happen first, and
            the options available.
        outcomes:
          type: array
          description: One entry per enumerated store, in registry order.
          items:
            $ref: "#/components/schemas/ErasureStoreOutcome"
        report:
          type: string
          description: >-
            The rendered, human-readable report naming what was deleted,
            what was anonymized and what was retained with the reason for
            each. Empty until the request has been processed.
      additionalProperties: false
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    AuditEvent:
      type: object
      required:
        - id
        - organization_id
        - event_type
        - subject_type
        - subject_id
        - payload
        - predates_actor_capture
        - created_at
      properties:
        id:
          type: string
        organization_id:
          type: string
        event_type:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: >-
            The event's JSON document. Its shape varies by event_type; it is
            an opaque, schema-less record of what happened.
        actor:
          allOf:
            - $ref: "#/components/schemas/AuditEventActor"
          description: >-
            Who or what triggered the recorded mutation. Omitted for an
            event recorded by a module that has not adopted attribution yet
            (predates_actor_capture is false in that case) or for an event
            that predates actor attribution entirely (predates_actor_capture
            is true) — an absent actor is never defaulted to a specific
            value.
        predates_actor_capture:
          type: boolean
          description: >-
            True only for an event recorded before this platform captured
            actors at all. Distinguishes that historical gap from an event
            recorded afterward whose actor is absent because the recording
            module has not adopted attribution yet — the latter is a defect
            to fix, the former is not.
        created_at:
          type: string
          format: date-time

    AuditEventActor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [member, staff, system, gateway]
          description: >-
            member is an authenticated Member acting through a self-serve
            surface, staff is a platform StaffMember acting across
            Organizations through a staff-only surface (e.g. issuing a
            refund), system is the platform's own scheduled processing (e.g.
            renewal), and gateway is an inbound payment-gateway webhook.
        id:
          type: string
          description: >-
            The acting Member's or StaffMember's id. Present only for a
            member or staff actor; a system or gateway actor carries none.

    AuditEventList:
      type: object
      required: [audit_events, limit, offset, has_more]
      properties:
        audit_events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.
        has_more:
          type: boolean
          description: >-
            Whether at least one further audit event exists beyond this
            page. Always false for an unbounded export request, since
            nothing was capped. A response never presents a subset as if
            it were the whole.

    ListProjectsResponse:
      type: object
      required: [projects, limit, offset]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.

    ListFeatureFlagsResponse:
      type: object
      required: [feature_flags, limit, offset, has_more]
      properties:
        feature_flags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.
        has_more:
          type: boolean
          description: >-
            Whether at least one further feature flag exists beyond this
            page. A response never presents a subset as if it were the
            whole.

    ListEnvironmentsResponse:
      type: object
      required: [environments, limit, offset]
      properties:
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.

    VisitorConsentState:
      type: object
      required: [analytics, marketing]
      additionalProperties: false
      properties:
        analytics:
          type: boolean
        marketing:
          type: boolean

    VisitorAcquisition:
      type: object
      additionalProperties: false
      properties:
        utm_source:
          type: string
          maxLength: 255
        utm_medium:
          type: string
          maxLength: 255
        utm_campaign:
          type: string
          maxLength: 255
        utm_term:
          type: string
          maxLength: 255
        utm_content:
          type: string
          maxLength: 255
        landing_url:
          type: string
          maxLength: 2048
        referrer:
          type: string
          maxLength: 2048

    VisitorJourneyEvent:
      type: object
      required: [name, route, occurred_at]
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
            - pageview
            - signup_started
            - signup_completed
            - lead_submitted
            - login_completed
            - checkout_started
            - checkout_completed
          description: >-
            A closed set. An event named anything else is rejected, so the
            value can never become unbounded and visitor-controlled.
        route:
          type: string
          maxLength: 512
          description: >-
            A pathname only, already normalized to its route template by
            the client. A value carrying a query string or fragment is
            rejected rather than truncated.
        properties:
          type: object
          additionalProperties:
            type: string
            maxLength: 120
          description: >-
            At most 10 entries, keys drawn from a closed allowlist. Values
            containing an "@" are rejected, so this cannot become a channel
            for personal data.
        occurred_at:
          type: string
          format: date-time

    RecordVisitorEventsRequest:
      type: object
      required: [visitor_id, session_id, locale, consent, events]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64
          description: >-
            A pseudonymous, browser-generated opaque token. Never derived
            from an IP address, user agent, email or anything else that
            would identify the visitor across sites.
        session_id:
          type: string
          maxLength: 64
        locale:
          type: string
          enum: [en, pt-br]
        consent:
          $ref: "#/components/schemas/VisitorConsentState"
        acquisition:
          $ref: "#/components/schemas/VisitorAcquisition"
        events:
          type: array
          items:
            $ref: "#/components/schemas/VisitorJourneyEvent"

    RecordVisitorConsentRequest:
      type: object
      required: [visitor_id, analytics, marketing, policy_version, decided_at]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64
        analytics:
          type: boolean
        marketing:
          type: boolean
        policy_version:
          type: string
          maxLength: 40
          description: The cookie-policy version the decision was made against.
        decided_at:
          type: string
          format: date-time

    IdentifyVisitorRequest:
      type: object
      required: [visitor_id, lead_id]
      additionalProperties: false
      properties:
        visitor_id:
          type: string
          maxLength: 64
        lead_id:
