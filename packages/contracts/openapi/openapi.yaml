      description: >-
        Requires a session for a Member holding segments:manage. A Segment
        is a named, Project-scoped, reusable set of 1-20 AND-composed
        attribute-equality conditions, referenced by id from a Rule's
        segment_id as an alternative to an inline condition — defined once,
        updated in one place, visible everywhere it's referenced. A project
        outside the caller's own Organization is rejected identically to an
        unknown one.
