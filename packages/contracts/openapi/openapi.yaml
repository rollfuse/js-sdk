          required: true
          schema:
            type: string
      responses:
        "200":
          description: ScimTokens listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenListResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: issueScimToken
      summary: Issue a ScimToken for an Organization
      description: >-
        Requires a session for a Member holding roles:manage. The
        plaintext token is returned only in this response.
      tags: [scim]
      security:
        - sessionAuth: []
