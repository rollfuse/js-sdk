        - name: subject_key
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Observations found (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationList"
