    FlagComparison:
      type: object
      required: [feature_flag_id, feature_flag_key, presence, difference]
      properties:
        feature_flag_id:
          type: string
        feature_flag_key:
          type: string
        presence:
          type: string
          enum: [both, before_only, after_only]
