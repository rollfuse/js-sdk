  /v1/projects/{project_id}/connectors:
    post:
      operationId: createConnector
      summary: Create a Connector under a project
      description: >-
        Requires a session for a Member holding connectors:manage. A
        Connector is a Project-scoped configuration for pulling
        Observation data from an external HTTP source into a mapped
        MetricDefinition and Environment, both owned by the same Project.
        The pull secret is stored encrypted at rest and returned in
        plaintext only in this response. A Connector is pinned at
        creation to a specific, approved version of a ContractTemplate
        (omitted resolves to that template's highest currently approved
        version); the pin is immutable afterward except via an explicit
        later edit, so approving a new template version never changes
        how an already-created Connector's sync behaves — see the
        connectors capability spec's "Contract Template Version Is
        Pinned At Creation" requirement. A project outside the caller's
        own Organization is rejected identically to an unknown one.
      tags: [connectors]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorRequest"
            example:
              name: Billing metrics
              template_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
              source_url: https://billing.example.com/metrics
              secret: s3cr3t
              metric_definition_id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
              environment_id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
      responses:
        "201":
          description: Connector created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCreated"
              example:
                id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                name: Billing metrics
                template_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                template_version: 1
                source_url: https://billing.example.com/metrics
                metric_definition_id: 018f2f3a-a000-7000-9c3a-1f2b3c4d5e6f
                environment_id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                status: active
                consecutive_mapping_mismatches: 0
                secret: s3cr3t
                created_at: "2026-01-01T12:00:00Z"
                updated_at: "2026-01-01T12:00:00Z"
        "400":
          description: >-
            Validation error (malformed JSON, missing fields, an
            unapproved or nonexistent template_version, the
            MetricDefinition/Environment belongs to a different Project,
            or the Project has reached the maximum number of Connectors).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validationError:
                  summary: Generic validation error
                  value:
                    error:
                      code: connector_validation_error
                      message: 'connector: source url scheme "http" is not allowed, https is required'
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                unapprovedTemplateVersion:
                  summary: Referenced template version is not approved
                  value:
                    error:
                      code: connector_validation_error
                      message: "connector: contract template version is not approved"
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                atCap:
                  summary: Project has reached the maximum number of Connectors
                  value:
                    error:
                      code: connector_validation_error
                      message: "connector: project has reached the maximum number of connectors"
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold connectors:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The owning Project, the referenced MetricDefinition, or the
            referenced Environment was not found, or the Project belongs
            to another Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: project_not_found
                  message: Project was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
    get:
      operationId: listConnectors
      summary: List Connectors registered for a project
      description: >-
        Requires a session for a Member holding connectors:manage. Never
        includes the plaintext pull secret or its encrypted
        representation. A project outside the caller's own Organization
        is rejected identically to an unknown one.
      tags: [connectors]
      security:
        - sessionAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connectors found (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
        "401":
          description: Missing or invalid session token.
          content:
