      properties:
        schemas:
          type: array
          items:
            type: string
        status:
          type: string
        detail:
          type: string

    CredentialMetadata:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          scopes,
          public,
          status,
          created_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
          description: >-
            Whether this credential was issued as safe to embed in
            browser-visible code. Fixed at issuance.
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        name:
          type: string
          description: >-
            The human-readable label supplied at issue time. Absent when the
            credential is unnamed.
        expires_at:
          type: string
          format: date-time
          description: >-
            The instant this credential stops authenticating requests.
            Absent when it never expires.
        last_used_at:
          type: string
          format: date-time
          description: >-
            The instant this credential last authenticated a request.
            ABSENT means it has never been used — that is how a never-used
            credential is distinguished from one used at a known instant.
            Recorded asynchronously, so it may lag a request by seconds.

    RotatedCredential:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          scopes,
          public,
          status,
          created_at,
          token,
          previous_secret_expires_at,
        ]
      description: >-
        A rotated credential: its unchanged metadata, the replacement token
        (disclosed here once and never again) and the instant the previous
        secret stops being accepted.
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [config:read, metrics:write, acquisition:write, identity:write]
        public:
          type: boolean
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        token:
          type: string
          description: >-
            The plaintext replacement token. Returned only in this rotation
            response; no other response ever includes it.
        previous_secret_expires_at:
          type: string
          format: date-time
          description: >-
            The instant the secret being replaced stops being accepted.

    CreateWebhookEndpointRequest:
      type: object
      required: [url, event_types]
      additionalProperties: false
      properties:
        url:
          type: string
          description: >-
            Must be an https URL. It is parsed and its scheme is checked,
            so a value that merely begins with "https" but is not a valid
            https URL is refused.
        event_types:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              [
                flag.published,
                rollout.promoted,
                rollout.paused,
                rollout.resumed,
                rollout.rolled_back,
                guardrail.tripped,
                experiment.concluded,
              ]

    WebhookEndpoint:
      type: object
      required: [id, project_id, url, event_types, status, secret, created_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        secret:
          type: string
          description: >-
            The plaintext signing secret. Returned only in the creation
            response; no other response ever includes it. Used to compute
            each delivery's X-Webhook-Signature HMAC-SHA256 header.
        created_at:
          type: string
          format: date-time

    WebhookEndpointMetadata:
      type: object
      required: [id, project_id, url, event_types, status, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListWebhookDeliveriesResponse:
      type: object
      required: [deliveries, limit, offset, has_more]
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliveryMetadata"
        limit:
          type: integer
          description: The pagination limit actually applied (default when none supplied).
        offset:
          type: integer
          description: The pagination offset actually applied.
        has_more:
          type: boolean
          description: >-
            Whether at least one further delivery exists beyond this page.
            A response never presents a subset as if it were the whole.

    WebhookDeliveryMetadata:
      type: object
      required:
        [
          id,
          webhook_endpoint_id,
          event_type,
          status,
          attempt_count,
          last_attempted_at,
          next_attempt_at,
          last_failure_reason,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        webhook_endpoint_id:
          type: string
        event_type:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt_count:
          type: integer
        last_attempted_at:
          type: [string, "null"]
          format: date-time
          description: Null until the first delivery attempt.
        next_attempt_at:
          type: string
          format: date-time
        last_failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      required:
        [
          id,
          webhook_endpoint_id,
          event_type,
          payload,
          status,
          attempt_count,
          last_attempted_at,
          next_attempt_at,
          last_failure_reason,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        webhook_endpoint_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          description: >-
            The full enveloped body (event_type, event_version, occurred_at,
            data) that was signed and sent to the receiving endpoint.
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt_count:
          type: integer
        last_attempted_at:
          type: [string, "null"]
          format: date-time
          description: Null until the first delivery attempt.
        next_attempt_at:
          type: string
          format: date-time
        last_failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvaluationVariation:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}

    EvaluationOutcome:
      type: object
      additionalProperties: false
      properties:
        variation_key:
          type: string
        rollout:
          type: array
          minItems: 2
          items:
            type: object
            required: [variation_key, percentage]
            properties:
              variation_key:
                type: string
              percentage:
                type: number
                description: >-
                  Up to two decimal places (expand-targeting-model task
                  8.5).
                minimum: 0.01
                maximum: 100

    EvaluationRule:
      type: object
      required: [outcome]
      properties:
        conditions:
          type: array
          description: >-
            Attribute-equality conditions that MUST ALL match (logical AND)
            for this Rule to apply. Absent or empty means an unconditional
            catch-all. A Rule that referenced a reusable Segment has that
            Segment's conditions resolved here — the two look identical on
            the wire. This flat shape is served whenever the Rule's own
            condition is exactly representable as it (every pre-section-5
            Rule, and any composed one that happens to reduce to a flat
            AND of equality leaves); condition below is served instead
            when it genuinely needs the composed tree shape.
          items:
            type: object
            required: [attribute, value]
            properties:
              attribute:
                type: string
              value:
                type: string
        condition:
          $ref: "#/components/schemas/ClauseTree"
          description: >-
            expand-targeting-model's composed condition (AND/OR/negation/
            nesting) — served instead of conditions when the Rule's own
            condition cannot be reduced to that flat shape. See conditions'
            own description for exactly when each is served.
        outcome:
          $ref: "#/components/schemas/EvaluationOutcome"

    FlagConfig:
      type: object
      required: [flag_key, enabled, default_variation, variations, rules]
      properties:
        flag_key:
          type: string
        enabled:
          type: boolean
        default_variation:
          type: string
        variations:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationVariation"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationRule"
        non_evaluable:
          type: boolean
          description: >-
            True when this FlagConfig uses a construct newer than the
            format version the requesting client declared support for via
            the X-Rollfuse-Client-Format-Version request header (see
            Configuration.format_version). When true, variations and
            rules are empty and MUST NOT be evaluated — the client MUST
            serve the caller's own fallback for this flag instead, per
            feature-evaluation's "The Configuration Format Is Versioned
            For Compatibility" requirement. Omitted (false) for every
            flag today, since no construct newer than format version 1
            exists yet.
        individual_targets:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationIndividualTarget"
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationPrerequisite"

    EvaluationIndividualTarget:
      type: object
      required: [variation_key, subject_keys]
      properties:
        variation_key:
          type: string
        subject_keys:
          type: array
          items:
            type: string

    EvaluationPrerequisite:
      type: object
      required: [flag_key, required_variation_key]
      properties:
        flag_key:
          type: string
        required_variation_key:
          type: string

    Configuration:
      type: object
      required: [environment_id, version, format_version, flags, poll_interval_seconds]
      properties:
        environment_id:
          type: string
        version:
          type: integer
          description: >-
            Monotonically increasing Configuration Version for this
            Environment. Advances whenever a FeatureFlag, its Variations,
            or an EnvironmentFlagConfig affecting this Environment is
            created, updated or removed. Also served as GET /v1/config's
            ETag response header (quoted, e.g. "v3") — a request carrying
            that value in If-None-Match gets 304 Not Modified with no
            body instead of a full Configuration.
        format_version:
          type: integer
          description: >-
            The highest configuration format version this platform can
            serve at all today. Informational: it does not by itself
            indicate whether any individual flag in `flags` was withheld
            as non_evaluable for the requesting client's own declared
            version, which may be lower.
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FlagConfig"
        poll_interval_seconds:
          type: integer
          description: >-
            Advised interval, in seconds, for a client polling GET
            /v1/config. Paired with the ETag/If-None-Match support above:
            a client polling at this interval and presenting its last
            ETag pays only a 304 on most polls.

    EvaluateRequest:
      type: object
      required: [subject_key]
      additionalProperties: false
      properties:
        subject_key:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        flag_key:
          type: string
          description: Omit to evaluate every FeatureFlag configured in the Environment.

    EvaluationResult:
      type: object
      required:
        [
          flag_key,
          variation_key,
          value,
          reason,
          config_version,
          track_exposure,
        ]
      properties:
        flag_key:
          type: string
        variation_key:
          type: string
        value: {}
        reason:
          type: string
          enum:
            [
              rule_match,
              default_disabled,
              default_no_rule_match,
              default_fallback,
            ]
        config_version:
          type: integer
        track_exposure:
          type: boolean

    EvaluateResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationResult"

    ExposureEvent:
      type: object
      required:
        [
          id,
          organization_id,
          project_id,
          environment_id,
          feature_flag_id,
          subject_key,
          variation_key,
          reason,
          config_version,
          correlation_id,
          occurred_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        feature_flag_id:
          type: string
        subject_key:
          type: string
        variation_key:
          type: string
        reason:
          type: string
        config_version:
          type: integer
        correlation_id:
          type: string
        occurred_at:
          type: string
          format: date-time

    ExposureEventList:
      type: object
      required: [exposure_events]
      properties:
        exposure_events:
          type: array
          items:
            $ref: "#/components/schemas/ExposureEvent"
        has_more:
          type: boolean
          description: >-
            Whether more ExposureEvents exist beyond this page. Set by
            GET /v1/environments/{environment_id}/feature-flags/{feature_flag_id}/exposure-events;
            absent from GET /v1/experiments/{experiment_id}/exposure-events.

    ExposureEventSubmission:
      type: object
      required:
        [flag_key, subject_key, variation_key, reason, config_version]
      properties:
        flag_key:
          type: string
        subject_key:
          type: string
        variation_key:
          type: string
        reason:
          type: string
        config_version:
          type: integer
        correlation_id:
          type: string
          description: >-
            Client-generated. Falls back to the request's own request id
            when omitted.
        occurred_at:
          type: string
          format: date-time
          description: >-
            When the local evaluation that produced this event occurred.
            Falls back to the server's receive time when omitted.

    SubmitExposureEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          # establish-production-operability, "Declare a maximum batch
          # size in the API contract": an uncapped batch used to become
          # one sequential feature-flag-key-lookup query per event — see
          # exposure_submission_batch_too_large below and
          # FeatureFlagKeyLookup.FindByKeys, which now resolves a whole
          # batch in one bounded query regardless of item count.
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExposureEventSubmission"

    SubmitExposureEventsResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: >-
            How many submitted events resolved to a known flag_key and
            were handed off for best-effort recording.

    SegmentConditionInput:
      type: object
