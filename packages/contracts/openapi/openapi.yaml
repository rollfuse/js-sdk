                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/approval-requests/decided:
    get:
      operationId: listDecidedApprovalRequests
      summary: List decided ApprovalRequests for the caller's Organization
      description: >-
        Requires a session for a Member holding roles:manage. Returns only
        already-decided (approved or rejected) ApprovalRequests scoped to
        the caller's own Organization, most recently decided first -- see
        complete-governance-surface's "Decided requests remain readable"
        requirement (task 8.3). listPendingApprovalRequests never returns
        these, so this is the only path to a request's decision, decider,
        time and comment once it has been decided.
      tags: [approvals]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Decided approval requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequest"
              example:
                - id: 018f2f3a-f000-7000-9c3a-1f2b3c4d5e6f
                  organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                  kind: role_grant
                  target_member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                  requested_by_member_id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                  role: admin
                  status: approved
                  decided_by_member_id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                  decision_reason: Reviewed the change, looks safe to ship.
                  created_at: "2026-01-01T12:00:00Z"
                  decided_at: "2026-01-01T13:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: The session's Member does not hold roles:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: permission_denied
                  message: The member does not have the required permission.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/approval-requests/{approval_request_id}/approve:
    post:
      operationId: approveApprovalRequest
      summary: Approve a pending ApprovalRequest
      description: >-
        Requires a session for a Member holding roles:manage. The deciding
        Member must be different from the Member who requested it and must
        belong to the same Organization as the request. Approving creates
        the "admin" RoleAssignment the request was raised for.
      tags: [approvals]
      security:
        - sessionAuth: []
      parameters:
        - name: approval_request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  description: >-
                    Optional. Persisted alongside the approval decision --
                    see complete-governance-surface's "A Decision May
                    Carry A Comment" requirement (task 8.2).
            example:
              comment: Reviewed the change, looks safe to ship.
      responses:
        "200":
          description: Approval request approved; the admin RoleAssignment was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
              example:
                id: 018f2f3a-f000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                kind: role_grant
                target_member_id: 018f2f3a-d000-7000-9c3a-1f2b3c4d5e6f
                requested_by_member_id: 018f2f3a-c000-7000-9c3a-1f2b3c4d5e6f
                role: admin
                status: approved
                decided_by_member_id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                created_at: "2026-01-01T12:00:00Z"
                decided_at: "2026-01-01T13:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: session_invalid
                  message: A valid bearer session token is required.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "403":
          description: >-
            The session's Member does not hold roles:manage, or the
            request belongs to a different Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: approval_request_organization_mismatch
                  message: Approval request does not belong to your organization.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "404":
          description: The approval request was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: approval_request_not_found
                  message: Approval request was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: >-
            The requester attempted to approve their own request, or the
            request has already been decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                self_decision:
                  value:
                    error:
                      code: approval_self_decision
                      message: A member cannot decide their own approval request.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
                not_pending:
                  value:
                    error:
                      code: approval_not_pending
                      message: Approval request has already been decided.
                      request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

