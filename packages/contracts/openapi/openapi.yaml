              example:
                - id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                  organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                  project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                  environment_id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                  scopes: [config:read]
                  public: false
                  status: active
                  created_at: "2026-01-01T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold credentials:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The environment was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: environment_not_found
                  message: Environment was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/credentials/{credential_id}/rotate:
    post:
      operationId: rotateCredential
      summary: Rotate a credential, keeping the previous secret valid briefly
      description: >-
        Requires a session for a Member holding credentials:manage. Issues a
        replacement secret for the same credential — its identity, scope and
        environment are unchanged — and keeps the previous secret working
        for a bounded grace window, so an integration can be moved over
        without downtime. The replacement token is disclosed in this
        response and never again. A credential belonging to another
        Organization is rejected identically to an unknown one.
      tags: [credentials]
      security:
        - sessionAuth: []
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credential rotated. token is shown here once and never again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedCredential"
              example:
                id: 018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f
                organization_id: 018f2f3a-6000-7000-9c3a-1f2b3c4d5e6f
                project_id: 018f2f3a-7000-7000-9c3a-1f2b3c4d5e6f
                environment_id: 018f2f3a-8000-7000-9c3a-1f2b3c4d5e6f
                scopes: [config:read]
                public: false
                status: active
                created_at: "2026-01-01T12:00:00Z"
                token: svc_018f2f3a-b000-7000-9c3a-1f2b3c4d5e6f.9a1c3e7f3a9c1b2e4d6a8f0c1b3d5e7f
                previous_secret_expires_at: "2026-01-02T12:00:00Z"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The session's Member does not hold credentials:manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >-
            The credential was not found, or belongs to another
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_not_found
                  message: Credential was not found.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f
        "409":
          description: The credential has been revoked, so it cannot be rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: credential_revoked
                  message: A revoked credential cannot be rotated.
                  request_id: 018f2f3a-6f4f-7b3e-9c3a-1f2b3c4d5e6f

  /v1/credentials/{credential_id}/revoke:
    post:
      operationId: revokeCredential
