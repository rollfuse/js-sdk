name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1 and Node >=
      # 22.14.0; "22" alone doesn't guarantee either, so pin explicitly.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: npm ci
        run: npm ci

      # Every merge to main either opens/updates a "Version Packages" PR
      # (when unreleased changesets exist) or, once that PR is itself
      # merged, publishes every package whose version was bumped — never
      # both in the same run. See .changeset/README.md and each package's
      # own README "Publishing" section for the day-to-day flow.
      #
      # Publishing authenticates via OIDC trusted publishing (the
      # `id-token: write` permission above), not a long-lived npm token:
      # each package's "Trusted publishing" settings on npmjs.com name
      # this repository and workflow file explicitly. There is
      # deliberately no NODE_AUTH_TOKEN here.
      - name: Create release PR or publish to npm
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: npm run version
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
